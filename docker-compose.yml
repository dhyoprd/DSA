# Menyalakan antarmuka dan backend dengan satu perintah: `docker compose up`.
#
# Catatan tentang eksekusi kode: **DIPERBARUI ticket #10.** Versi sebelumnya di sini
# menulis "di lokal, Eksekusi Kode tidak lewat Docker — runner dijalankan langsung
# sebagai proses Python". Itu keputusan `docs/design-tree.md` yang **diubah** oleh
# pemilik proyek: runner sekarang dijalankan di kontainer sekali pakai, sama seperti di
# produksi. Alasannya ada di
# `docs/adr/0022-eksekusi-kode-lokal-lewat-docker.md`.
#
# Konsekuensinya untuk Compose ini: backend perlu bisa memanggil Docker di host. Itu
# sebabnya `/var/run/docker.sock` dipasang di service backend di bawah — tanpa itu,
# backend di dalam container tidak bisa membuat kontainer runner.
#
# Image runner dibangun terpisah dan **tidak** didefinisikan sebagai service di sini:
# ia bukan layanan yang hidup terus, melainkan image yang dipanggil berkali-kali dan
# selalu dibuang. Bangun dulu dengan `docker build -t dsa-runner:lokal runner`.

services:
  backend:
    build:
      context: ./backend
    ports:
      # Port host bisa diganti lewat `.env` kalau bentrok dengan proses lain.
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # 0.0.0.0 wajib: kalau bind ke localhost, port itu tidak terlihat dari luar container.
      HOST: "0.0.0.0"
      PORT: "8080"
      RUST_LOG: "dsa_backend=info,tower_http=info"
      # Token rahasia (ADR-0006). Tanpa ini backend menolak menyala — lihat
      # `Config::periksa`. Nilainya dibaca Compose dari `.env` di akar repo.
      API_TOKEN: "${API_TOKEN:?API_TOKEN belum diisi. Salin .env.example menjadi .env, lalu isi nilainya.}"
      # Berkas database SQLite. Diarahkan ke dalam volume bernama di bawah, bukan ke
      # direktori kode, supaya `docker compose restart` tidak menghapusnya dan isinya
      # tidak tercampur berkas dari host.
      DATABASE_PATH: "/data/dsa.db"
      # Image runner yang dipakai menjalankan kode pemelajar. Namanya harus sama
      # dengan yang dibangun di host (`docker build -t dsa-runner:lokal runner`).
      RUNNER_IMAGE: "${RUNNER_IMAGE:-dsa-runner:lokal}"
    volumes:
      # Kode di-bind supaya perubahan langsung terpakai.
      - ./backend:/app
      # `target/` dipisah ke volume bernama supaya hasil kompilasi Linux tidak
      # tercampur artefak Windows dan tidak ikut ter-bind dari host.
      - cargo-target:/app/target
      # Database bertahan antar restart. Di produksi, berkas ini hidup di Fly Volume
      # dan direplikasi LiteFS (ADR-0010); di lokal cukup volume biasa.
      - data-db:/data
      # Socket Docker, supaya backend di dalam container bisa membuat kontainer runner
      # (ADR-0022). Ini memberi backend hak yang besar di mesin host — konsekuensi yang
      # diterima sadar untuk pengembangan lokal, dan **tidak** berlaku di produksi
      # (di sana runner dijalankan sebagai Machine, bukan kontainer lokal).
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./frontend
    ports:
      # Di Windows, sebagian rentang port direservasi Hyper-V/WSL2, dan port yang
      # jatuh di dalamnya tidak bisa di-bind. Ganti `FRONTEND_PORT` di `.env` kalau itu terjadi.
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Dibaca di sisi server oleh rewrite di next.config.ts. Karena server yang
      # memanggil, alamatnya memakai nama service Compose, bukan localhost.
      BACKEND_URL: "http://backend:8080"
      # Docker Desktop di Windows tidak meneruskan event filesystem dari host,
      # jadi watcher webpack harus polling. Penjelasan di README, bagian "Hot reload".
      WATCHPACK_POLLING: "true"
    volumes:
      # Kode di-bind, tetapi `node_modules` dan `.next` dikecualikan supaya isi
      # image (binary Linux) tidak tertimpa oleh folder milik host.
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      # Materi dan Soal dibaca saat build dan saat dev, dan letaknya di luar
      # `frontend/`. Tanpa bind ini, gerbang validasi konten tidak menemukan
      # berkasnya dan build gagal. Dipasang read-only karena antarmuka hanya membaca,
      # tidak pernah menulis ke sini — Materi diedit lewat git, bukan lewat situs.
      # Tujuan `/content` cocok dengan bawaan `direktoriKonten()` di
      # `src/lib/konten/muat.ts`, yang mencari `../content` dari direktori kerja
      # container (`/app`).
      - ./content:/content:ro
    depends_on:
      - backend

volumes:
  cargo-target:
  # Berkas SQLite backend. Volume bernama, bukan bind ke host, supaya berkas
  # database tidak ikut terlihat git dan tidak tercampur antar mesin.
  data-db:

# Jalur — daftar lengkap 12 Topik.
#
# Berkas ini mendeklarasikan seluruh Jalur lebih dulu, termasuk Topik yang berkasnya
# belum ditulis. Itu perlu karena `prasyarat` harus bisa diperiksa terhadap daftar
# yang lengkap: Stack adalah Topik nomor 4 dengan `prasyarat: [3]`, padahal Topik 3
# belum tentu sudah ditulis. Tanpa daftar ini, prasyarat yang sah akan tampak seperti
# prasyarat yang menunjuk Topik tidak ada.
#
# Berkas Topik (`content/<slug>.yaml`) hanya ada untuk Topik yang sudah siap. Topik
# yang belum punya berkas tampil redup dan berlabel "segera" di sidebar (#4).
#
# `nomor`, `slug`, `judul`, dan `prasyarat` di sini wajib sama dengan yang ada di
# berkas Topik. Validator menolak build kalau keduanya berbeda.

topik:

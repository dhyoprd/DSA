  # --- Kuis 1: melacak gelembung polos — berapa perbandingan putaran pertama -----
  - tipe: kuis
    skenario:
      id: |
        Fungsi berikut mengurutkan sebuah larik dengan pengurutan gelembung **polos**:
        tidak ada henti-awal, jadi perulangan luarnya selalu berjalan penuh.

        Untuk larik `[4, 1, 3, 2]`, berapa perbandingan yang terjadi pada **putaran
        pertama** perulangan luar, dan seperti apa isi lariknya setelah putaran itu?
      en: |
        The function below sorts an array with **plain** bubble sort: there is no early
        stop, so the outer loop always runs to completion.

        For the array `[4, 1, 3, 2]`, how many comparisons happen on the **first pass**
        of the outer loop, and what does the array look like after that pass?
    kode: |
      def urut_gelembung(data):
          n = len(data)
          for i in range(n):
              for j in range(n - 1 - i):
                  if data[j] > data[j + 1]:
                      data[j], data[j + 1] = data[j + 1], data[j]
          return data
    opsi:
      - teks:
          id: 3 perbandingan, dan lariknya menjadi `[1, 3, 2, 4]`
          en: 3 comparisons, and the array becomes `[1, 3, 2, 4]`
        benar: true
      - teks:
          id: 4 perbandingan, dan lariknya menjadi `[1, 3, 2, 4]`
          en: 4 comparisons, and the array becomes `[1, 3, 2, 4]`
        benar: false
      - teks:
          id: 3 perbandingan, dan lariknya menjadi `[1, 2, 3, 4]`
          en: 3 comparisons, and the array becomes `[1, 2, 3, 4]`
        benar: false
      - teks:
          id: 6 perbandingan, dan lariknya menjadi `[1, 2, 3, 4]`
          en: 6 comparisons, and the array becomes `[1, 2, 3, 4]`
        benar: false
    penjelasan:
      id: |
        **Pendekatan.** Pada putaran pertama, `i = 0`, sehingga perulangan dalamnya
        berjalan dari `j = 0` sampai `j = n - 2`. Untuk `n = 4`, itu `j = 0, 1, 2` —
        **3 perbandingan**. Perulangan luarnya belum pernah dijalankan, jadi belum ada
        elemen yang "diamankan" di ujung kanan.

        Lacak setiap perbandingannya:

        - `j = 0`: bandingkan `4` dan `1`. `4 > 1`, jadi tukar → `[1, 4, 3, 2]`
        - `j = 1`: bandingkan `4` dan `3`. `4 > 3`, jadi tukar → `[1, 3, 4, 2]`
        - `j = 2`: bandingkan `4` dan `2`. `4 > 2`, jadi tukar → `[1, 3, 2, 4]`

        Setelah putaran pertama, lariknya `[1, 3, 2, 4]` — dan perhatikan bahwa `4`,
        yang terbesar, sudah sampai di ujung kanan. Itulah yang membuat putaran
        berikutnya hanya perlu memeriksa `n - 2 = 2` pasangan.

        **Kompleksitas.** Satu putaran penuh memeriksa `n - 1` pasangan, jadi waktunya
        `O(n)` untuk putaran itu. Seluruh pengurutannya `O(n²)`, karena ada `n` putaran.
        Ruangnya `O(1)` — lariknya diubah di tempat, tanpa larik baru.

        **Kode referensi.**

        ```python
        def urut_gelembung(data):
            n = len(data)
            for i in range(n):
                for j in range(n - 1 - i):
                    if data[j] > data[j + 1]:
                        data[j], data[j + 1] = data[j + 1], data[j]
            return data

        print(urut_gelembung([4, 1, 3, 2]))   # [1, 2, 3, 4]
        ```

        **Jebakan umum.** Jawaban **4 perbandingan** datang dari memakai `n` bukan
        `n - 1` di perulangan dalam — itu membandingkan pasangan terakhir yang tidak
        ada. Jawaban **`[1, 2, 3, 4]`** mengira satu putaran sudah mengurutkan
        seluruhnya, padahal satu putaran hanya menggelembungkan **satu** elemen
        terbesar ke ujung kanan; sisa lariknya masih perlu diurutkan. Jawaban **6
        perbandingan** menghitung seluruh pengurutannya (`4 × 3 / 2 = 6`), bukan satu
        putaran saja — padahal pertanyaannya khusus putaran pertama.
      en: |
        **Approach.** On the first pass, `i = 0`, so the inner loop runs from `j = 0` to
        `j = n - 2`. For `n = 4` that is `j = 0, 1, 2` — **3 comparisons**. The outer
        loop has not completed a pass yet, so no element has been "secured" at the right
        end.

        Trace each comparison:

        - `j = 0`: compare `4` and `1`. `4 > 1`, so swap → `[1, 4, 3, 2]`
        - `j = 1`: compare `4` and `3`. `4 > 3`, so swap → `[1, 3, 4, 2]`
        - `j = 2`: compare `4` and `2`. `4 > 2`, so swap → `[1, 3, 2, 4]`

        After the first pass the array is `[1, 3, 2, 4]` — and notice that `4`, the
        largest, has reached the right end. That is why the next pass only needs to
        check `n - 2 = 2` pairs.

        **Complexity.** A single full pass checks `n - 1` pairs, so its time is `O(n)`.
        The whole sort is `O(n²)`, because there are `n` passes. The space is `O(1)` —
        the array is changed in place, with no new array.

        **Reference code.**

        ```python
        def urut_gelembung(data):
            n = len(data)
            for i in range(n):
                for j in range(n - 1 - i):
                    if data[j] > data[j + 1]:
                        data[j], data[j + 1] = data[j + 1], data[j]
            return data

        print(urut_gelembung([4, 1, 3, 2]))   # [1, 2, 3, 4]
        ```

        **Common trap.** The answer **4 comparisons** comes from using `n` instead of
        `n - 1` in the inner loop — that compares a final pair that does not exist. The
        answer **`[1, 2, 3, 4]`** assumes one pass sorts everything, but a single pass
        only bubbles **one** largest element to the right end; the rest of the array
        still needs sorting. The answer **6 comparisons** counts the whole sort
        (`4 × 3 / 2 = 6`), not one pass — but the question is specifically about the
        first pass.

  # --- Kuis 2: melacak langkah penggabungan -------------------------------------
  - tipe: kuis
    skenario:
      id: |
        Fungsi `gabung` menyatukan dua bagian yang masing-masing sudah terurut menjadi
        satu bagian terurut. Ia membandingkan elemen paling depan dari kedua bagian,
        mengambil yang lebih kecil, lalu mengulangi.

        Berapa perbandingan yang terjadi saat menggabungkan `[2, 5, 9]` dengan
        `[1, 6]`, dan apa hasilnya?
      en: |
        The `gabung` function combines two parts that are each already sorted into one
        sorted part. It compares the front element of both parts, takes the smaller one,
        then repeats.

        How many comparisons happen when merging `[2, 5, 9]` with `[1, 6]`, and what is
        the result?
    kode: |
      def gabung(kiri, kanan):
          hasil = []
          i = 0
          j = 0
          while i < len(kiri) and j < len(kanan):
              if kiri[i] <= kanan[j]:
                  hasil.append(kiri[i])
                  i += 1
              else:
                  hasil.append(kanan[j])
                  j += 1
          hasil.extend(kiri[i:])
          hasil.extend(kanan[j:])
          return hasil

      print(gabung([2, 5, 9], [1, 6]))
    opsi:
      - teks:
          id: 4 perbandingan, hasilnya `[1, 2, 5, 6, 9]`
          en: 4 comparisons, the result is `[1, 2, 5, 6, 9]`
        benar: true
      - teks:
          id: 5 perbandingan, hasilnya `[1, 2, 5, 6, 9]`
          en: 5 comparisons, the result is `[1, 2, 5, 6, 9]`
        benar: false
      - teks:
          id: 3 perbandingan, hasilnya `[1, 2, 5, 6, 9]`
          en: 3 comparisons, the result is `[1, 2, 5, 6, 9]`
        benar: false
      - teks:
          id: 4 perbandingan, hasilnya `[1, 2, 5, 9, 6]`
          en: 4 comparisons, the result is `[1, 2, 5, 9, 6]`
        benar: false
    penjelasan:
      id: |
        **Pendekatan.** Perbandingan hanya terjadi di dalam perulangan `while`, yaitu
        selama **kedua** bagian masih punya elemen. Begitu salah satu bagian habis,
        sisanya disalin tanpa perbandingan.

        Lacak langkahnya:

        - bandingkan `2` vs `1` → `1` lebih kecil, ambil `1` (kanan). Sisa: kiri
          `[2, 5, 9]`, kanan `[6]`
        - bandingkan `2` vs `6` → `2` lebih kecil, ambil `2` (kiri). Sisa: kiri
          `[5, 9]`, kanan `[6]`
        - bandingkan `5` vs `6` → `5` lebih kecil, ambil `5` (kiri). Sisa: kiri `[9]`,
          kanan `[6]`
        - bandingkan `9` vs `6` → `6` lebih kecil, ambil `6` (kanan). Sisa: kiri
          `[9]`, kanan kosong

        Bagian kanan habis, jadi perulangannya berhenti dan `9` disalin tanpa
        perbandingan. Seluruhnya **4 perbandingan**, hasilnya `[1, 2, 5, 6, 9]`.

        **Kompleksitas.** Setiap perbandingan memindahkan tepat satu elemen ke hasil,
        jadi menggabungkan dua bagian berukuran total `n` memakan waktu `O(n)`. Ruangnya
        juga `O(n)`, karena hasilnya ditampung di larik baru.

        **Kode referensi.**

        ```python
        def gabung(kiri, kanan):
            hasil = []
            i = 0
            j = 0
            while i < len(kiri) and j < len(kanan):
                if kiri[i] <= kanan[j]:
                    hasil.append(kiri[i])
                    i += 1
                else:
                    hasil.append(kanan[j])
                    j += 1
            hasil.extend(kiri[i:])
            hasil.extend(kanan[j:])
            return hasil

        print(gabung([2, 5, 9], [1, 6]))   # [1, 2, 5, 6, 9]
        ```

        **Jebakan umum.** Jawaban **5 perbandingan** mengira sisa `9` juga
        dibandingkan — padahal setelah bagian kanan habis, perulangan `while` berhenti
        dan sisanya disalin apa adanya. Jawaban **3 perbandingan** mengira penggabungan
        berhenti begitu salah satu bagian tinggal satu elemen, padahal perbandingan
        terakhir (`9` vs `6`) tetap terjadi selama kedua bagian masih berisi. Jawaban
        **`[1, 2, 5, 9, 6]`** menyalin sisa bagian kiri sebelum membandingkannya —
        hasil penggabungan dua bagian terurut harus selalu terurut, dan `9` sebelum `6`
        tidak terurut.
      en: |
        **Approach.** Comparisons only happen inside the `while` loop, that is while
        **both** parts still hold elements. Once one part is empty, the rest is copied
        without comparison.

        Trace the steps:

        - compare `2` vs `1` → `1` is smaller, take `1` (right). Left: `[2, 5, 9]`,
          right: `[6]`
        - compare `2` vs `6` → `2` is smaller, take `2` (left). Left: `[5, 9]`,
          right: `[6]`
        - compare `5` vs `6` → `5` is smaller, take `5` (left). Left: `[9]`,
          right: `[6]`
        - compare `9` vs `6` → `6` is smaller, take `6` (right). Left: `[9]`,
          right: empty

        The right part is empty, so the loop stops and `9` is copied with no comparison.
        That is **4 comparisons** in all, and the result is `[1, 2, 5, 6, 9]`.

        **Complexity.** Each comparison moves exactly one element into the result, so
        merging two parts totalling `n` elements takes `O(n)` time. The space is also
        `O(n)`, because the result is held in a new array.

        **Reference code.**

        ```python
        def gabung(kiri, kanan):
            hasil = []
            i = 0
            j = 0
            while i < len(kiri) and j < len(kanan):
                if kiri[i] <= kanan[j]:
                    hasil.append(kiri[i])
                    i += 1
                else:
                    hasil.append(kanan[j])
                    j += 1
            hasil.extend(kiri[i:])
            hasil.extend(kanan[j:])
            return hasil

        print(gabung([2, 5, 9], [1, 6]))   # [1, 2, 5, 6, 9]
        ```

        **Common trap.** The answer **5 comparisons** assumes the leftover `9` is also
        compared — but once the right part is empty the `while` loop stops and the rest
        is copied as is. The answer **3 comparisons** assumes the merge stops as soon as
        one part has a single element left, but the final comparison (`9` vs `6`) still
        happens while both parts hold elements. The answer **`[1, 2, 5, 9, 6]`** copies
        the leftover left part before comparing it — the result of merging two sorted
        parts must always be sorted, and `9` before `6` is not.

  # --- Kuis 3: gelembung polos lawan gabung pada data yang sama ----------------
  - tipe: kuis
    skenario:
      id: |
        Dua fungsi berikut mengurutkan larik dengan aturan yang berbeda: yang pertama
        pengurutan gelembung **polos**, yang kedua pengurutan gabung. Keduanya
        mengembalikan jumlah perbandingan yang mereka lakukan.

        Untuk larik berisi 16 elemen yang **sudah terurut** `[1, 2, 3, …, 16]`,
        manakah yang benar?
      en: |
        The two functions below sort an array by different rules: the first is **plain**
        bubble sort, the second is merge sort. Both return the number of comparisons they
        made.

        For an array of 16 elements that is **already sorted** `[1, 2, 3, …, 16]`, which
        one is correct?
    kode: |
      def banding_gelembung(data):
          data = list(data)
          n = len(data)
          banding = 0
          for i in range(n):
              for j in range(n - 1 - i):
                  banding += 1
                  if data[j] > data[j + 1]:
                      data[j], data[j + 1] = data[j + 1], data[j]
          return banding

      def banding_gabung(data):
          if len(data) <= 1:
              return 0
          tengah = len(data) // 2
          kiri = list(data[:tengah])
          kanan = list(data[tengah:])
          banding = banding_gabung(kiri) + banding_gabung(kanan)
          i = 0
          j = 0
          while i < len(kiri) and j < len(kanan):
              banding += 1
              if kiri[i] <= kanan[j]:
                  i += 1
              else:
                  j += 1
          return banding
    opsi:
      - teks:
          id: Gelembung 120 perbandingan, gabung 32 — gelembung tetap jauh lebih banyak meskipun datanya sudah terurut
          en: Bubble makes 120 comparisons, merge 32 — bubble still makes far more even though the data is already sorted
        benar: true
      - teks:
          id: Gelembung 15 perbandingan, gabung 32 — karena datanya sudah terurut, gelembung justru lebih hemat
          en: Bubble makes 15 comparisons, merge 32 — because the data is already sorted, bubble is actually cheaper
        benar: false
      - teks:
          id: Gelembung 120 perbandingan, gabung 120 — keduanya sama karena mengurutkan data yang sama
          en: Bubble makes 120 comparisons, merge 120 — both are the same because they sort the same data
        benar: false
      - teks:
          id: Gelembung 120 perbandingan, gabung 64 — gabung memakai n log n = 16 × 4
          en: Bubble makes 120 comparisons, merge 64 — merge uses n log n = 16 × 4
        benar: false
    penjelasan:
      id: |
        **Pendekatan.** Kuncinya ada di bentuk perulangan gelembung: **polos**, tanpa
        henti-awal. Perulangan luarnya selalu berjalan `n` kali, dan perulangan dalamnya
        selalu memeriksa seluruh pasangan yang tersisa — tidak peduli apakah datanya
        sudah terurut.

        Untuk gelembung, jumlah perbandingannya selalu

        `n × (n - 1) / 2 = 16 × 15 / 2 = 120`

        Untuk gabung, hitung per tingkat pembelahan: 16 elemen membelah menjadi tingkat
        berukuran 8, 4, 2, dan 1 — jadi ada 4 tingkat. Pada setiap tingkat, seluruh
        penggabungan bersama-sama melakukan perbandingan sebanyak setengah jumlah
        elemen, yaitu `16 / 2 = 8`. Seluruhnya `4 × 8 = 32`.

        Jadi **120 lawan 32**. Gelembung tetap jauh lebih banyak, meskipun datanya sudah
        terurut sempurna.

        **Kompleksitas.** Gelembung `O(n²)` karena dua perulangan bersarang, dan
        jumlahnya tidak bergantung pada isi data. Gabung `O(n log n)`: 4 tingkat
        (`log 16 = 4`), masing-masing `O(n)`. Ruangnya: gelembung `O(1)` karena
        mengurutkan di tempat, gabung `O(n)` karena membuat larik baru.

        **Kode referensi.**

        ```python
        def banding_gelembung(data):
            data = list(data)
            banding = 0
            for i in range(len(data)):
                for j in range(len(data) - 1 - i):
                    banding += 1
                    if data[j] > data[j + 1]:
                        data[j], data[j + 1] = data[j + 1], data[j]
            return banding


        def banding_gabung(data):
            if len(data) <= 1:
                return 0
            tengah = len(data) // 2
            kiri = list(data[:tengah])
            kanan = list(data[tengah:])
            banding = banding_gabung(kiri) + banding_gabung(kanan)
            i = j = 0
            while i < len(kiri) and j < len(kanan):
                banding += 1
                if kiri[i] <= kanan[j]:
                    i += 1
                else:
                    j += 1
            return banding


        print(banding_gelembung(list(range(1, 17))))   # 120
        print(banding_gabung(list(range(1, 17))))      # 32
        ```

        **Jebakan umum.** Jawaban **15 lawan 32** datang dari gelembung **berhenti-awal**
        — bentuk yang berhenti begitu satu putaran tidak ada pertukaran. Pada data yang
        sudah terurut, bentuk itu memang hanya butuh `n - 1 = 15` perbandingan. Kode di
        soal ini **tidak** memakai henti-awal, jadi perulangan luarnya tetap berjalan
        penuh. Jawaban **120 lawan 120** mengira kedua algoritma memakai aturan yang
        sama. Jawaban **64** menghitung `n log n` sebagai angka perbandingan langsung
        (`16 × 4`), padahal `n log n` hanya menggambarkan laju pertumbuhannya — angka
        perbandingan sesungguhnya adalah **32**.
      en: |
        **Approach.** The key is the shape of the bubble loop: **plain**, with no early
        stop. The outer loop always runs `n` times, and the inner loop always checks
        every remaining pair — no matter whether the data is already sorted.

        For bubble, the comparison count is always

        `n × (n - 1) / 2 = 16 × 15 / 2 = 120`

        For merge, count per splitting level: 16 elements split into levels of size 8,
        4, 2, and 1 — so there are 4 levels. At each level, all the merges together make
        comparisons equal to half the number of elements, that is `16 / 2 = 8`. In all,
        `4 × 8 = 32`.

        So **120 versus 32**. Bubble still makes far more, even though the data is
        perfectly sorted.

        **Complexity.** Bubble is `O(n²)` because of the two nested loops, and the count
        does not depend on the data. Merge is `O(n log n)`: 4 levels (`log 16 = 4`), each
        `O(n)`. As for space: bubble is `O(1)` because it sorts in place, merge is `O(n)`
        because it creates new arrays.

        **Reference code.**

        ```python
        def banding_gelembung(data):
            data = list(data)
            banding = 0
            for i in range(len(data)):
                for j in range(len(data) - 1 - i):
                    banding += 1
                    if data[j] > data[j + 1]:
                        data[j], data[j + 1] = data[j + 1], data[j]
            return banding


        def banding_gabung(data):
            if len(data) <= 1:
                return 0
            tengah = len(data) // 2
            kiri = list(data[:tengah])
            kanan = list(data[tengah:])
            banding = banding_gabung(kiri) + banding_gabung(kanan)
            i = j = 0
            while i < len(kiri) and j < len(kanan):
                banding += 1
                if kiri[i] <= kanan[j]:
                    i += 1
                else:
                    j += 1
            return banding


        print(banding_gelembung(list(range(1, 17))))   # 120
        print(banding_gabung(list(range(1, 17))))      # 32
        ```

        **Common trap.** The answer **15 versus 32** comes from **early-stopping** bubble
        — the form that stops as soon as a pass makes no swap. On already-sorted data
        that form really does need only `n - 1 = 15` comparisons. The code in this
        question does **not** use early stopping, so its outer loop still runs to
        completion. The answer **120 versus 120** assumes both algorithms use the same
        rule. The answer **64** treats `n log n` as a direct comparison count
        (`16 × 4`), but `n log n` only describes its growth rate — the actual comparison
        count is **32**.

  # --- Kuis 4: memilih algoritma untuk data yang hampir terurut -----------------
  - tipe: kuis
    skenario:
      id: |
        Sebuah sistem menerima daftar nilai ujian yang **sudah hampir terurut**: dari
        10.000 baris, hanya sekitar 20 baris yang salah tempat, dan masing-masing hanya
        bergeser sedikit dari posisi seharusnya.

        Kamu perlu mengurutkannya kembali secepat mungkin, dan kamu **tidak boleh
        memakai fungsi pengurutan bawaan** seperti `sorted()` atau `list.sort()`.

        Algoritma mana yang paling tepat dipilih, dan kenapa?
      en: |
        A system receives a list of exam scores that is **already nearly sorted**: out of
        10,000 rows, only about 20 are out of place, and each is only a little away from
        where it belongs.

        You need to sort it again as fast as possible, and you **may not use a built-in
        sort** such as `sorted()` or `list.sort()`.

        Which algorithm is the best choice, and why?
    opsi:
      - teks:
          id: Pengurutan sisip, karena pada data yang hampir terurut setiap kunci hanya bergeser sedikit — kerjanya mendekati O(n), bukan O(n²)
          en: Insertion sort, because on nearly sorted data each key shifts only a little — its work is close to O(n), not O(n²)
        benar: true
      - teks:
          id: Pengurutan gelembung, karena ia selalu memakai paling sedikit perbandingan di antara ketiga algoritma
          en: Bubble sort, because it always uses the fewest comparisons of the three algorithms
        benar: false
      - teks:
          id: Pengurutan gabung, karena O(n log n) selalu yang tercepat, apa pun bentuk datanya
          en: Merge sort, because O(n log n) is always the fastest, whatever the shape of the data
        benar: false
      - teks:
          id: Ketiganya sama cepatnya, karena yang menentukan kecepatan adalah banyaknya elemen, bukan susunan datanya
          en: All three are equally fast, because what decides speed is the number of elements, not the arrangement of the data
        benar: false
    penjelasan:
      id: |
        **Pendekatan.** Perhatikan kata "hampir terurut". Setiap algoritma punya bentuk
        data yang paling menguntungkan, dan pengurutan sisip unggul justru pada bentuk
        ini.

        Pengurutan sisip menyisipkan satu elemen ke bagian kiri yang sudah terurut. Pada
        data yang hampir terurut, setiap kunci hampir selalu sudah berada di tempatnya,
        jadi perulangan `while`-nya berhenti setelah satu perbandingan. Untuk 10.000
        baris dengan hanya 20 yang salah tempat, kerjanya mendekati `n` perbandingan —
        sekitar 10.000, bukan ratusan juta.

        Bandingkan dengan yang lain:

        - **Gelembung polos** selalu memakai `n × (n - 1) / 2` perbandingan. Untuk
          10.000 elemen itu **49.995.000** perbandingan — hampir 50 juta, meskipun
          datanya hampir terurut.
        - **Gabung** selalu `O(n log n)`, dan jumlahnya hampir tidak peduli datanya
          hampir terurut atau tidak. Untuk 10.000 elemen, data yang sudah terurut
          memakai **64.608** perbandingan dan data yang 20 barisnya salah tempat memakai
          **64.620** — bedanya hanya belasan. Jauh lebih baik daripada gelembung, tetapi
          masih sekitar enam kali lebih banyak daripada sisip pada data seperti ini.

        Jadi pengurutan sisip adalah pilihan terbaik untuk kasus ini.

        **Kompleksitas.** Sisip pada data yang sudah terurut `O(n)`; pada data yang
        terbalik `O(n²)`; pada data hampir terurut kerjanya di antara keduanya, dan untuk
        kasus ini mendekati `O(n)`. Ruangnya `O(1)` karena mengurutkan di tempat.

        **Kode referensi.**

        ```python
        def urut_sisip(data):
            for i in range(1, len(data)):
                kunci = data[i]
                j = i - 1
                while j >= 0 and data[j] > kunci:
                    data[j + 1] = data[j]
                    j -= 1
                data[j + 1] = kunci
            return data

        print(urut_sisip([1, 2, 4, 3, 5, 6, 8, 7]))   # [1, 2, 3, 4, 5, 6, 7, 8]
        ```

        **Jebakan umum.** Jawaban **gelembung** salah karena gelembung polos **tidak**
        memanfaatkan sifat hampir terurut sama sekali: jumlah perbandingannya tetap
        `n × (n - 1) / 2` apa pun isi datanya. Jawaban **gabung** salah karena `O(n log n)`
        memang selalu baik, tetapi bukan yang **terbaik** di sini — pada data yang hampir
        terurut, `O(n)` dari sisip lebih hemat. Jawaban **ketiganya sama** salah karena
        susunan data memengaruhi banyaknya perbandingan dengan derajat yang sangat
        berbeda: gelembung sama sekali tidak terpengaruh (selalu `n × (n - 1) / 2`),
        sisip sangat terpengaruh (dari `O(n²)` sampai `O(n)`), dan gabung hampir tidak
        terpengaruh (hanya berbeda belasan dari puluhan ribu). Itu sebabnya tidak ada
        satu algoritma yang selalu menang.
      en: |
        **Approach.** Notice the phrase "nearly sorted". Every algorithm has a data shape
        that suits it best, and insertion sort excels on exactly this shape.

        Insertion sort inserts one element into the already-sorted left part. On nearly
        sorted data, every key is almost always already in place, so its `while` loop
        stops after one comparison. For 10,000 rows with only 20 out of place, its work is
        close to `n` comparisons — about 10,000, not hundreds of millions.

        Compare that with the others:

        - **Plain bubble** always uses `n × (n - 1) / 2` comparisons. For 10,000 elements
          that is **49,995,000** comparisons — almost 50 million, even though the data is
          nearly sorted.
        - **Merge** is always `O(n log n)`, and its count barely cares whether the data
          is nearly sorted or not. For 10,000 elements, already-sorted data takes
          **64,608** comparisons and data with 20 rows out of place takes **64,620** —
          a difference of barely a dozen. Far better than bubble, but still about six
          times more than insertion on data like this.

        So insertion sort is the best choice for this case.

        **Complexity.** Insertion is `O(n)` on already-sorted data; `O(n²)` on reversed
        data; on nearly sorted data its work lies between the two, and for this case it is
        close to `O(n)`. Its space is `O(1)` because it sorts in place.

        **Reference code.**

        ```python
        def urut_sisip(data):
            for i in range(1, len(data)):
                kunci = data[i]
                j = i - 1
                while j >= 0 and data[j] > kunci:
                    data[j + 1] = data[j]
                    j -= 1
                data[j + 1] = kunci
            return data

        print(urut_sisip([1, 2, 4, 3, 5, 6, 8, 7]))   # [1, 2, 3, 4, 5, 6, 7, 8]
        ```

        **Common trap.** The answer **bubble** is wrong because plain bubble does **not**
        exploit nearly sorted data at all: its comparison count stays `n × (n - 1) / 2`
        whatever the data holds. The answer **merge** is wrong because `O(n log n)` is
        indeed always good, but not the **best** here — on nearly sorted data, the `O(n)`
        of insertion is cheaper. The answer **all three are equal** is wrong because the
        arrangement of the data affects the comparison count to very different degrees:
        bubble is not affected at all (always `n × (n - 1) / 2`), insertion is strongly
        affected (from `O(n²)` down to `O(n)`), and merge is barely affected (differing
        by only a dozen out of tens of thousands). That is why no single algorithm always
        wins.

  # --- Kuis 5: pengurutan gabung itu stabil ------------------------------------
  - tipe: kuis
    skenario:
      id: |
        Sebuah aplikasi menyimpan daftar siswa dengan nilai ujiannya. Daftar itu **sudah
        terurut menurut nama**. Aplikasi lalu mengurutkannya lagi menurut **nilai**,
        memakai pengurutan gabung dengan aturan `kiri[i] <= kanan[j]` seperti di Materi.

        Ada dua siswa bernama Aldi dan Budi yang nilainya sama, yaitu 80. Aldi muncul
        lebih dulu daripada Budi di daftar yang terurut menurut nama.

        Setelah diurutkan menurut nilai, bagaimana urutan Aldi dan Budi — dan kenapa?
      en: |
        An app stores a list of students with their exam scores. That list is **already
        sorted by name**. The app then sorts it again by **score**, using merge sort with
        the rule `kiri[i] <= kanan[j]` as in the Material.

        Two students, Aldi and Budi, have the same score of 80. Aldi appears before Budi
        in the name-sorted list.

        After sorting by score, what is the order of Aldi and Budi — and why?
    opsi:
      - teks:
          id: Aldi tetap lebih dulu daripada Budi, karena aturan `<=` mengambil dari bagian kiri saat nilainya sama — pengurutan gabung mempertahankan urutan asli elemen yang nilainya sama
          en: Aldi still comes before Budi, because the `<=` rule takes from the left on equal values — merge sort preserves the original order of equal elements
        benar: true
      - teks:
          id: Budi akan lebih dulu daripada Aldi, karena pengurutan gabung membalik urutan elemen yang nilainya sama pada setiap penggabungan
          en: Budi will come before Aldi, because merge sort reverses the order of equal elements at every merge
        benar: false
      - teks:
          id: Urutannya acak, karena kedua siswa nilainya sama sehingga tidak ada aturan yang menentukan siapa lebih dulu
          en: The order is arbitrary, because the two students have the same score so no rule decides who comes first
        benar: false
      - teks:
          id: Aldi tetap lebih dulu, karena pengurutan gabung selalu mempertahankan urutan asli seluruh data tanpa kecuali
          en: Aldi still comes first, because merge sort always preserves the original order of the whole data without exception
        benar: false
    penjelasan:
      id: |
        **Pendekatan.** Perhatikan aturan pembandingnya: `kiri[i] <= kanan[j]`. Tanda
        `<=` berarti "kurang dari **atau sama dengan**", jadi ketika kedua nilainya sama,
        syaratnya tetap terpenuhi dan yang diambil adalah elemen dari **kiri**.

        Sekarang perhatikan dari mana asal "kiri" dan "kanan". Sebelum diurutkan menurut
        nilai, daftarnya sudah terurut menurut nama — dan Aldi ada sebelum Budi. Saat
        kedua siswa itu bertemu di dalam satu penggabungan, Aldi berada di bagian kiri
        dan Budi di bagian kanan (atau keduanya di bagian yang sama, dan urutannya sudah
        terjaga dari penggabungan sebelumnya). Karena nilainya sama, aturan `<=`
        mengambil Aldi lebih dulu.

        Sifat inilah yang disebut **pengurutan stabil**: pengurutan yang tidak mengubah
        urutan asli dua elemen yang nilainya sama. Itu berguna justru untuk kasus seperti
        ini — mengurutkan ulang data yang sudah terurut menurut kunci lain, sehingga
        urutan pertama tetap terjaga sebagai urutan kedua.

        **Kompleksitas.** Mengurutkan 10.000 siswa memakai pengurutan gabung `O(n log n)`
        waktu dan `O(n)` ruang tambahan. Sifat stabilnya tidak menambah biaya apa pun —
        ia hanya bergantung pada pemilihan `<=` alih-alih `<`.

        **Kode referensi.**

        ```python
        def gabung(kiri, kanan):
            hasil = []
            i = 0
            j = 0
            while i < len(kiri) and j < len(kanan):
                if kiri[i] <= kanan[j]:      # <= membuatnya stabil
                    hasil.append(kiri[i])
                    i += 1
                else:
                    hasil.append(kanan[j])
                    j += 1
            hasil.extend(kiri[i:])
            hasil.extend(kanan[j:])
            return hasil

        # (nama, nilai) sudah terurut menurut nama
        siswa = [("Aldi", 80), ("Budi", 80)]
        print(gabung([siswa[0]], [siswa[1]]))   # [('Aldi', 80), ('Budi', 80)]
        ```

        **Jebakan umum.** Jawaban **Budi lebih dulu** datang dari memakai `<` alih-alih
        `<=`: dengan `<`, saat nilainya sama syaratnya **tidak** terpenuhi, sehingga yang
        diambil justru elemen dari kanan — dan urutan elemen yang nilainya sama berbalik.
        Jawaban **urutannya acak** salah karena pengurutan gabung sepenuhnya
        deterministik: hasilnya bisa diprediksi persis dari data masukannya. Jawaban
        **seluruh data dipertahankan urutannya** salah karena pengurutan **stabil** hanya
        menjamin hal itu untuk elemen yang **nilainya sama**, bukan untuk seluruh data —
        siswa bernilai 90 yang tadinya di depan tetap akan berpindah ke belakang siswa
        bernilai 70, karena urutannya sekarang ditentukan oleh nilai.
      en: |
        **Approach.** Look at the comparison rule: `kiri[i] <= kanan[j]`. The `<=` sign
        means "less than **or equal to**", so when the two values are equal the condition
        still holds and the element taken comes from the **left**.

        Now look at where "left" and "right" come from. Before being sorted by score, the
        list was already sorted by name — and Aldi comes before Budi. When those two
        students meet inside one merge, Aldi is in the left part and Budi in the right
        (or both are in the same part, with their order already preserved by an earlier
        merge). Because their values are equal, the `<=` rule takes Aldi first.

        This property is called a **stable sort**: a sort that does not change the
        original order of two elements with equal values. It is useful precisely for
        cases like this — re-sorting data that is already sorted by another key, so the
        first order survives as the second.

        **Complexity.** Sorting 10,000 students with merge sort is `O(n log n)` time and
        `O(n)` extra space. Its stability adds no cost at all — it depends only on
        choosing `<=` rather than `<`.

        **Reference code.**

        ```python
        def gabung(kiri, kanan):
            hasil = []
            i = 0
            j = 0
            while i < len(kiri) and j < len(kanan):
                if kiri[i] <= kanan[j]:      # <= makes it stable
                    hasil.append(kiri[i])
                    i += 1
                else:
                    hasil.append(kanan[j])
                    j += 1
            hasil.extend(kiri[i:])
            hasil.extend(kanan[j:])
            return hasil

        # (name, score) already sorted by name
        siswa = [("Aldi", 80), ("Budi", 80)]
        print(gabung([siswa[0]], [siswa[1]]))   # [('Aldi', 80), ('Budi', 80)]
        ```

        **Common trap.** The answer **Budi comes first** comes from using `<` instead of
        `<=`: with `<`, when the values are equal the condition is **not** met, so the
        element taken is the one from the right — and the order of equal elements is
        reversed. The answer **the order is arbitrary** is wrong because merge sort is
        fully deterministic: its result can be predicted exactly from its input. The
        answer **the whole data keeps its order** is wrong because a **stable** sort only
        guarantees that for elements with **equal values**, not for all the data — a
        student scoring 90 who was in front will still move behind a student scoring 70,
        because the order is now decided by the score.

  # --- Soal Kode: dua algoritma pengurutan dari nol, kembalikan jumlah banding ---
  #
  # Bentuknya menyimpang dari `docs/design-tree.md` ("implementasi struktur data dari
  # nol"), karena Sorting bukan struktur data. Yang diminta: menulis dua algoritma
  # pengurutan dari nol, masing-masing mengembalikan pasangan (hasil, jumlah
  # perbandingan), sehingga beda O(n²) dan O(n log n) terasa sebagai angka yang bisa
  # diperiksa test case. Keputusannya di ADR-0026.
  #
  # Gelembung di sini **polos** — tanpa henti-awal — supaya jumlah perbandingannya
  # selalu n × (n - 1) / 2 dan tidak bergantung pada isi data. Kalau memakai
  # henti-awal, pada data yang sudah terurut gelembung justru lebih hemat daripada
  # gabung, dan Soal ini akan mengajarkan hal yang berlawanan dengan Materi.
  - tipe: soal-kode
    skenario:
      id: |
        Tulis dari nol **dua algoritma pengurutan**, masing-masing mengembalikan
        **pasangan** `(hasil, jumlah_perbandingan)`. Pasangan itu ditulis sebagai daftar
        dua elemen: `[hasil, jumlah_perbandingan]`.

        **Algoritma pertama — `urut_gelembung(daftar)`.** Pengurutan gelembung **polos**:
        perulangan luar berjalan `n` kali dan perulangan dalam memeriksa pasangan yang
        tersisa, **tanpa henti-awal**. Hitung satu perbandingan setiap kali kamu
        membandingkan dua elemen bersebelahan. Karena tidak ada henti-awal, jumlah
        perbandingannya akan selalu `n × (n - 1) / 2`, tidak peduli isi datanya.

        **Algoritma kedua — `urut_gabung(daftar)`.** Pengurutan gabung yang **rekursif**:
        kalau panjangnya 0 atau 1, ia sudah terurut; kalau lebih, bagi dua, urutkan
        masing-masing dengan cara yang sama, lalu gabungkan. Saat menggabungkan, hitung
        satu perbandingan setiap kali kamu membandingkan elemen paling depan dari kedua
        bagian. Kalau salah satu bagian sudah habis, sisanya dipindahkan **tanpa
        perbandingan**. Kalau nilainya sama, ambil dari bagian kiri.

        **Fungsi `proses(daftar)`** memanggil keduanya dengan daftar yang sama, lalu
        mengembalikan satu daftar berisi empat nilai:

        `[hasil_gelembung, banding_gelembung, hasil_gabung, banding_gabung]`

        Kedua fungsi wajib mengembalikan daftar hasil yang **baru dan terurut**, dan
        tidak boleh mengubah daftar masukannya. Jangan memakai `sorted()` maupun
        `list.sort()` — tulis kedua algoritmanya sendiri, supaya kamu merasakan bedanya
        `O(n²)` dan `O(n log n)` sebagai angka.

        Perhatikan bahwa pada data yang sama, gelembung selalu memakai jauh lebih banyak
        perbandingan daripada gabung begitu datanya cukup besar — dan itulah yang
        diperlihatkan angka pada hasilnya.
      en: |
        Write from scratch **two sorting algorithms**, each returning a **pair**
        `(result, comparison_count)`. Write that pair as a two-element list:
        `[result, comparison_count]`.

        **First algorithm — `urut_gelembung(daftar)`.** **Plain** bubble sort: the outer
        loop runs `n` times and the inner loop checks the remaining pairs, **with no
        early stop**. Count one comparison every time you compare two adjacent elements.
        Because there is no early stop, the comparison count will always be
        `n × (n - 1) / 2`, whatever the data holds.

        **Second algorithm — `urut_gabung(daftar)`.** **Recursive** merge sort: if the
        length is 0 or 1 it is already sorted; otherwise split it in two, sort each part
        the same way, then merge. While merging, count one comparison every time you
        compare the front element of both parts. Once one part is empty, the rest is
        moved over **with no comparison**. When the values are equal, take from the left
        part.

        **The `proses(daftar)` function** calls both with the same list, then returns a
        single list of four values:

        `[bubble_result, bubble_comparisons, merge_result, merge_comparisons]`

        Both functions must return a **new, sorted** list, and must not change the input
        list. Do not use `sorted()` or `list.sort()` — write both algorithms yourself, so
        that you feel the difference between `O(n²)` and `O(n log n)` as numbers.

        Notice that on the same data, bubble always uses far more comparisons than merge
        once the data is large enough — and that is what the numbers in the result show.
    fungsi: proses
    test_case:
      # Kasus 1 — tiga elemen. Gelembung 3, gabung 3: untuk data sekecil ini keduanya
      # sama. Perhatikan bentuk pasangannya: [hasil, banding].
      - argumen:
          - [3, 1, 2]
        diharapkan: [[1, 2, 3], 3, [1, 2, 3], 3]
      # Kasus 2 — lima elemen sudah terurut. Gelembung tetap 5 × 4 / 2 = 10 karena
      # polos, sedangkan gabung cukup 5. Di sini bedanya mulai terlihat.
      - argumen:
          - [1, 2, 3, 4, 5]
        diharapkan: [[1, 2, 3, 4, 5], 10, [1, 2, 3, 4, 5], 5]
      # Kasus 3 — lima elemen terbalik. Gelembung tetap 10 (tidak peduli isi data),
      # gabung 7.
      - argumen:
          - [5, 4, 3, 2, 1]
        diharapkan: [[1, 2, 3, 4, 5], 10, [1, 2, 3, 4, 5], 7]
      # Kasus 4 — ada nilai kembar. Menguji dua hal: hasilnya benar-benar terurut, dan
      # aturan "ambil dari kiri saat nilainya sama" tidak mengubah jumlah perbandingan.
      - argumen:
          - [2, 2, 1]
        diharapkan: [[1, 2, 2], 3, [1, 2, 2], 3]
      # Kasus 5 — delapan elemen acak. Inilah yang memperlihatkan bedanya sebagai
      # angka: gelembung 8 × 7 / 2 = 28, sedangkan gabung 17 (dihitung di Materi
      # sebagai 4 + 6 + 7).
      - argumen:
          - [8, 3, 5, 1, 9, 2, 7, 4]
        diharapkan: [[1, 2, 3, 4, 5, 7, 8, 9], 28, [1, 2, 3, 4, 5, 7, 8, 9], 17]
    solusi_referensi: |
      def urut_gelembung(daftar):
          data = list(daftar)
          banding = 0
          n = len(data)
          for i in range(n):
              for j in range(n - 1 - i):
                  banding += 1
                  if data[j] > data[j + 1]:
                      data[j], data[j + 1] = data[j + 1], data[j]
          return [data, banding]


      def _gabung(kiri, kanan):
          hasil = []
          banding = 0
          i = 0
          j = 0
          while i < len(kiri) and j < len(kanan):
              banding += 1
              if kiri[i] <= kanan[j]:
                  hasil.append(kiri[i])
                  i += 1
              else:
                  hasil.append(kanan[j])
                  j += 1
          hasil.extend(kiri[i:])
          hasil.extend(kanan[j:])
          return [hasil, banding]


      def _urut_gabung(data):
          if len(data) <= 1:
              return [list(data), 0]
          tengah = len(data) // 2
          kiri, banding_kiri = _urut_gabung(data[:tengah])
          kanan, banding_kanan = _urut_gabung(data[tengah:])
          hasil, banding_gabung = _gabung(kiri, kanan)
          return [hasil, banding_kiri + banding_kanan + banding_gabung]


      def urut_gabung(daftar):
          return _urut_gabung(list(daftar))


      def proses(daftar):
          hasil_gelembung, banding_gelembung = urut_gelembung(daftar)
          hasil_gabung, banding_gabung = urut_gabung(daftar)
          return [hasil_gelembung, banding_gelembung, hasil_gabung, banding_gabung]

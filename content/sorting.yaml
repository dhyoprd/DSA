# Sumber terstruktur untuk ekspor CSV/Anki (ticket #14). Karena sorting bukan struktur
# data, isinya **algoritma yang dianalisis** — sama seperti Big-O (#16) dan Rekursi
# (#20), sesuai ADR-0023 dan ADR-0025. Nama field tetap `struktur`; yang berbeda
# isinya. Mengganti nama field itu akan menyentuh `tipe.ts`, validator, penyusun
# kartu, dan uji-ujinya demi satu Topik — dan aturan repo ini adalah abstraksi diubah
# saat ada kebutuhan kedua yang nyata.
#
# `waktu` dan `ruang` memakai notasi O(...) apa adanya — notasi itu sama di kedua
# bahasa, jadi menerjemahkannya hanya menghasilkan dua salinan yang bisa menyimpang.
#
# **Nilai yang memuat koma WAJIB dikutip.** Dalam pemetaan alir YAML (`{ ... }`), koma
# memisahkan entri — jadi `{ id: A, B, en: ... }` menghasilkan `id: "A"` plus kunci
# liar `B: null`, dan kata itu hilang dari kartu tanpa error apa pun. Gerbang konten
# tidak menangkapnya (jebakan 80). Kutipan di bawah bukan hiasan.
#
# **Nilai di sini wajib sama dengan tabel di bagian "Tabel kompleksitas" di Materi.**
# ADR-0019 mencatat bahwa keduanya memang bisa menyimpang dan tidak ada gerbang yang
# membandingkannya — yang menjaganya adalah disiplin saat menyunting, dan skrip
# pemeriksa mandiri Topik ini.
kompleksitas:
  - struktur:
      id: Pengurutan gelembung
      en: Bubble sort
    ruang: O(1)
    operasi:
      - nama: { id: Bandingkan satu pasangan bersebelahan, en: Compare one adjacent pair }
        waktu: O(1)
      - nama: { id: Urutkan n elemen, en: Sort n elements }
        waktu: O(n²)

  - struktur:
      id: Pengurutan sisip
      en: Insertion sort
    ruang: O(1)
    operasi:
      - nama: { id: Bandingkan satu elemen dengan kuncinya, en: Compare one element with the key }
        waktu: O(1)
      - nama: { id: Urutkan n elemen, en: Sort n elements }
        waktu: O(n²)
      - nama: { id: Urutkan data yang sudah terurut, en: Sort data that is already sorted }
        waktu: O(n)

  - struktur:
      id: Pengurutan gabung
      en: Merge sort
    ruang: O(n)
    operasi:
      - nama: { id: Gabungkan dua bagian terurut, en: Merge two sorted parts }
        waktu: O(n)
      - nama: { id: Urutkan n elemen, en: Sort n elements }
        waktu: O(n log n)

# Istilah yang layak dihafal. `istilah` adalah pasangan Indonesia–English; `definisi`
# menjelaskannya di kedua bahasa. Setiap pasangan di bawah ini berbeda antara kedua
# bahasa, jadi setiap istilah menghasilkan dua kartu: definisinya, dan pasangannya.
#
# **Setiap kartu di sini mengajarkan sesuatu yang memang ada di Materi.** Itu kelas
# cacat yang ditemukan di #17 dan #18 (kartu yang mengajarkan hal yang nol kali disebut
# di Materi). Kesembilan istilah di bawah muncul di Materi, bukan hanya di sini.
#
# **Tidak ada istilah yang sudah dipakai Topik lain.** Front kartu definisi berbentuk
# "Definisi — <istilah>", dan Anki menolak catatan dengan front yang sama. Karena itu
# "Bagi dan taklukkan" (sudah dipakai Rekursi) dan "Pencarian biner" (sudah dipakai
# Big-O) tidak didaftarkan lagi di sini.
istilah:
  - istilah: { id: Pengurutan, en: Sorting }
    definisi:
      id: Menyusun ulang isi sebuah kumpulan data supaya urut menurut aturan tertentu — biasanya dari kecil ke besar. Urutannya bisa naik atau turun, dan yang mengurutkan adalah aturan pembandingnya.
      en: Rearranging the contents of a collection so it follows a certain order — usually from smallest to largest. The order can be ascending or descending, and what decides it is the comparison rule.
  - istilah: { id: Urutan menaik, en: Ascending order }
    definisi:
      id: Urutan dari yang terkecil ke yang terbesar. Setiap elemen tidak lebih besar daripada elemen sesudahnya, jadi `[1, 2, 3]` menaik sedangkan `[3, 2, 1]` tidak.
      en: Order from smallest to largest. Each element is no larger than the one after it, so `[1, 2, 3]` is ascending while `[3, 2, 1]` is not.
  - istilah: { id: Urutan menurun, en: Descending order }
    definisi:
      id: Urutan dari yang terbesar ke yang terkecil. Setiap elemen tidak lebih kecil daripada elemen sesudahnya, jadi `[3, 2, 1]` menurun sedangkan `[1, 2, 3]` tidak.
      en: Order from largest to smallest. Each element is no smaller than the one after it, so `[3, 2, 1]` is descending while `[1, 2, 3]` is not.
  - istilah: { id: Perbandingan, en: Comparison }
    definisi:
      id: Tindakan memeriksa mana di antara dua nilai yang lebih kecil atau lebih besar. Hampir semua algoritma pengurutan bekerja dengan membandingkan dua nilai, dan banyaknya perbandingan itulah yang menentukan seberapa cepat algoritmanya.
      en: The act of checking which of two values is smaller or larger. Almost every sorting algorithm works by comparing two values, and the number of comparisons decides how fast the algorithm is.
  - istilah: { id: Pertukaran, en: Swap }
    definisi:
      id: Menukar posisi dua elemen di dalam sebuah larik. Di Python, `data[i], data[j] = data[j], data[i]` menukar keduanya sekaligus tanpa memerlukan variabel bantu.
      en: Exchanging the positions of two elements inside an array. In Python, `data[i], data[j] = data[j], data[i]` swaps both at once without needing a helper variable.
  - istilah: { id: Penggabungan, en: Merge }
    definisi:
      id: Menyatukan dua bagian yang masing-masing sudah terurut menjadi satu bagian terurut — bandingkan elemen paling depan dari kedua bagian, ambil yang lebih kecil, lalu ulangi.
      en: Combining two parts that are each already sorted into a single sorted part — compare the front element of both parts, take the smaller one, then repeat.
  - istilah: { id: Pengurutan gelembung, en: Bubble sort }
    definisi:
      id: Pengurutan yang berulang kali membandingkan dua elemen bersebelahan dan menukarnya kalau urutannya salah. Elemen terbesar menggelembung ke ujung kanan pada setiap putaran.
      en: A sort that repeatedly compares two adjacent elements and swaps them when they are out of order. The largest element bubbles to the right end on every pass.
  - istilah: { id: Pengurutan stabil, en: Stable sort }
    definisi:
      id: Pengurutan yang tidak mengubah urutan asli dua elemen yang nilainya sama. Kalau dua kartu bernilai sama sudah berurutan sebelum diurutkan, keduanya tetap berurutan setelahnya.
      en: A sort that does not change the original order of two elements with the same value. If two cards of equal value were in a certain order before sorting, they stay in that order afterwards.
  - istilah: { id: Pengurutan di tempat, en: In-place sort }
    definisi:
      id: Pengurutan yang mengubah larik aslinya sendiri dan hanya memakai sedikit ruang tambahan — tidak membuat larik baru sebesar datanya. Ruang tambahannya tetap, tidak tumbuh mengikuti banyaknya data.
      en: A sort that rearranges the original array itself and uses only a little extra space — it does not build a new array as large as the data. Its extra space is fixed and does not grow with the amount of data.

materi:
  id: |
    ## Kenapa pengurutan penting

    **Pengurutan** (*sorting*) adalah menyusun ulang isi sebuah kumpulan data supaya
    urut menurut aturan tertentu. Aturannya bisa apa saja — angka dari kecil ke besar,
    nama dari A ke Z, tanggal dari yang paling lama. Yang paling sering dipakai adalah
    **urutan menaik** (*ascending order*), dari yang terkecil ke yang terbesar, dan
    kebalikannya **urutan menurun** (*descending order*).

    Pertanyaannya: kenapa repot-repot mengurutkan? Karena banyak hal menjadi jauh
    lebih mudah setelah datanya urut.

    - **Mencari jadi cepat.** Di Topik 1 kamu melihat pencarian biner hanya bekerja
      pada data yang sudah terurut — dan ia jauh lebih cepat daripada memeriksa satu
      per satu.
    - **Data jadi enak dibaca.** Daftar nilai dari yang tertinggi, daftar nama dari A
      ke Z, riwayat dari yang terbaru.
    - **Menemukan yang kembar jadi mudah.** Setelah urut, nilai yang sama pasti
      bersebelahan.
    - **Menggabungkan dua daftar jadi mudah.** Kalau keduanya sudah urut, kamu bisa
      menyatukannya dalam satu kali jalan — itulah yang kamu lihat di bagian
      Penggabungan nanti.

    Di Topik ini kamu akan menulis tiga algoritma pengurutan dari nol, dan membandingkan
    mana yang lebih cepat — bukan dengan stopwatch, melainkan dengan **menghitung
    perbandingannya**.

    ## Membandingkan dua cara mengurutkan

    Bagaimana kita tahu satu algoritma pengurutan lebih cepat daripada yang lain?
    Menjalankannya lalu melihat jam dinding tidak bisa diandalkan: hasilnya berbeda di
    setiap komputer, dan berbeda setiap kali dijalankan. Cara yang dipakai Topik 1
    adalah menghitung **banyaknya pekerjaan**, bukan lamanya.

    Untuk pengurutan, pekerjaan yang paling sering dihitung adalah **perbandingan**
    (*comparison*) — berapa kali algoritmanya memeriksa "mana yang lebih kecil di
    antara kedua nilai ini?". Alasannya: hampir semua algoritma pengurutan bekerja
    dengan membandingkan dua nilai, jadi jumlah perbandingan menggambarkan kerjanya
    dengan baik.

    Perbandingan itu sendiri adalah pekerjaan **tetap**: membandingkan `5` dengan `9`
    memakan satu langkah, tidak peduli datanya sebesar apa. Jadi biayanya `O(1)` — dan
    yang membuat sebuah pengurutan menjadi mahal adalah **banyaknya** perbandingan,
    bukan satu perbandingan.

    Ukuran "banyaknya perbandingan" inilah yang akan kamu pakai terus di Topik ini,
    dan itulah yang diminta Soal Kode di akhir.

    ## Pengurutan gelembung

    **Pengurutan gelembung** (*bubble sort*) adalah yang paling mudah dibayangkan.
    Ia berjalan berulang kali dari kiri ke kanan, membandingkan **dua elemen
    bersebelahan**, dan menukarnya kalau urutannya salah.

    ```python
    def urut_gelembung(data):
        n = len(data)
        for i in range(n):
            for j in range(n - 1 - i):
                if data[j] > data[j + 1]:                  # bandingkan
                    data[j], data[j + 1] = data[j + 1], data[j]   # tukar
    ```

    Perhatikan dua hal pada perulangan dalamnya. Panjangnya `n - 1 - i`, bukan `n - 1`:
    setiap putaran selesai, satu elemen terbesar sudah pasti berada di ujung kanan, jadi
    bagian itu tidak perlu diperiksa lagi. Dan perulangan luarnya berjalan `n` kali.

    Mari lacak `[5, 2, 9, 1]` pada putaran pertama:

    ```
    [5, 2, 9, 1]   bandingkan 5 dan 2  ->  salah urutan, tukar
    [2, 5, 9, 1]   bandingkan 5 dan 9  ->  sudah benar
    [2, 5, 9, 1]   bandingkan 9 dan 1  ->  salah urutan, tukar
    [2, 5, 1, 9]   putaran 1 selesai: 9 sudah di tempat terakhirnya
    ```

    Perhatikan bahwa `9` — yang terbesar — sudah sampai di ujung kanan setelah satu
    putaran. Itulah asal nama "gelembung": elemen terbesar menggelembung ke ujung.

    Untuk `[5, 2, 9, 1]` yang panjangnya 4, perbandingannya: putaran pertama 3 kali,
    kedua 2 kali, ketiga 1 kali, keempat 0 kali — seluruhnya **6 perbandingan**. Secara
    umum, larik berisi `n` elemen memerlukan tepat

    `(n - 1) + (n - 2) + … + 1 = n × (n - 1) / 2` perbandingan.

    Bentuk itu adalah `O(n²)` — dan untuk 16 elemen, jumlahnya **120**.

    ## Pengurutan sisip

    **Pengurutan sisip** (*insertion sort*) bekerja seperti orang menyusun kartu di
    tangannya. Kamu ambil satu kartu baru, lalu memindahkannya ke kiri melewati kartu
    yang lebih besar, sampai menemukan tempatnya.

    ```python
    def urut_sisip(data):
        for i in range(1, len(data)):
            kunci = data[i]
            j = i - 1
            while j >= 0 and data[j] > kunci:
                data[j + 1] = data[j]      # geser ke kanan
                j -= 1
            data[j + 1] = kunci            # taruh di tempatnya
    ```

    Bagian kiri (`data[0]` sampai `data[i - 1]`) selalu sudah terurut. Yang dilakukan
    setiap langkah adalah **menyisipkan** `data[i]` ke bagian kiri itu, dengan menggeser
    elemen yang lebih besar satu langkah ke kanan.

    Pengurutan sisip punya satu sifat istimewa: **kalau datanya sudah hampir urut, ia
    sangat cepat.** Pada data yang sudah terurut sempurna, setiap kunci langsung
    menemukan tempatnya tanpa menggeser apa pun — hanya `n - 1` perbandingan, yang
    berarti `O(n)`. Untuk 16 elemen yang sudah urut, itu **15** perbandingan, bukan 120.
    Sayangnya pada data yang benar-benar terbalik ia kembali menjadi `O(n²)`.

    ## Pengurutan gabung

    Sekarang algoritma yang lebih pintar. **Pengurutan gabung** (*merge sort*) memakai
    pola **bagi dan taklukkan** yang kamu pelajari di Topik Rekursi: pecah persoalan
    menjadi bagian yang lebih kecil, selesaikan tiap bagian dengan cara yang sama, lalu
    gabungkan hasilnya.

    Idenya sederhana sampai terasa curang:

    1. Kalau lariknya berisi 0 atau 1 elemen, ia **sudah terurut** — tidak ada yang
       perlu dikerjakan.
    2. Kalau lebih, bagi dua lariknya menjadi kiri dan kanan.
    3. Urutkan kiri, dan urutkan kanan — dengan cara yang sama, yaitu rekursi.
    4. Gabungkan dua bagian yang sudah terurut itu menjadi satu.

    ```python
    def urut_gabung(data):
        if len(data) <= 1:                  # kasus dasar
            return data
        tengah = len(data) // 2
        kiri = urut_gabung(data[:tengah])   # urutkan kiri
        kanan = urut_gabung(data[tengah:])  # urutkan kanan
        return gabung(kiri, kanan)          # satukan
    ```

    Kalau kamu perhatikan, ini persis pola Rekursi: ada kasus dasar (`len <= 1`), ada
    langkah rekursif yang memperkecil persoalan (membelah dua), dan ada langkah
    menggabungkan hasilnya. Itu sebabnya Rekursi jadi prasyarat Topik ini.

    Yang membuatnya cepat adalah **langkah 4**: menggabungkan dua bagian yang sudah
    terurut jauh lebih murah daripada mengurutkan dari awal. Bagian berikutnya
    menjelaskan kenapa.

    ## Langkah menggabungkan

    **Penggabungan** (*merge*) adalah menyatukan dua bagian yang masing-masing sudah
    terurut menjadi satu bagian terurut. Caranya seperti menggabungkan dua tumpukan
    kartu yang masing-masing sudah tersusun: lihat kartu paling atas dari kedua
    tumpukan, ambil yang lebih kecil, lalu ulangi.

    ```python
    def gabung(kiri, kanan):
        hasil = []
        i = 0
        j = 0
        while i < len(kiri) and j < len(kanan):
            if kiri[i] <= kanan[j]:      # ambil dari kiri kalau lebih kecil
                hasil.append(kiri[i])    # atau sama — supaya stabil
                i += 1
            else:
                hasil.append(kanan[j])
                j += 1
        hasil.extend(kiri[i:])           # sisa kiri, tanpa banding lagi
        hasil.extend(kanan[j:])          # sisa kanan, tanpa banding lagi
        return hasil
    ```

    Perhatikan: `<=` bukan `<`. Kalau nilainya sama, yang diambil adalah dari kiri.
    Aturan kecil itu yang membuat pengurutan gabung menjadi **pengurutan stabil**
    (*stable sort*) — pengurutan yang tidak mengubah urutan asli dua elemen yang
    nilainya sama.

    Mari gabungkan `[1, 4, 7]` dengan `[2, 3, 9]`:

    ```
    kiri: [1, 4, 7]     kanan: [2, 3, 9]
    bandingkan 1 vs 2  ->  ambil 1   (kiri)     hasil: [1]
    bandingkan 4 vs 2  ->  ambil 2   (kanan)    hasil: [1, 2]
    bandingkan 4 vs 3  ->  ambil 3   (kanan)    hasil: [1, 2, 3]
    bandingkan 4 vs 9  ->  ambil 4   (kiri)     hasil: [1, 2, 3, 4]
    bandingkan 7 vs 9  ->  ambil 7   (kiri)     hasil: [1, 2, 3, 4, 7]
    kiri habis — sisa kanan [9] disalin tanpa banding
    hasil akhir: [1, 2, 3, 4, 7, 9]             5 perbandingan
    ```

    Setiap perbandingan memindahkan **satu** elemen ke hasil. Karena ada 6 elemen, kerja
    menggabungkannya paling banyak 6 langkah — jadi menggabungkan bagian berukuran `n`
    memakan waktu `O(n)`, bukan `O(n²)`.

    ## O(n²) lawan O(n log n)

    Sekarang bagian yang membuat semuanya masuk akal. Kenapa pengurutan gabung jauh
    lebih cepat untuk data yang besar?

    Lihat pohon pembagiannya untuk `[8, 3, 5, 1, 9, 2, 7, 4]`. Setiap kotak adalah
    satu pemanggilan `urut_gabung`, dan angka di samping panah gabungan adalah jumlah
    perbandingannya:

    ```
                        [8, 3, 5, 1, 9, 2, 7, 4]
                       /                          \
              [8, 3, 5, 1]                    [9, 2, 7, 4]
              /          \                    /          \
          [8, 3]       [5, 1]            [9, 2]       [7, 4]
          /    \       /    \            /    \       /    \
        [8]    [3]   [5]    [1]        [9]    [2]   [7]    [4]
          \    /       \    /            \    /       \    /
          [3, 8]       [1, 5]            [2, 9]       [4, 7]
              \          /                    \          /
              [1, 3, 5, 8]                    [2, 4, 7, 9]
                       \                          /
                        [1, 2, 3, 4, 5, 7, 8, 9]
    ```

    Jumlah perbandingannya, tingkat demi tingkat:

    - Tingkat paling bawah — 4 penggabungan, masing-masing 1 perbandingan: **4**
    - Tingkat tengah — 2 penggabungan, masing-masing 3 perbandingan: **6**
    - Tingkat paling atas — 1 penggabungan, 7 perbandingan: **7**

    Seluruhnya **4 + 6 + 7 = 17 perbandingan**. Bandingkan dengan pengurutan gelembung
    pada data yang sama: 8 elemen selalu butuh `8 × 7 / 2 = 28` perbandingan. **17 lawan
    28** — gabung menang, dan selisihnya makin lebar begitu datanya bertambah besar.

    Kenapa begitu? Ada dua sebab yang bisa dipisahkan:

    - **Banyaknya tingkat adalah `log n`.** Setiap kali larik dibelah dua, tingginya
      bertambah satu. Untuk 8 elemen ada 3 tingkat, untuk 16 ada 4, untuk 32 ada 5.
      Angka itu tumbuh sangat lambat — 1.000 elemen hanya butuh sekitar 10 tingkat.
    - **Setiap tingkat memakan `O(n)`.** Pada satu tingkat, seluruh elemen dijumlahkan
      tetap `n`, dan menggabungkannya sekali jalan memakan waktu `O(n)`.

    `O(n)` per tingkat, sebanyak `log n` tingkat — hasilnya **`O(n log n)`**. Itu jauh
    lebih baik daripada `O(n²)`. Bandingkan **lajunya** untuk 16 elemen: `n² = 256`
    sedangkan `n log n = 16 × 4 = 64`, dan jaraknya makin lebar seiring bertambahnya
    data.

    **Hati-hati membaca angka 64 itu.** Ia adalah nilai `n log n` sebagai **laju
    pertumbuhan**, bukan jumlah perbandingan sesungguhnya. Jumlah perbandingan
    sesungguhnya untuk 16 elemen adalah **32** — seperti pada 8 elemen tadi, di mana
    `n log n = 24` tetapi perbandingan sesungguhnya **17**. Rumusnya menggambarkan
    bagaimana biayanya tumbuh, bukan menggantikan hitungannya. Pembedaan itu diuji di
    Kuis 3.

    Harga yang dibayar pengurutan gabung adalah **ruang**: ia membuat larik-larik baru
    untuk menampung hasil penggabungan, sehingga memerlukan `O(n)` ruang tambahan.
    Pengurutan gelembung dan sisip tidak — keduanya **pengurutan di tempat**
    (*in-place sort*), yang mengubah larik aslinya sendiri dengan ruang tambahan tetap.

    ## Tabel kompleksitas

    | Operasi | Waktu | Kenapa |
    |---|---|---|
    | Bandingkan satu pasangan bersebelahan (gelembung) | O(1) | Membandingkan dua nilai adalah pekerjaan tetap, tidak peduli datanya sebesar apa |
    | Urutkan n elemen (gelembung) | O(n²) | Ada dua perulangan bersarang, dan perbandingannya selalu n × (n - 1) / 2 |
    | Bandingkan satu elemen dengan kuncinya (sisip) | O(1) | Satu perbandingan antara kunci dan satu elemen di sebelah kirinya |
    | Urutkan n elemen (sisip) | O(n²) | Pada data terbalik, setiap kunci harus digeser melewati seluruh bagian kiri |
    | Urutkan data yang sudah terurut (sisip) | O(n) | Setiap kunci langsung menemukan tempatnya, jadi hanya n - 1 perbandingan |
    | Gabungkan dua bagian terurut (gabung) | O(n) | Setiap perbandingan memindahkan satu elemen, jadi seluruhnya sebanyak banyaknya elemen |
    | Urutkan n elemen (gabung) | O(n log n) | Ada log n tingkat pembelahan, dan setiap tingkat memakan O(n) |

    Untuk ruangnya: gelembung dan sisip `O(1)` karena keduanya mengurutkan di tempat,
    sedangkan gabung `O(n)` karena membuat larik baru untuk menampung hasil gabungan.

    ## Jebakan yang sering terjadi

    **Mengira pengurutan gelembung butuh `n` putaran penuh.** Yang benar: putaran
    ke-`i` hanya memeriksa `n - 1 - i` pasangan, karena `i` elemen terbesar sudah
    berada di ujung kanan. Memakai `n - 1` di perulangan dalam membuat algoritmanya
    tetap benar, tetapi membandingkan pasangan yang sudah pasti urut.

    **Menghitung perbandingan gelembung dari data yang dipakai.** Untuk gelembung
    **polos** — yang ditulis di atas, tanpa henti-awal — jumlah perbandingannya selalu
    `n × (n - 1) / 2`, tidak peduli isi datanya. Data yang sudah terurut tetap
    memerlukan 120 perbandingan untuk 16 elemen. Yang berubah hanyalah banyaknya
    **pertukaran**, bukan perbandingan.

    **Gelembung berhenti-awal bisa mengalahkan pengurutan gabung.** Bentuk yang umum
    dipakai di banyak buku menambahkan penanda: kalau satu putaran penuh tidak ada
    pertukaran, pengurutannya berhenti lebih awal. Pada data yang sudah terurut, bentuk
    itu hanya butuh `n - 1` perbandingan — lebih sedikit daripada pengurutan gabung.
    Karena itu **Soal Kode di Topik ini memakai gelembung polos**: supaya jumlah
    perbandingannya pasti, tidak bergantung pada isi data, dan bisa diperiksa test case.
    Saat membandingkan dua algoritma, pastikan dulu keduanya dihitung dengan aturan yang
    sama.

    **Menukar dua nilai dengan cara yang salah.** Menulis `data[j] = data[j + 1]` lalu
    `data[j + 1] = data[j]` akan menyalin nilai yang sama ke kedua tempat, karena yang
    pertama sudah menimpa nilai aslinya. Di Python, `data[j], data[j + 1] = data[j + 1], data[j]`
    menukar keduanya sekaligus dan aman.

    **Mengira pengurutan gabung menghemat ruang karena membelah data.** Justru
    sebaliknya: setiap penggabungan membuat larik baru, sehingga ruang tambahannya
    `O(n)`. Pengurutan gelembung dan sisip lebih hemat ruang — tetapi jauh lebih lambat
    untuk data besar. Tidak ada yang menang di semua hal.

    **Mengira `<=` dan `<` di langkah penggabungan sama saja.** Keduanya menghasilkan
    larik yang sama terurutnya, tetapi `<=` yang mengambil dari kiri saat nilainya sama
    membuat pengurutan gabung menjadi **stabil** — urutan asli elemen bernilai sama
    dipertahankan. Memakai `<` membalik urutan elemen yang nilainya sama.

    **Membandingkan dua algoritma dengan data yang berbeda.** Kalau gelembung diuji
    pada 100 elemen dan gabung pada 10, hasilnya tidak berarti apa-apa. Perbandingan
    hanya sah kalau datanya sama — itu sebabnya Soal Kode di Topik ini mengembalikan
    **kedua** hasil dari **satu** daftar masukan.

  en: |
    ## Why sorting matters

    **Sorting** means rearranging the contents of a collection so it follows a certain
    order. The rule can be anything — numbers from smallest to largest, names from A to
    Z, dates from oldest to newest. The one used most often is **ascending order**,
    from smallest to largest, and the opposite is **descending order**.

    Why bother sorting at all? Because a lot of things become far easier once the data
    is in order.

    - **Searching becomes fast.** In Topic 1 you saw that binary search only works on
      sorted data — and it is far faster than checking one by one.
    - **Data becomes easy to read.** A list of scores from the highest, a list of names
      from A to Z, a history from the most recent.
    - **Finding duplicates becomes easy.** Once sorted, equal values are always next to
      each other.
    - **Combining two lists becomes easy.** If both are already sorted, you can join
      them in a single pass — that is what you will see in the Merging section later.

    In this Topic you will write three sorting algorithms from scratch and compare which
    one is faster — not with a stopwatch, but by **counting comparisons**.

    ## Comparing two ways to sort

    How do we know one sorting algorithm is faster than another? Running it and watching
    the wall clock is not reliable: the result differs on every computer, and differs
    every time you run it. The way Topic 1 uses is to count the **amount of work**, not
    the duration.

    For sorting, the work counted most often is the **comparison** — how many times the
    algorithm checks "which of these two values is smaller?". The reason: almost every
    sorting algorithm works by comparing two values, so the number of comparisons
    describes its work well.

    A comparison itself is a **fixed** amount of work: comparing `5` with `9` takes one
    step, no matter how large the data is. So its cost is `O(1)` — and what makes a sort
    expensive is the **number** of comparisons, not one comparison.

    This measure — the number of comparisons — is what you will use throughout this
    Topic, and it is what the Code Problem at the end asks for.

    ## Bubble sort

    **Bubble sort** is the easiest to picture. It walks from left to right again and
    again, comparing **two adjacent elements**, and swapping them when they are out of
    order.

    ```python
    def urut_gelembung(data):
        n = len(data)
        for i in range(n):
            for j in range(n - 1 - i):
                if data[j] > data[j + 1]:                  # compare
                    data[j], data[j + 1] = data[j + 1], data[j]   # swap
    ```

    Notice two things in the inner loop. Its length is `n - 1 - i`, not `n - 1`: once a
    pass finishes, the largest element is already at the right end, so that part needs
    no further checking. And the outer loop runs `n` times.

    Let us trace `[5, 2, 9, 1]` on its first pass:

    ```
    [5, 2, 9, 1]   compare 5 and 2  ->  out of order, swap
    [2, 5, 9, 1]   compare 5 and 9  ->  already correct
    [2, 5, 9, 1]   compare 9 and 1  ->  out of order, swap
    [2, 5, 1, 9]   pass 1 done: 9 is in its final place
    ```

    Notice that `9` — the largest — reached the right end after a single pass. That is
    where the name "bubble" comes from: the largest element bubbles to the end.

    For `[5, 2, 9, 1]`, which has length 4, the comparisons are: 3 on the first pass, 2
    on the second, 1 on the third, 0 on the fourth — **6 comparisons** in all. In
    general, an array of `n` elements needs exactly

    `(n - 1) + (n - 2) + … + 1 = n × (n - 1) / 2` comparisons.

    That shape is `O(n²)` — and for 16 elements the count is **120**.

    ## Insertion sort

    **Insertion sort** works the way a person arranges cards in their hand. You take one
    new card, then move it left past the cards that are larger, until it finds its place.

    ```python
    def urut_sisip(data):
        for i in range(1, len(data)):
            kunci = data[i]
            j = i - 1
            while j >= 0 and data[j] > kunci:
                data[j + 1] = data[j]      # shift right
                j -= 1
            data[j + 1] = kunci            # place it
    ```

    The left part (`data[0]` through `data[i - 1]`) is always already sorted. What each
    step does is **insert** `data[i]` into that left part, shifting the larger elements
    one step right.

    Insertion sort has one special property: **if the data is nearly sorted, it is very
    fast.** On perfectly sorted data, every key finds its place at once without shifting
    anything — only `n - 1` comparisons, which means `O(n)`. For 16 already-sorted
    elements that is **15** comparisons, not 120. Unfortunately, on data that is
    completely reversed it goes back to `O(n²)`.

    ## Merge sort

    Now a smarter algorithm. **Merge sort** uses the **divide and conquer** pattern you
    learned in the Recursion Topic: split the problem into smaller parts, solve each part
    the same way, then combine the results.

    The idea is simple to the point of feeling like cheating:

    1. If the array holds 0 or 1 element, it is **already sorted** — nothing to do.
    2. Otherwise, split it into a left and a right half.
    3. Sort the left, and sort the right — the same way, by recursion.
    4. Merge those two sorted parts into one.

    ```python
    def urut_gabung(data):
        if len(data) <= 1:                  # base case
            return data
        tengah = len(data) // 2
        kiri = urut_gabung(data[:tengah])   # sort left
        kanan = urut_gabung(data[tengah:])  # sort right
        return gabung(kiri, kanan)          # combine
    ```

    If you look closely, this is exactly the Recursion pattern: there is a base case
    (`len <= 1`), a recursive step that shrinks the problem (splitting in two), and a
    step that combines the results. That is why Recursion is a prerequisite for this
    Topic.

    What makes it fast is **step 4**: merging two already-sorted parts is far cheaper
    than sorting from scratch. The next section explains why.

    ## The merge step

    A **merge** combines two parts that are each already sorted into a single sorted
    part. It works like combining two stacks of cards that are each already in order:
    look at the top card of both stacks, take the smaller one, then repeat.

    ```python
    def gabung(kiri, kanan):
        hasil = []
        i = 0
        j = 0
        while i < len(kiri) and j < len(kanan):
            if kiri[i] <= kanan[j]:      # take from the left if smaller
                hasil.append(kiri[i])    # or equal — so it stays stable
                i += 1
            else:
                hasil.append(kanan[j])
                j += 1
        hasil.extend(kiri[i:])           # leftover left, no more comparisons
        hasil.extend(kanan[j:])          # leftover right, no more comparisons
        return hasil
    ```

    Notice: `<=`, not `<`. When the values are equal, the one taken comes from the left.
    That small rule is what makes merge sort a **stable sort** — a sort that does not
    change the original order of two equal elements.

    Let us merge `[1, 4, 7]` with `[2, 3, 9]`:

    ```
    left: [1, 4, 7]     right: [2, 3, 9]
    compare 1 vs 2  ->  take 1   (left)     result: [1]
    compare 4 vs 2  ->  take 2   (right)    result: [1, 2]
    compare 4 vs 3  ->  take 3   (right)    result: [1, 2, 3]
    compare 4 vs 9  ->  take 4   (left)     result: [1, 2, 3, 4]
    compare 7 vs 9  ->  take 7   (left)     result: [1, 2, 3, 4, 7]
    left is empty — the leftover right [9] is copied with no comparison
    final result: [1, 2, 3, 4, 7, 9]        5 comparisons
    ```

    Each comparison moves **one** element into the result. Since there are 6 elements,
    merging them takes at most 6 steps — so merging a part of size `n` costs `O(n)`
    time, not `O(n²)`.

    ## O(n²) versus O(n log n)

    Now the part that makes everything click. Why is merge sort far faster on large data?

    Look at the splitting tree for `[8, 3, 5, 1, 9, 2, 7, 4]`. Each box is one call to
    `urut_gabung`, and the number beside each merge arrow is its comparison count:

    ```
                        [8, 3, 5, 1, 9, 2, 7, 4]
                       /                          \
              [8, 3, 5, 1]                    [9, 2, 7, 4]
              /          \                    /          \
          [8, 3]       [5, 1]            [9, 2]       [7, 4]
          /    \       /    \            /    \       /    \
        [8]    [3]   [5]    [1]        [9]    [2]   [7]    [4]
          \    /       \    /            \    /       \    /
          [3, 8]       [1, 5]            [2, 9]       [4, 7]
              \          /                    \          /
              [1, 3, 5, 8]                    [2, 4, 7, 9]
                       \                          /
                        [1, 2, 3, 4, 5, 7, 8, 9]
    ```

    The comparison count, level by level:

    - Bottom level — 4 merges, 1 comparison each: **4**
    - Middle level — 2 merges, 3 comparisons each: **6**
    - Top level — 1 merge, 7 comparisons: **7**

    That is **4 + 6 + 7 = 17 comparisons** in all. Compare that with bubble sort on the
    same data: 8 elements always need `8 × 7 / 2 = 28` comparisons. **17 versus 28** —
    merge wins, and the gap widens as the data grows.

    Why? There are two causes, and they can be separated:

    - **The number of levels is `log n`.** Every time the array is split in two, the
      height grows by one. For 8 elements there are 3 levels, for 16 there are 4, for 32
      there are 5. That number grows very slowly — 1,000 elements need only about 10
      levels.
    - **Each level costs `O(n)`.** At one level, all the elements still add up to `n`,
      and merging them in one pass costs `O(n)`.

    `O(n)` per level, for `log n` levels — the result is **`O(n log n)`**. That is far
    better than `O(n²)`. Compare their **growth rates** for 16 elements: `n² = 256`
    while `n log n = 16 × 4 = 64`, and the gap widens as the data grows.

    **Be careful reading that 64.** It is the value of `n log n` as a **growth rate**,
    not the actual number of comparisons. The actual comparison count for 16 elements is
    **32** — just as for 8 elements above, where `n log n = 24` but the actual count is
    **17**. The formula describes how the cost grows; it does not replace the count.
    That distinction is tested in Quiz 3.

    The price merge sort pays is **space**: it creates new arrays to hold the merge
    results, so it needs `O(n)` extra space. Bubble and insertion sort do not — both are
    **in-place sorts**, rearranging the original array itself with fixed extra space.

    ## Complexity table

    | Operation | Time | Why |
    |---|---|---|
    | Compare one adjacent pair (bubble) | O(1) | Comparing two values is fixed work, no matter how large the data is |
    | Sort n elements (bubble) | O(n²) | There are two nested loops, and the comparisons are always n × (n - 1) / 2 |
    | Compare one element with the key (insertion) | O(1) | One comparison between the key and one element to its left |
    | Sort n elements (insertion) | O(n²) | On reversed data, every key has to shift past the whole left part |
    | Sort data that is already sorted (insertion) | O(n) | Every key finds its place at once, so only n - 1 comparisons |
    | Merge two sorted parts (merge) | O(n) | Each comparison moves one element, so the total equals the number of elements |
    | Sort n elements (merge) | O(n log n) | There are log n splitting levels, and each level costs O(n) |

    As for space: bubble and insertion are `O(1)` because both sort in place, while merge
    is `O(n)` because it creates a new array to hold the merged result.

    ## Common traps

    **Assuming bubble sort needs `n` full passes.** The truth: pass `i` only checks
    `n - 1 - i` pairs, because `i` largest elements are already at the right end. Using
    `n - 1` in the inner loop keeps the algorithm correct, but compares pairs that are
    certainly already in order.

    **Working out bubble's comparison count from the data it is given.** For **plain**
    bubble sort — the one written above, without early stopping — the comparison count is
    always `n × (n - 1) / 2`, no matter what the data holds. Already-sorted data still
    needs 120 comparisons for 16 elements. What changes is the number of **swaps**, not
    the comparisons.

    **Early-stopping bubble sort can beat merge sort.** The form used in many books adds
    a flag: if a whole pass makes no swap, the sort stops early. On already-sorted data
    that form needs only `n - 1` comparisons — fewer than merge sort. That is why the
    **Code Problem in this Topic uses plain bubble sort**: so the comparison count is
    certain, does not depend on the data, and can be checked by test cases. When comparing
    two algorithms, first make sure both are counted by the same rule.

    **Swapping two values the wrong way.** Writing `data[j] = data[j + 1]` and then
    `data[j + 1] = data[j]` copies the same value into both places, because the first
    line already overwrote the original. In Python,
    `data[j], data[j + 1] = data[j + 1], data[j]` swaps both at once and is safe.

    **Assuming merge sort saves space because it splits the data.** The opposite is
    true: every merge creates a new array, so its extra space is `O(n)`. Bubble and
    insertion sort use less space — but are far slower on large data. Nothing wins at
    everything.

    **Assuming `<=` and `<` in the merge step are the same.** Both produce the same
    sorted array, but using `<=`, which takes from the left on equal values, makes merge
    sort **stable** — the original order of equal elements is preserved. Using `<`
    reverses the order of equal elements.

    **Comparing two algorithms on different data.** If bubble is tested on 100 elements
    and merge on 10, the result means nothing. A comparison is only valid when the data
    is the same — which is why the Code Problem in this Topic returns **both** results
    from **one** input list.


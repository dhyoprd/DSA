# Topik 7 — Sorting.
#
# Topik ketujuh di Jalur, `prasyarat: [2, 6]` (Array & String, Rekursi). Materi di
# sini memakai dua hal dari Topik sebelumnya: gagasan "menukar isi dua kotak di dalam
# sebuah larik" dari Array & String (#17), dan gagasan "fungsi yang memanggil dirinya
# sendiri dengan persoalan yang lebih kecil" dari Rekursi (#20). Pengurutan gabung
# adalah bagi-dan-taklukkan, dan itulah yang membuat Rekursi jadi prasyarat.
#
# **ADA penyimpangan yang dicatat.** `docs/design-tree.md` menetapkan Soal Kode
# berbentuk "implementasi struktur data dari nol". Sorting **bukan** struktur data,
# jadi bentuk itu tidak bisa dipakai apa adanya di sini — persis situasi Big-O (#16,
# ADR-0023) dan Rekursi (#20, ADR-0025). Soal Kode Topik ini menjadi **menulis dua
# algoritma pengurutan dari nol dan mengembalikan jumlah perbandingannya**, supaya
# beda O(n²) dan O(n log n) terasa sebagai angka yang bisa diperiksa test case. Field
# `kompleksitas` juga diisi **algoritma yang dianalisis**, bukan struktur data — sama
# seperti #16 dan #20. Kedua penyimpangan itu diputuskan pemilik dan dicatat di
# `docs/adr/0026-bentuk-soal-kode-sorting.md`.
#
# **Pembahasan hanya untuk kelima Kuis.** Soal Kode di sini tidak punya Pembahasan,
# karena skema di issue #1 — dan `frontend/src/lib/konten/tipe.ts` — tidak punya field
# `penjelasan` pada `SoalKode`. Pemilik sudah memutuskan (2026-10-06) bahwa cukup 5
# Pembahasan per Topik, sama seperti #10, #16, #17, #18, #19, dan #20.
#
# Semua Soal dan Pembahasan di sini ditulis original, sesuai ADR-0005. Tidak ada teks
# LeetCode yang disalin maupun diterjemahkan.
#
# **Setiap angka di berkas ini sudah dijalankan, bukan dibaca.** Yang diperiksa dengan
# menjalankan Python 3.14: jumlah perbandingan gelembung polos selalu n(n-1)/2
# (n=16 → 120, n=8 → 28, n=5 → 10); jejak gelembung [5, 2, 9, 1] per putaran; jumlah
# perbandingan gabung pada data yang sama (n=16 → 32, n=8 → 12); pohon penggabungan
# [8, 3, 5, 1, 9, 2, 7, 4] = 4 + 6 + 7 = **17 perbandingan** (dihitung ulang tingkat
# demi tingkat); dan kelima test case Soal Kode. **Gelembung di sini sengaja POLOS**
# — tanpa henti-awal — supaya jumlah perbandingannya tidak bergantung pada isi data
# dan bisa diperiksa test case. Gelembung berhenti-awal disebut di bagian Jebakan,
# beserta akibatnya: pada data yang sudah terurut ia justru lebih hemat daripada
# pengurutan gabung, dan itu sebabnya bentuk itu tidak dipakai di Soal Kode.
#
# **Kuis 4 sempat memuat klaim yang salah dan sudah diperbaiki.** Pembahasannya
# mula-mula menyebut gabung pada 10.000 elemen memakai "10.000 × 14 = 140.000"
# perbandingan. Itu batas atas teoretis, bukan angka sesungguhnya: dijalankan, gabung
# pada 10.000 elemen yang sudah terurut memakai **64.608** perbandingan, sedangkan
# sisip memakai **10.019** dan gelembung polos **49.995.000**. Angka-angka itulah yang
# sekarang tertulis. Pelajaran yang sama dengan #20: batas atas rumus bukan hasil
# pengukuran, dan keduanya tidak boleh dipertukarkan.
#
# **Tiga klaim lain juga diperbaiki setelah dijalankan.** (a) Materi mula-mula
# menyajikan `n log n = 64` untuk 16 elemen sebagai jumlah perbandingan, padahal Kuis 3
# justru menandai 64 sebagai pengecoh dan menyatakan jumlah sesungguhnya 32 — sekarang
# Materi menyebutnya sebagai laju pertumbuhan. (b) Jebakan Kuis 5 menjelaskan arah
# perpindahan yang terbalik (siswa bernilai 70 dikatakan pindah ke belakang 80, padahal
# pada urutan menaik 70 justru di depan) — diganti dengan contoh yang benar: yang
# berpindah ke belakang adalah siswa bernilai 90 yang tadinya di depan. (c) Kalimat
# penutup Kuis 4 menyebut gabung "tidak terpengaruh" susunan data, bertabrakan dengan
# angkanya sendiri (64.608 lawan 64.620) — diselaraskan menjadi "hampir tidak
# terpengaruh". Rinciannya di ADR-0026.
#
# `nomor`, `slug`, `judul`, dan `prasyarat` harus sama dengan content/jalur.yaml —
# validator menolak build kalau berbeda.


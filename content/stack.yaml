      id: |
        Urutan "pertama datang, pertama dilayani" adalah Queue. Perhatikan bahwa
        pilihan yang menyebut Stack karena "lebih cepat" juga salah: Stack dan Queue
        sama-sama O(1) untuk operasi intinya, jadi kecepatan bukan pembedanya. Yang
        membedakan adalah urutan keluar.
      en: |
        "First come, first served" is a Queue. Note that the option blaming Stack for
        being "slower" is also wrong: Stack and Queue are both O(1) for their core
        operations, so speed is not the difference. The difference is the removal
        order.

  - tipe: kuis
    skenario:
      id: |
        Sebuah program memakai satu array sebagai Queue. Ia memasukkan tiga nilai
        dengan `append`, lalu mengeluarkan yang paling depan dengan `pop(0)`.
        Program dijalankan pada 100.000 nilai, dan terasa jauh lebih lambat daripada
        yang diharapkan.
      en: |
        A program uses a single array as a Queue. It adds three values with `append`,
        then removes the front one with `pop(0)`. The program is run on 100,000
        values, and it feels far slower than expected.
    opsi:
      - teks:
          id: Karena `pop(0)` harus menggeser seluruh elemen sisanya, sehingga totalnya O(n²)
          en: Because `pop(0)` has to shift every remaining element, making the total O(n²)
        benar: true
      - teks:
          id: Karena array Python tidak bisa menyimpan lebih dari 10.000 nilai
          en: Because a Python array cannot hold more than 10,000 values
        benar: false
      - teks:
          id: Karena `append` memeriksa seluruh isi array setiap kali dipanggil
          en: Because `append` checks the whole array on every call
        benar: false
      - teks:
          id: Karena Queue memang selalu lebih lambat daripada Stack
          en: Because a Queue is always slower than a Stack
        benar: false
    penjelasan:
      id: |
        Mengeluarkan elemen pertama sebuah array memaksa semua elemen setelahnya
        bergeser satu langkah. Satu kali bergeser murah, tetapi dilakukan `n` kali
        menjadi **O(n²)**. Penggantinya adalah `collections.deque`, yang mengeluarkan
        elemen depan dalam **O(1)**. Inilah sebabnya implementasi Queue jarang
        memakai array biasa.
      en: |
        Removing the first element of an array forces every element after it to shift
        one step. Shifting once is cheap, but doing it `n` times becomes **O(n²)**.
        The replacement is `collections.deque`, which removes the front element in
        **O(1)**. This is why Queue implementations rarely use a plain array.

  - tipe: soal-kode
    skenario:
      id: |
        Tulis dari nol sebuah struktur Stack, lalu pakai struktur itu untuk
        menjalankan serangkaian perintah. Kamu menerima daftar perintah, dan harus
        mengembalikan daftar hasil untuk setiap perintah yang menghasilkan nilai.

        Setiap perintah adalah daftar. Perintah `["push", x]` menaruh `x` ke atas
        tumpukan dan tidak menghasilkan nilai. Perintah `["pop"]` mengambil nilai
        paling atas dan hasilnya dicatat. Perintah `["top"]` melihat nilai paling
        atas tanpa membuangnya. Perintah `["kosong"]` mengembalikan `True` kalau
        tumpukan kosong.

        Untuk perintah yang tidak menghasilkan nilai, catat `None`.

        Jangan memakai `list` sebagai pengganti kelas Stack — implementasikan
        `push`, `pop`, `top`, dan `kosong` sendiri, supaya kamu merasakan mekanisme
        internalnya.
      en: |
        Write a Stack structure from scratch, then use it to run a series of
        commands. You receive a list of commands, and must return a list of results
        for each command that produces a value.

        Each command is a list. The command `["push", x]` puts `x` on top of the
        stack and produces no value. The command `["pop"]` removes the top value and
        its result is recorded. The command `["top"]` looks at the top value without
        discarding it. The command `["kosong"]` returns `True` if the stack is empty.

        For commands that produce no value, record `None`.

        Do not use `list` in place of a Stack class — implement `push`, `pop`, `top`,
        and `kosong` yourself, so that you feel the internal mechanism.
    fungsi: proses
    test_case:
      - argumen:
          - - ["push", 1]
            - ["push", 2]
            - ["pop"]
            - ["top"]
        diharapkan: [null, null, 2, 1]
      - argumen:
          - - ["kosong"]
            - ["push", 5]
            - ["kosong"]
        diharapkan: [true, null, false]
      - argumen:
          - - ["push", 1]
            - ["push", 2]
            - ["push", 3]
            - ["pop"]
            - ["pop"]
            - ["pop"]
            - ["kosong"]
        diharapkan: [null, null, null, 3, 2, 1, true]
      - argumen:
          - - ["push", "a"]
            - ["top"]
            - ["push", "b"]
            - ["top"]
        diharapkan: [null, "a", null, "b"]
    solusi_referensi: |
      class Stack:
          def __init__(self):
              self._data = []

          def push(self, nilai):
              self._data.append(nilai)

          def pop(self):
              if not self._data:
                  raise IndexError("Stack kosong")
              return self._data.pop()

          def top(self):
              if not self._data:
                  raise IndexError("Stack kosong")
              return self._data[-1]

          def kosong(self):
              return len(self._data) == 0


      def proses(perintah):
          tumpukan = Stack()
          hasil = []
          for perintah_satu in perintah:
              operasi = perintah_satu[0]
              if operasi == "push":
                  tumpukan.push(perintah_satu[1])
                  hasil.append(None)
              elif operasi == "pop":
                  hasil.append(tumpukan.pop())
              elif operasi == "top":
                  hasil.append(tumpukan.top())
              elif operasi == "kosong":
                  hasil.append(tumpukan.kosong())
          return hasil

    penjelasan:
      id: |
        **Pendekatan.** Hitung indeks setiap kunci satu per satu, lalu lihat ke slot mana
        masing-masing pergi.

        - `"abc"`: `ord("a") + ord("b") + ord("c")` = 97 + 98 + 99 = 294. Lalu
          `294 % 4 = 2`. Jadi `"abc"` masuk slot 2.
        - `"d"`: 100. Lalu `100 % 4 = 0`. Jadi `"d"` masuk slot 0.
        - `"b"`: 98. Lalu `98 % 4 = 2`. Jadi `"b"` masuk slot 2.

        Slot 2 menerima dua kunci, `"abc"` dan `"b"` — itulah tabrakan. Karena slot
        menyimpan **daftar**, keduanya tetap ada, berurutan. Isi tiap slot jadi:
        slot 0 berisi 1, slot 1 berisi 0, slot 2 berisi 2, slot 3 berisi 0 — yaitu
        `[1, 0, 2, 0]`.

        **Kompleksitas.** Untuk setiap kunci, biayanya satu perhitungan hash (yang
        melewati tiap huruf kunci, jadi `O(panjang kunci)`) dan satu penambahan ke
        daftar di slotnya, `O(1)`. Untuk n kunci dengan panjang rata-rata m, seluruhnya
        `O(n × m)` — di sini hanya tiga kunci pendek, jadi praktis seketika.

        **Kode referensi.**

        ```python
        def isi_slot(kunci_kunci, jumlah_slot):
            slot = [[] for _ in range(jumlah_slot)]
            for kunci in kunci_kunci:
                slot[indeks_slot(kunci, jumlah_slot)].append(kunci)
            return [len(rantai) for rantai in slot]
        ```

        **Jebakan umum.** Jawaban `[1, 0, 1, 0]` mengira kunci kedua yang bertabrakan
        **menimpa** yang pertama — padahal pada rantai keduanya tetap disimpan. Jawaban
        `[1, 1, 1, 0]` mengira tiga kunci pasti menempati tiga slot berbeda, padahal
        `"abc"` dan `"b"` sama-sama menghasilkan 2. Jawaban `[3, 0, 0, 0]` mengira `%`
        tidak mengubah apa pun sehingga semua menumpuk di slot 0 — padahal justru `%`
        inilah yang menyebarkan kunci ke beberapa slot.
      en: |
        **Approach.** Compute each key's index one at a time, then see which slot each
        one goes to.

        - `"abc"`: `ord("a") + ord("b") + ord("c")` = 97 + 98 + 99 = 294. Then
          `294 % 4 = 2`. So `"abc"` goes to slot 2.
        - `"d"`: 100. Then `100 % 4 = 0`. So `"d"` goes to slot 0.
        - `"b"`: 98. Then `98 % 4 = 2`. So `"b"` goes to slot 2.

        Slot 2 receives two keys, `"abc"` and `"b"` — that is the collision. Because a
        slot holds a **list**, both remain, in order. The contents per slot become:
        slot 0 holds 1, slot 1 holds 0, slot 2 holds 2, slot 3 holds 0 — that is
        `[1, 0, 2, 0]`.

        **Complexity.** For each key, the cost is one hash computation (which walks each
        letter of the key, so `O(key length)`) and one append to the list in its slot,
        `O(1)`. For n keys of average length m, the whole thing is `O(n × m)` — here
        just three short keys, so practically instant.

        **Reference code.**

        ```python
        def isi_slot(kunci_kunci, jumlah_slot):
            slot = [[] for _ in range(jumlah_slot)]
            for kunci in kunci_kunci:
                slot[indeks_slot(kunci, jumlah_slot)].append(kunci)
            return [len(rantai) for rantai in slot]
        ```

        **Common trap.** The answer `[1, 0, 1, 0]` assumes the second colliding key
        **overwrites** the first — but with chaining both are kept. The answer
        `[1, 1, 1, 0]` assumes three keys must land in three different slots, but `"abc"`
        and `"b"` both produce 2. The answer `[3, 0, 0, 0]` assumes `%` changes nothing
        so everything piles into slot 0 — but `%` is exactly what spreads keys across
        slots.

  # --- Kuis 2: kenapa rata-rata O(1) tetapi terburuk O(n) ------------------------
  - tipe: kuis
    skenario:
      id: |
        Sebuah tabel hash berisi 100.000 slot dan sudah dipakai menyimpan 50.000
        pasangan. Selama fungsi hash-nya menyebar kunci dengan merata, mengambil satu
        nilai terasa seketika — tidak berbeda dari saat tabelnya baru berisi sepuluh
        pasangan. Tetapi pada data tertentu, pencarian yang sama bisa berjalan selama
        memeriksa rantai berisi 50.000 kunci. Kenapa tabel yang sama bisa sesekali
        `O(1)` dan sesekali `O(n)`?
      en: |
        A hash table with 100,000 slots has been used to store 50,000 pairs. As long as
        its hash function spreads keys evenly, reading one value feels instant — no
        different from when the table held only ten pairs. But on certain data, the same
        lookup can take as long as checking a chain of 50,000 keys. Why can the same
        table be `O(1)` at times and `O(n)` at others?
    opsi:
      - teks:
          id: Karena fungsi hash langsung menunjuk slot yang benar sehingga rantai rata-ratanya pendek, tetapi kalau banyak kunci jatuh ke slot yang sama rantainya memanjang dan pencariannya berubah menjadi menelusuri daftar
          en: Because the hash function points straight at the right slot so the average chain is short, but if many keys fall into the same slot the chain grows long and the lookup turns into walking a list
        benar: true
      - teks:
          id: Karena tabel hash menyimpan kuncinya dalam keadaan terurut, sehingga bisa memakai pencarian biner yang cepat
          en: Because a hash table keeps its keys in sorted order, so it can use a fast binary search
        benar: false
      - teks:
          id: Karena tabel hash hanya menyimpan sebagian kuncinya di memori, sehingga yang perlu diperiksa selalu lebih sedikit daripada array
          en: Because a hash table keeps only part of its keys in memory, so there is always less to check than in an array
        benar: false
      - teks:
          id: Karena pencariannya selalu satu langkah, dan angka O(n) itu hanya berlaku saat tabelnya masih kosong
          en: Because a lookup is always a single step, and the `O(n)` figure only applies while the table is still empty
        benar: false
    penjelasan:
      id: |
        **Pendekatan.** Pisahkan dua hal yang sering tertukar: **rata-rata** dan
        **terburuk**.

        Yang membuat rata-ratanya cepat adalah fungsi hash. Untuk mengambil satu nilai,
        tabel tidak menelusuri seluruh isinya — ia menghitung nomor slot kuncinya, lalu
        langsung ke sana. Kalau fungsi hash menyebar merata, rata-rata setiap slot
        berisi sangat sedikit pasangan, sehingga pemeriksaan di dalam slot itu selesai
        hampir seketika. Jumlah langkahnya tidak tumbuh seiring bertambahnya data:
        itulah `O(1)`.

        Yang membuat terburuknya lambat adalah rantai yang panjang. Kalau kebetulan
        banyak kunci menghasilkan nomor slot yang sama — karena fungsi hash-nya buruk,
        atau karena datanya sengaja dipilih begitu — semua kunci itu menumpuk di satu
        rantai. Mencari yang ada di ujung rantai berarti memeriksa seluruh rantai, dan
        rantai itu bisa sepanjang seluruh isi tabel: `O(n)`.

        Keduanya benar sekaligus. Yang pertama menggambarkan pemakaian sehari-hari; yang
        kedua menggambarkan batas yang harus kamu sadari. Faktor beban adalah alat untuk
        menjaga yang kedua tetap jarang terjadi.

        **Kompleksitas.** `O(1)` rata-rata, `O(n)` kasus terburuk. Perhatikan bahwa
        keduanya adalah pernyataan tentang **jumlah kunci yang harus diperiksa di dalam
        satu slot**, bukan tentang besar tabelnya.

        **Kode referensi.**

        ```python
        # Rata-rata: rantai pendek, jadi perulangan ini hanya berputar sedikit kali
        def ambil(self, kunci):
            for k, nilai in self.slot[indeks_slot(kunci, JUMLAH_SLOT)]:
                if k == kunci:
                    return nilai
            return None
        ```

        Kalau semua kunci bertabrakan, `self.slot[indeks_slot(...)]` berisi seluruh isi
        tabel, dan perulangan di atas berputar n kali.

        **Jebakan umum.** Jawaban "menyimpan kunci dalam keadaan terurut" membawa
        kebiasaan dari array terurut dan pencarian biner — tabel hash **tidak** menjaga
        urutan apa pun, dan itulah sebabnya ia cepat untuk pencarian tetapi tidak bisa
        dipakai untuk hal yang butuh urutan. Jawaban "hanya menyimpan sebagian kunci"
        keliru karena tabel hash menyimpan seluruh pasangan; yang membuatnya cepat
        bukan jumlah yang disimpan, melainkan cara menemukan tempatnya. Jawaban
        "selalu satu langkah" menukar rata-rata dengan jaminan — justru inti Topik ini
        adalah bahwa `O(1)` itu **rata-rata**, bukan janji.
      en: |
        **Approach.** Separate two things that are often confused: **average** and
        **worst case**.

        What makes the average fast is the hash function. To read one value, the table
        does not walk its whole contents — it computes the key's slot number, then goes
        straight there. If the hash function spreads evenly, the average slot holds very
        few pairs, so the check inside that slot finishes almost instantly. The number
        of steps does not grow as the data grows: that is `O(1)`.

        What makes the worst case slow is a long chain. If many keys happen to produce
        the same slot number — because the hash function is poor, or because the data
        was chosen that way on purpose — all those keys pile into one chain. Finding the
        one at the end of the chain means checking the whole chain, and that chain can be
        as long as the table's entire contents: `O(n)`.

        Both are true at once. The first describes everyday use; the second describes a
        limit you must be aware of. The load factor is the tool for keeping the second
        rare.

        **Complexity.** `O(1)` on average, `O(n)` in the worst case. Note that both are
        statements about **how many keys must be checked inside one slot**, not about how
        large the table is.

        **Reference code.**

        ```python
        # On average: a short chain, so this loop turns only a few times
        def ambil(self, kunci):
            for k, nilai in self.slot[indeks_slot(kunci, JUMLAH_SLOT)]:
                if k == kunci:
                    return nilai
            return None
        ```

        If every key collides, `self.slot[indeks_slot(...)]` holds the table's entire
        contents, and the loop above turns n times.

        **Common trap.** The answer "keeps its keys in sorted order" carries over the
        habit of a sorted array and binary search — a hash table keeps **no** order at
        all, and that is precisely why it is fast for lookups yet unusable for anything
        needing order. The answer "keeps only part of its keys" is wrong because a hash
        table stores every pair; what makes it fast is not how little it stores, but how
        it finds the place. The answer "always a single step" swaps the average for a
        guarantee — the whole point of this Topic is that `O(1)` is an **average**, not
        a promise.

  # --- Kuis 3: menghitung pemeriksaan saat kunci tidak ada ------------------------
  - tipe: kuis
    skenario:
      id: |
        Tabel hash berikut memakai rantai. Fungsi `ambil` mengembalikan pasangan
        *(hasil, jumlah pemeriksaan)*. Sebelum pemanggilan terakhir, empat kunci sudah
        dimasukkan sehingga keempatnya menempati slot yang sama. Berapa nilai yang

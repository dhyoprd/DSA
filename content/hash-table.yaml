    penjelasan:
      id: |
        **Pendekatan.** Tentukan dulu ke slot mana `"z"` pergi, lalu lihat isi slot itu.

        `ord("b")` = 98, `ord("f")` = 102, `ord("j")` = 106, `ord("n")` = 110.
        Keempatnya habis dibagi 4 tanpa sisa (`98 % 4 = 2`, `102 % 4 = 2`, `106 % 4 = 2`,
        `110 % 4 = 2`), jadi keempatnya menempati slot 2. Slot 2 berisi
        `["b", "f", "j", "n"]`.

        Kunci `"z"` bernilai `ord("z")` = 122, dan `122 % 4 = 2` — juga slot 2. Jadi
        perulangannya masuk ke rantai yang berisi empat kunci itu, dan memeriksa satu
        per satu: `"b"` (tidak sama), `"f"` (tidak sama), `"j"` (tidak sama), `"n"`
        (tidak sama). Perulangannya habis tanpa menemukan apa pun, lalu mengembalikan
        `(None, 4)`. Nilai yang dicetak adalah `4`.

        **Kompleksitas.** Inilah kasus terburuk yang dijelaskan Kuis 2. Keempat kunci
        bertabrakan, jadi satu pencarian harus memeriksa seluruh rantai — `O(n)` untuk
        rantai sepanjang itu. Perhatikan bahwa fungsi hash-nya **bukan** yang membuat ini
        lambat; yang membuatnya lambat adalah semua kunci kebetulan menghasilkan sisa
        bagi yang sama. Fungsi hash yang menyebar lebih baik akan memecah keempat kunci
        itu ke slot berbeda.

        **Kode referensi.**

        ```python
        def ambil(kunci):
            diperiksa = 0
            for k in slot[indeks_slot(kunci, JUMLAH_SLOT)]:
                diperiksa += 1
                if k == kunci:
                    return ("ketemu", diperiksa)
            return (None, diperiksa)
        ```

        **Jebakan umum.** Jawaban `0` mengira kunci yang tidak ada berarti tidak ada yang
        diperiksa — padahal pemeriksaan justru terjadi, dan itulah cara tabel tahu
        kuncinya tidak ada. Jawaban `1` mengira tabel hash selalu selesai dalam satu
        pemeriksaan, yaitu menukar rata-rata dengan jaminan. Jawaban `2` tertukar antara
        **nomor slot** dan **jumlah pemeriksaan**: `"z"` memang menuju slot 2, tetapi
        yang dicetak bukan nomor slotnya — yang dicetak adalah berapa kunci yang
        diperiksa **di dalam** slot itu.
      en: |
        **Approach.** First determine which slot `"z"` goes to, then look at that slot's
        contents.

        `ord("b")` = 98, `ord("f")` = 102, `ord("j")` = 106, `ord("n")` = 110. All four
        are divisible by 4 with remainder 2 (`98 % 4 = 2`, `102 % 4 = 2`, `106 % 4 = 2`,
        `110 % 4 = 2`), so all four occupy slot 2. Slot 2 holds `["b", "f", "j", "n"]`.

        The key `"z"` is `ord("z")` = 122, and `122 % 4 = 2` — also slot 2. So the loop
        enters that chain of four keys and checks them one by one: `"b"` (not equal),
        `"f"` (not equal), `"j"` (not equal), `"n"` (not equal). The loop runs out
        without finding anything, then returns `(None, 4)`. The value printed is `4`.

        **Complexity.** This is the worst case described in Quiz 2. All four keys
        collide, so a single lookup must check the whole chain — `O(n)` for a chain that
        long. Note that the hash function is **not** what makes this slow; what makes it
        slow is that all the keys happen to produce the same remainder. A hash function
        that spreads better would split those four keys across different slots.

        **Reference code.**

        ```python
        def ambil(kunci):
            diperiksa = 0
            for k in slot[indeks_slot(kunci, JUMLAH_SLOT)]:
                diperiksa += 1
                if k == kunci:
                    return ("ketemu", diperiksa)
            return (None, diperiksa)
        ```

        **Common trap.** The answer `0` assumes a missing key means nothing was checked —
        but the checks do happen, and that is exactly how the table learns the key is
        absent. The answer `1` assumes a hash table always finishes in one check, which
        swaps the average for a guarantee. The answer `2` confuses the **slot number**
        with the **number of checks**: `"z"` does head for slot 2, but what is printed is
        not its slot number — it is how many keys were checked **inside** that slot.

  # --- Kuis 4: memperbesar tabel saat faktor beban tinggi -------------------------
  - tipe: kuis
    skenario:
      id: |
        Sebuah tabel hash berisi 4 slot dan menyimpan 6 pasangan. Fungsi hash-nya
        menyebar kunci dengan cukup merata, sehingga isinya terbagi 2, 2, 1, 1 — dua
        slot berisi dua kunci, dua slot berisi satu. Tabelnya sudah terasa melambat.
        Apa yang sebaiknya dilakukan, dan kenapa?
      en: |
        A hash table with 4 slots holds 6 pairs. Its hash function spreads keys fairly
        evenly, so the contents split 2, 2, 1, 1 — two slots hold two keys, two slots
        hold one. The table already feels slow. What should be done, and why?
    opsi:
      - teks:
          id: Memperbesar tabel — menambah jumlah slot, lalu menghitung ulang tempat setiap kunci yang sudah ada — supaya rantainya kembali pendek dan biaya rata-ratanya kembali O(1)
          en: Enlarge the table — add more slots, then recompute the place of every existing key — so the chains become short again and the average cost returns to O(1)
        benar: true
      - teks:
          id: Menambah jumlah slot tanpa memindahkan kunci yang sudah ada, karena nomor slot sebuah kunci tidak berubah ketika jumlah slotnya bertambah
          en: Add more slots without moving the existing keys, because a key's slot number does not change when the number of slots grows
        benar: false
      - teks:
          id: Mengganti fungsi hash dengan yang tidak pernah menghasilkan tabrakan
          en: Replace the hash function with one that never produces a collision
        benar: false
      - teks:
          id: Mengurangi jumlah slot, karena tabel yang lebih kecil selalu lebih cepat diakses dan lebih hemat memori
          en: Reduce the number of slots, because a smaller table is always faster to access and uses less memory
        benar: false
    penjelasan:
      id: |
        **Pendekatan.** Yang membuat pencarian melambat bukan jumlah pasangannya
        sendiri, melainkan **faktor beban** — perbandingan antara jumlah kunci (6) dan
        jumlah slot (4). Di sini faktor bebannya 1,5, artinya rata-rata setiap slot
        berisi satu setengah kunci. Karena itu memperbaiki kecepatannya berarti
        **menurunkan faktor beban**, dan caranya adalah menambah jumlah slot.

        Menambah slot saja tidak cukup. Indeks slot dihitung dari `% jumlah_slot`, jadi
        begitu jumlah slotnya berubah dari 4 menjadi 8, hampir semua kunci berpindah
        tempat. Contohnya kunci `"abc"` yang tadi ada di slot `294 % 4 = 2` sekarang
        harus ke slot `294 % 8 = 6`. Karena itu seluruh kunci yang sudah ada harus
        **dihitung ulang** dan dipindahkan ke slot barunya.

        Sesudahnya, 6 kunci tersebar di 8 slot — faktor bebannya turun menjadi 0,75, dan
        rata-rata setiap slot berisi kurang dari satu kunci. Pencariannya kembali
        `O(1)`.

        **Kompleksitas.** Memperbesar tabel memakan waktu `O(n)`, karena setiap pasangan
        harus dipindahkan sekali. Tetapi ia jarang terjadi — hanya sesekali, saat faktor
        bebannya melewati batas. Sama seperti pertumbuhan array dinamis di Topik 2,
        biaya mahal itu dibagi ke banyak penambahan, sehingga rata-ratanya tetap `O(1)`.
        Yang penting, memperbesar tabel **memperbaiki penyebabnya** (rantai panjang),
        bukan hanya menambah ruang.

        **Kode referensi.**

        ```python
        def perbesar(self):
            lama = self.slot
            self.slot = [[] for _ in range(len(lama) * 2)]
            for rantai in lama:
                for kunci, nilai in rantai:
                    self.slot[indeks_slot(kunci, len(self.slot))].append((kunci, nilai))
        ```

        **Jebakan umum.** Jawaban "menambah jumlah slot tanpa memindahkan kunci"
        mengabaikan bahwa indeks slot dihitung dari `% jumlah_slot`, jadi begitu jumlah
        slotnya berubah, hampir semua kunci berpindah tempat — `294 % 4 = 2` menjadi
        `294 % 8 = 6`. Jawaban "mengganti fungsi hash supaya tidak pernah bertabrakan"
        mengejar hal yang mustahil: jumlah slot selalu terbatas, sedangkan jumlah kunci
        yang mungkin tidak, jadi tabrakan pasti terjadi dan yang perlu dilakukan adalah
        **menanganinya**, bukan mengharapkannya hilang. Jawaban "mengurangi jumlah
        slot" justru memperburuk keadaannya: dengan slot lebih sedikit, faktor bebannya
        **naik**, rantainya makin panjang, dan pencariannya makin lambat — kebalikan
        dari yang dibutuhkan.
      en: |
        **Approach.** What slows lookups is not the number of pairs by itself, but the
        **load factor** — the ratio between the number of keys (6) and the number of
        slots (4). Here the load factor is 1.5, meaning each slot holds one and a half
        keys on average. So improving speed means **lowering the load factor**, and the
        way to do that is to add slots.

        Adding slots alone is not enough. The slot index is computed from
        `% jumlah_slot`, so once the number of slots changes from 4 to 8, nearly every
        key changes place. For example the key `"abc"`, which was at slot `294 % 4 = 2`,
        must now go to slot `294 % 8 = 6`. So every existing key must be **recomputed**
        and moved to its new slot.

        Afterwards, 6 keys are spread across 8 slots — the load factor drops to 0.75,
        and the average slot holds less than one key. Lookups are `O(1)` again.

        **Complexity.** Enlarging the table costs `O(n)` time, because every pair must be
        moved once. But it happens rarely — only occasionally, when the load factor
        crosses a threshold. Just like the growth of a dynamic array in Topic 2, that
        expensive cost is spread across many additions, so the average stays `O(1)`.
        Importantly, enlarging the table **fixes the cause** (long chains), not merely
        adding room.

        **Reference code.**

        ```python
        def perbesar(self):
            lama = self.slot
            self.slot = [[] for _ in range(len(lama) * 2)]
            for rantai in lama:
                for kunci, nilai in rantai:
                    self.slot[indeks_slot(kunci, len(self.slot))].append((kunci, nilai))
        ```

        **Common trap.** The answer "add more slots without moving the keys" overlooks
        that the slot index is computed from `% jumlah_slot`, so once the number of slots
        changes, nearly every key changes place — `294 % 4 = 2` becomes `294 % 8 = 6`.
        The answer "replace the hash function so it never collides" chases something
        impossible: the number of slots is always limited while the number of possible
        keys is not, so collisions are certain and what is needed is to **handle** them,
        not to hope they vanish. The answer "reduce the number of slots" makes things
        worse: with fewer slots the load factor **rises**, the chains grow longer, and
        lookups get slower — the opposite of what is needed.

  # --- Kuis 5: penghapusan pada alamat terbuka -----------------------------------
  - tipe: kuis
    skenario:
      id: |
        Sebuah tabel hash memakai **alamat terbuka**: kalau slot yang dituju sudah
        terisi, kunci baru menempati slot kosong berikutnya. Sebuah kunci dihapus, dan
        slotnya dikosongkan sepenuhnya. Setelah itu, pencarian kunci lain yang tadinya
        menempati slot **setelah** slot yang dikosongkan itu gagal — padahal kunci itu
        masih ada di tabel. Kenapa?
      en: |
        A hash table uses **open addressing**: if the target slot is taken, the new key
        occupies the next free slot. A key is removed and its slot is emptied
        completely. Afterwards, a lookup for another key that had been placed in a slot
        **after** the emptied one fails — even though that key is still in the table.
        Why?
    opsi:
      - teks:
          id: Karena slot kosong itu menghentikan penelusuran lebih awal — pencarian menyimpulkan kuncinya tidak ada begitu menemukan slot kosong, sehingga penghapusan harus meninggalkan penanda batu nisan, bukan slot yang benar-benar kosong
          en: Because the empty slot ends the probe early — the lookup concludes the key is absent as soon as it meets an empty slot, so removal must leave a tombstone marker rather than a truly empty slot
        benar: true
      - teks:
          id: Karena fungsi hash ikut berubah setiap kali ada kunci yang dihapus
          en: Because the hash function changes every time a key is removed
        benar: false
      - teks:
          id: Karena rantai tempat kunci itu berada ikut terputus saat slot di sebelahnya dikosongkan
          en: Because the chain holding that key is broken when the neighbouring slot is emptied
        benar: false
      - teks:
          id: Karena menghapus satu kunci selalu menuntut seluruh tabel dihitung ulang lebih dulu
          en: Because removing one key always requires the whole table to be recomputed first
        benar: false
    penjelasan:
      id: |
        **Pendekatan.** Ingat dulu kenapa pencarian pada alamat terbuka bisa berhenti di
        tengah jalan. Saat mencari sebuah kunci, kamu mulai dari slot hasil hash-nya.
        Kalau slot itu bukan kunci yang dicari, kamu maju ke slot berikutnya, dan
        seterusnya. Pertanyaannya: kapan boleh berhenti?

        Jawaban yang lazim dan masuk akal: berhenti begitu menemukan slot **kosong**.
        Alasannya, kalau slotnya kosong, berarti kunci itu tidak pernah terlempar lebih
        jauh lagi. Aturan itu benar — **selama tidak ada penghapusan**.

        Penghapusan merusaknya. Misalkan kunci A ada di slot 2, dan kunci B yang
        seharusnya juga ke slot 2 terpaksa menempati slot 3. Kalau A dihapus dan slot 2
        dikosongkan, pencarian B akan mulai dari slot 2, menemukan slot kosong, dan
        langsung menyimpulkan B tidak ada — padahal B ada di slot 3. Satu slot kosong
        palsu memutus jalur pencarian semua kunci yang pernah terlempar melewatinya.

        Solusinya adalah **batu nisan**: slot yang dihapus ditandai "pernah terisi,
        sekarang tidak dipakai". Penelusuran tetap **melewatinya** seperti slot terisi,
        sehingga tidak berhenti lebih awal, tetapi penambahan baru boleh memakai
        kembali slot itu.

        **Kompleksitas.** Penghapusan dengan batu nisan sendiri tetap `O(1)` rata-rata —
        ia hanya menandai satu slot. Yang berubah hanyalah arti penanda "kosong": ada
        dua macam, yaitu "belum pernah terisi" (boleh menghentikan pencarian) dan
        "pernah terisi lalu dihapus" (tidak boleh). Kalau batu nisan dibiarkan menumpuk,
        tabelnya bisa penuh oleh penanda dan perlu diperbesar — itu sebabnya batu nisan
        yang terlalu banyak adalah tanda untuk memperbesar tabel, sama seperti faktor
        beban yang terlalu tinggi.

        **Kode referensi.**

        ```python
        # Salah: memutus jalur pencarian kunci lain
        def hapus_salah(self, kunci):
            self.slot[indeks_slot(kunci, self.jumlah_slot)] = None


        # Benar: berhenti HANYA di slot yang belum pernah terisi. Batu nisan
        # dilewati, bukan dianggap ujung.
        BATU_NISAN = object()


        def hapus(self, kunci):
            posisi = indeks_slot(kunci, self.jumlah_slot)
            while self.slot[posisi] is not None:
                if self.slot[posisi] is not BATU_NISAN and self.slot[posisi][0] == kunci:
                    self.slot[posisi] = BATU_NISAN
                    return True
                posisi = (posisi + 1) % self.jumlah_slot
            return False
        ```

        Perhatikan syarat perulangannya: `while self.slot[posisi] is not None` —
        **bukan** `while ... is not None and ... is not BATU_NISAN`. Kalau batu nisan
        ikut menghentikan perulangan, penghapusan akan gagal menemukan kunci yang
        berada setelahnya, dan itu persis kesalahan yang sedang dijelaskan di sini.

        **Jebakan umum.** Jawaban "fungsi hash ikut berubah" keliru: fungsi hash hanya
        bergantung pada kuncinya, bukan pada isi tabel — hasilnya untuk kunci yang sama
        selalu sama. Jawaban "rantai ikut terputus" membawa cara berpikir dari
        **rantai** ke dalam **alamat terbuka**: di alamat terbuka tidak ada rantai sama
        sekali, yang ada hanya urutan slot, dan itulah yang terganggu. Jawaban "harus
        dihitung ulang lebih dulu" mencampur penghapusan dengan memperbesar tabel:
        memperbesar memang menghitung ulang seluruh kunci, tetapi menghapus satu kunci
        tidak.
      en: |
        **Approach.** First recall why a lookup under open addressing may stop partway.
        When looking for a key, you start at its hash slot. If that slot does not hold
        the key, you step to the next slot, and so on. The question is: when may you
        stop?

        The usual, sensible answer: stop as soon as you meet an **empty** slot. The
        reasoning is that an empty slot means the key could never have been pushed
        further. That rule is correct — **as long as nothing is ever removed**.

        Removal breaks it. Suppose key A sits in slot 2, and key B, which also wants
        slot 2, was forced into slot 3. If A is removed and slot 2 is emptied, the lookup
        for B starts at slot 2, finds an empty slot, and immediately concludes B is
        absent — even though B is in slot 3. One false empty slot cuts the search path of
        every key that had ever been pushed past it.

        The fix is a **tombstone**: a removed slot is marked "was occupied, is now
        unused". Lookups still **step over** it like an occupied slot, so they do not
        stop early, while new additions may reuse that slot.

        **Complexity.** Removal with a tombstone is itself still `O(1)` on average — it
        only marks one slot. What changes is the meaning of the "empty" marker: there are
        now two kinds, "never occupied" (may stop a lookup) and "occupied then removed"
        (must not). If tombstones are allowed to pile up, the table can fill with
        markers and needs enlarging — which is why too many tombstones are a signal to
        enlarge the table, just like a load factor that is too high.

        **Reference code.**

        ```python
        # Wrong: cuts the search path of other keys
        def hapus_salah(self, kunci):
            self.slot[indeks_slot(kunci, self.jumlah_slot)] = None


        # Right: stop ONLY at a slot that was never occupied. A tombstone is
        # stepped over, not treated as the end.
        BATU_NISAN = object()


        def hapus(self, kunci):
            posisi = indeks_slot(kunci, self.jumlah_slot)
            while self.slot[posisi] is not None:
                if self.slot[posisi] is not BATU_NISAN and self.slot[posisi][0] == kunci:
                    self.slot[posisi] = BATU_NISAN
                    return True
                posisi = (posisi + 1) % self.jumlah_slot
            return False
        ```

        Note the loop condition: `while self.slot[posisi] is not None` — **not**
        `while ... is not None and ... is not BATU_NISAN`. If a tombstone also stopped
        the loop, removal would fail to find a key sitting after it, which is exactly
        the mistake being described here.

        **Common trap.** The answer "the hash function changes" is wrong: a hash function
        depends only on the key, not on the table's contents — it always gives the same
        result for the same key. The answer "the chain is broken" carries **chaining**
        thinking into **open addressing**: under open addressing there is no chain at
        all, only a sequence of slots, and that is what gets disturbed. The answer "must
        be recomputed first" mixes removal up with enlarging the table: enlarging does
        recompute every key, but removing one key does not.

  # --- Soal Kode: tabel hash dengan rantai, dari nol -----------------------------
  - tipe: soal-kode
    skenario:
      id: |
        Tulis dari nol sebuah tabel hash yang menangani tabrakan dengan **rantai** —
        sebuah kelas yang menyimpan pasangan kunci–nilai di dalam slot, dan menyediakan
        operasi dasarnya sendiri. Kamu menerima daftar perintah, dan harus mengembalikan
        daftar hasil untuk setiap perintah yang menghasilkan nilai.

        Tabelnya punya tepat **4 slot**. Fungsi hash-nya sudah ditetapkan supaya
        hasilnya bisa diperiksa: jumlahkan `ord()` setiap huruf kunci, lalu ambil sisa
        baginya dengan 4. Contohnya `"abc"` → 97 + 98 + 99 = 294 → `294 % 4 = 2`, jadi
        `"abc"` berada di slot 2.

        Setiap perintah adalah daftar:

        - `["tambah", kunci, nilai]` menyimpan pasangan itu. Kalau kuncinya sudah ada,
          nilainya **diperbarui** dan ukurannya tidak bertambah. Tidak menghasilkan
          nilai.
        - `["ambil", kunci]` mengembalikan nilai kunci itu, atau `None` kalau tidak ada.
        - `["hapus", kunci]` membuang pasangan itu dan mengembalikan `True` kalau ada
          yang dibuang, `False` kalau tidak ada.
        - `["ukuran"]` mengembalikan banyaknya pasangan yang tersimpan.
        - `["slot", kunci]` mengembalikan nomor slot kunci itu (0 sampai 3).
        - `["kunci"]` mengembalikan seluruh kunci yang tersimpan, **terurut menaik**
          (pakai `sorted`), supaya hasilnya selalu sama urutannya.

        Untuk perintah yang tidak menghasilkan nilai, catat `None`.

        Jangan memakai `dict` sebagai pengganti kelasnya untuk menyimpan data —
        implementasikan sendiri `tambah`, `ambil`, `hapus`, `ukuran`, `slot`, dan `kunci`,
        supaya kamu merasakan mekanisme slot dan rantainya. Kamu boleh memakai `list`
        biasa untuk slot, untuk rantai di dalamnya, dan untuk mengumpulkan hasil perintah.

        Ingat bahwa satu slot boleh berisi **lebih dari satu** pasangan, jadi saat
        mengambil atau menghapus kamu harus memeriksa isi rantainya satu per satu — dan
        membandingkan kuncinya, bukan hanya menemukan slotnya.
      en: |
        Write from scratch a hash table that handles collisions with **chaining** — a
        class that stores key–value pairs inside slots, and provides its own basic
        operations. You receive a list of commands, and must return a list of results for
        each command that produces a value.

        The table has exactly **4 slots**. Its hash function is fixed so that results can
        be checked: add the `ord()` of every letter of the key, then take the remainder
        modulo 4. For example `"abc"` → 97 + 98 + 99 = 294 → `294 % 4 = 2`, so `"abc"`
        lives in slot 2.

        Each command is a list:

        - `["tambah", kunci, nilai]` stores that pair. If the key already exists, its
          value is **updated** and the size does not grow. Produces no value.
        - `["ambil", kunci]` returns that key's value, or `None` if there is none.
        - `["hapus", kunci]` removes that pair and returns `True` if something was
          removed, `False` if not.
        - `["ukuran"]` returns how many pairs are stored.
        - `["slot", kunci]` returns that key's slot number (0 through 3).
        - `["kunci"]` returns every stored key, **sorted ascending** (use `sorted`), so
          the order is always the same.

        For commands that produce no value, record `None`.

        Do not use `dict` in place of the class to store the data — implement `tambah`,
        `ambil`, `hapus`, `ukuran`, `slot`, and `kunci` yourself, so that you feel the
        slot and chain mechanism. You may use a plain `list` for the slots, for the chain
        inside each, and to collect the command results.

        Remember that one slot may hold **more than one** pair, so when reading or
        removing you must check that chain's contents one by one — and compare the keys,
        not merely find the slot.
    fungsi: proses
    test_case:
      # Kasus 1 — tambah lalu ambil; kunci berbeda tetap terpisah.
      - argumen:
          - - ["tambah", "a", 1]
            - ["tambah", "b", 2]
            - ["ambil", "a"]
            - ["ambil", "b"]
            - ["ukuran"]
        diharapkan: [null, null, 1, 2, 2]
      # Kasus 2 — memperbarui kunci yang sudah ada menimpa nilainya, ukuran tetap.
      - argumen:
          - - ["tambah", "x", 1]
            - ["tambah", "x", 2]
            - ["ambil", "x"]
            - ["ukuran"]
        diharapkan: [null, null, 2, 1]
      # Kasus 3 — tabrakan: "b", "f", "j" semuanya ke slot 2; "d" ke slot 0.
      - argumen:
          - - ["tambah", "b", 1]
            - ["tambah", "f", 2]
            - ["tambah", "j", 3]
            - ["tambah", "d", 4]
            - ["slot", "b"]
            - ["slot", "d"]
            - ["kunci"]
            - ["ukuran"]
        diharapkan: [null, null, null, null, 2, 0, ["b", "d", "f", "j"], 4]
      # Kasus 4 — kunci yang tidak ada: ambil -> None, hapus -> False.
      - argumen:
          - - ["tambah", "a", 1]
            - ["ambil", "z"]
            - ["hapus", "z"]
            - ["ukuran"]
        diharapkan: [null, null, false, 1]
      # Kasus 5 — hapus di tengah rantai, lalu tambah lagi kunci yang sama.
      - argumen:
          - - ["tambah", "b", 1]
            - ["tambah", "f", 2]
            - ["tambah", "j", 3]
            - ["hapus", "f"]
            - ["kunci"]
            - ["ukuran"]
            - ["ambil", "j"]
            - ["tambah", "f", 9]
            - ["kunci"]
        diharapkan: [null, null, null, true, ["b", "j"], 2, 3, null, ["b", "f", "j"]]
    solusi_referensi: |
      JUMLAH_SLOT = 4


      def kode_hash(kunci):
          total = 0
          for huruf in kunci:
              total += ord(huruf)
          return total


      def indeks_slot(kunci):
          return kode_hash(kunci) % JUMLAH_SLOT


      class TabelHash:
          def __init__(self):
              # Satu slot berisi daftar pasangan (kunci, nilai) — inilah rantainya.
              self.slot = [[] for _ in range(JUMLAH_SLOT)]
              self._ukuran = 0

          def tambah(self, kunci, nilai):
              rantai = self.slot[indeks_slot(kunci)]
              for posisi in range(len(rantai)):
                  if rantai[posisi][0] == kunci:
                      rantai[posisi] = (kunci, nilai)   # perbarui, bukan tambah
                      return
              rantai.append((kunci, nilai))
              self._ukuran += 1

          def ambil(self, kunci):
              # Slot yang benar hanya mempersempit tempat; kuncinya tetap harus diperiksa.
              for k, nilai in self.slot[indeks_slot(kunci)]:
                  if k == kunci:
                      return nilai
              return None

          def hapus(self, kunci):
              rantai = self.slot[indeks_slot(kunci)]
              for posisi in range(len(rantai)):
                  if rantai[posisi][0] == kunci:
                      rantai.pop(posisi)
                      self._ukuran -= 1
                      return True
              return False

          def ukuran(self):
              return self._ukuran

          def slot_dari(self, kunci):
              return indeks_slot(kunci)

          def semua_kunci(self):
              hasil = []
              for rantai in self.slot:
                  for k, nilai in rantai:
                      hasil.append(k)
              return sorted(hasil)


      def proses(perintah):
          tabel = TabelHash()
          hasil = []
          for satu in perintah:
              operasi = satu[0]
              if operasi == "tambah":
                  tabel.tambah(satu[1], satu[2])
                  hasil.append(None)
              elif operasi == "ambil":
                  hasil.append(tabel.ambil(satu[1]))
              elif operasi == "hapus":
                  hasil.append(tabel.hapus(satu[1]))
              elif operasi == "ukuran":
                  hasil.append(tabel.ukuran())
              elif operasi == "slot":
                  hasil.append(tabel.slot_dari(satu[1]))
              elif operasi == "kunci":
                  hasil.append(tabel.semua_kunci())
          return hasil

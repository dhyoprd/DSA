# Topik 5 — Hash Table.
#
# Topik kelima di Jalur, `prasyarat: [2, 4]` (Array & String, Stack & Queue). Materi di
# sini memakai dua hal yang diajarkan Topik sebelumnya: gagasan "alamat bisa dihitung
# dari nomor" dari Array (#17), dan gagasan "satu slot menyimpan banyak nilai" dari
# Stack & Queue (#4). Itu sebabnya keduanya jadi prasyarat.
#
# **Tidak ada penyimpangan yang perlu dicatat.** `docs/design-tree.md` menetapkan Soal
# Kode berbentuk "implementasi struktur data dari nol". Hash table **adalah** struktur
# data, jadi bentuk itu bisa dipakai apa adanya di sini — sama seperti Array & String
# (#17) dan Linked List (#18), dan berbeda dari Big-O (#16), yang bukan struktur data
# dan karena itu butuh ADR-0023. Berkas ini tidak menuntut ADR baru.
#
# **Pembahasan hanya untuk kelima Kuis.** Soal Kode di sini tidak punya Pembahasan,
# karena skema di issue #1 — dan `frontend/src/lib/konten/tipe.ts` — tidak punya field
# `penjelasan` pada `SoalKode`. Pemilik sudah memutuskan (2026-10-06) bahwa cukup 5
# Pembahasan per Topik, sama seperti #10, #16, #17, dan #18.
#
# Semua Soal dan Pembahasan di sini ditulis original, sesuai ADR-0005. Tidak ada teks
# LeetCode yang disalin maupun diterjemahkan.
#
# **Setiap angka di berkas ini sudah dijalankan, bukan dibaca.** Yang diperiksa dengan
# menjalankan Python: hasil `isi_slot(["abc", "d", "b"], 4)` = `[1, 0, 2, 0]`; jumlah
# pemeriksaan saat `ambil("z")` pada rantai berisi empat kunci = 4; dan kelima test case
# Soal Kode. Jebakan 78 dari handoff #18 memperingatkan bahwa gerbang yang ada tidak
# menangkap tiga kelas cacat — rumus yang salah, pengecoh yang ternyata juga benar, dan
# kartu yang mengajarkan di luar Materi. Karena itu berkas ini ditulis berdampingan
# dengan skrip pemeriksa mandiri, dan **setiap pengecoh sudah dipastikan benar-benar
# salah** (bukan sekadar terlihat salah).
#
# `nomor`, `slug`, `judul`, dan `prasyarat` harus sama dengan content/jalur.yaml —
# validator menolak build kalau berbeda.

nomor: 5
slug: hash-table
judul:
  id: Hash Table
  en: Hash Table
prasyarat: [2, 4]

# Sumber terstruktur untuk ekspor CSV/Anki (ticket #14). Isinya struktur data Topik ini
# beserta biaya operasinya. `waktu` dan `ruang` memakai notasi O(...) apa adanya —
# notasi itu sama di kedua bahasa, jadi menerjemahkannya hanya menghasilkan dua salinan
# yang bisa menyimpang tanpa menambah informasi.
#
# **Kata "rata-rata" sengaja diletakkan di `nama`, bukan di `waktu`.** `nama` memang
# dwibahasa, sedangkan `waktu` tidak — menulis "O(1) rata-rata" di `waktu` akan
# menyelipkan kata Indonesia ke kartu English. Karena itu `waktu` tetap murni `O(1)`
# dan `O(n)`, dan keterangannya ikut di nama operasinya.
#
# **Nilai yang memuat koma WAJIB dikutip.** Dalam pemetaan alir YAML (`{ ... }`), koma
# memisahkan entri — jadi `{ id: Tambah kunci, rata-rata, en: ... }` menghasilkan
# `id: "Tambah kunci"` plus kunci liar `rata-rata: null`, dan kata "rata-rata" hilang
# dari kartu tanpa error apa pun. Gerbang konten tidak menangkapnya: validator hanya
# memeriksa `id` dan `en` terisi, bukan bahwa tidak ada kunci lain. Yang menemukannya
# adalah skrip pemeriksa mandiri (jebakan 78). Kutipan di bawah bukan hiasan.
#
# **Nilai di sini wajib sama dengan tabel di bagian "Tabel kompleksitas" di Materi.**
# ADR-0019 mencatat bahwa keduanya memang bisa menyimpang dan tidak ada gerbang yang
# membandingkannya — yang menjaganya adalah disiplin saat menyunting.
kompleksitas:
  - struktur:
      id: Tabel hash (rantai)
      en: Hash table (chaining)
    ruang: O(n)
    operasi:
      - nama: { id: "Tambah atau perbarui satu kunci, rata-rata", en: "Add or update one key, on average" }
        waktu: O(1)
      - nama: { id: "Ambil nilai satu kunci, rata-rata", en: "Read the value of one key, on average" }
        waktu: O(1)
      - nama: { id: "Hapus satu kunci, rata-rata", en: "Remove one key, on average" }
        waktu: O(1)
      - nama: { id: Tambah atau ambil saat semua kunci bertabrakan, en: Add or read when every key collides }
        waktu: O(n)
      - nama: { id: Tampilkan seluruh kunci, en: List every key }
        waktu: O(n)

  - struktur:
      id: Tabel hash (alamat terbuka)
      en: Hash table (open addressing)
    ruang: O(n)
    operasi:
      - nama: { id: "Tambah atau ambil, rata-rata", en: "Add or read, on average" }
        waktu: O(1)
      - nama: { id: Tambah saat slot terisi berderet, en: Add when slots are filled in a run }
        waktu: O(n)

# Istilah yang layak dihafal. `istilah` adalah pasangan Indonesia–English; `definisi`
# menjelaskannya di kedua bahasa. Setiap pasangan di bawah ini berbeda antara kedua
# bahasa, jadi setiap istilah menghasilkan dua kartu: definisinya, dan pasangannya.
#
# **Setiap kartu di sini mengajarkan sesuatu yang memang ada di Materi.** Itu kelas cacat
# yang ditemukan di #17 dan #18 (kartu `Ekor`/`Tail` mengajarkan penunjuk ekor yang nol
# kali disebut di Materi). Kedelapan istilah di bawah muncul di Materi, bukan hanya di
# sini.
istilah:
  - istilah: { id: Tabel hash, en: Hash table }
    definisi:
      id: Struktur data yang menyimpan pasangan kunci dan nilai, dan menemukan kembali sebuah kunci dengan mengubahnya lebih dulu menjadi nomor slot. Nomor itulah yang membuat pencarian selesai tanpa memeriksa seluruh isi.
      en: A data structure that stores key-value pairs and finds a key again by first turning it into a slot number. That number is what lets a lookup finish without examining the whole contents.
  - istilah: { id: Fungsi hash, en: Hash function }
    definisi:
      id: Fungsi yang mengubah sebuah kunci menjadi nomor. Nomor itu dipakai untuk menentukan slot tempat nilainya disimpan. Fungsi yang baik menyebar kunci secara merata, supaya tidak banyak kunci menumpuk di satu slot.
      en: A function that turns a key into a number. That number decides the slot where its value is stored. A good one spreads keys evenly, so that few keys pile up in one slot.
  - istilah: { id: Kunci, en: Key }
    definisi:
      id: Penanda yang kamu pakai untuk menyimpan dan mengambil sebuah nilai, misalnya nama pengguna atau nomor halaman. Kunci inilah yang diubah fungsi hash menjadi nomor slot.
      en: The label you use to store and fetch a value, such as a username or a page number. It is the key that the hash function turns into a slot number.
  - istilah: { id: Nilai, en: Value }
    definisi:
      id: Data yang disimpan di bawah sebuah kunci. Di dalam tabel hash, yang dicari adalah kuncinya; nilainya ikut terbawa begitu kuncinya ditemukan.
      en: The data stored under a key. Inside a hash table, the key is what gets looked up; the value comes along once the key is found.
  - istilah: { id: Tabrakan, en: Collision }
    definisi:
      id: Keadaan ketika dua kunci yang berbeda menghasilkan nomor slot yang sama. Ini tidak bisa dihindari sepenuhnya — jumlah slot selalu terbatas, sedangkan jumlah kunci yang mungkin tidak. Tabrakan harus ditangani, bukan dicegah.
      en: The situation where two different keys produce the same slot number. It cannot be avoided entirely — the number of slots is always limited, while the number of possible keys is not. Collisions must be handled, not prevented.
  - istilah: { id: Rantai, en: Chaining }
    definisi:
      id: Cara menangani tabrakan dengan membiarkan satu slot menampung banyak pasangan sekaligus, biasanya sebagai daftar. Kunci yang bertabrakan ditaruh berurutan di slot yang sama, lalu diperiksa satu per satu saat dicari.
      en: A way to handle collisions by letting one slot hold many pairs at once, usually as a list. Keys that collide are placed one after another in the same slot, then checked one by one when looked up.
  - istilah: { id: Faktor beban, en: Load factor }
    definisi:
      id: Perbandingan antara banyaknya kunci yang tersimpan dan banyaknya slot yang tersedia. Makin tinggi nilainya, makin panjang rantai rata-ratanya, dan makin melambat pencariannya. Karena itu tabel diperbesar sebelum nilainya terlalu tinggi.
      en: The ratio between the number of keys stored and the number of slots available. The higher it is, the longer the average chain, and the slower lookups become. That is why a table is enlarged before it gets too high.
  - istilah: { id: Alamat terbuka, en: Open addressing }
    definisi:
      id: Cara menangani tabrakan tanpa daftar di dalam slot. Kalau slot yang dituju sudah terisi, kunci baru mencari slot kosong berikutnya. Konsekuensinya, penghapusan tidak boleh mengosongkan slot begitu saja, karena itu memutus jalur pencarian kunci lain.
      en: A way to handle collisions without a list inside the slot. If the target slot is taken, the new key looks for the next free slot. As a consequence, removal must not simply empty a slot, because that would break the search path of other keys.

materi:
  id: |
    ## Kenapa mencari satu nilai itu mahal

    Di Topik 2 dan Topik 3 kamu bertemu dua cara menyimpan data, dan keduanya punya
    kelemahan yang sama begitu harus mencari. Pada array, mencari satu nilai berarti
    memeriksa elemen satu per satu dari awal — `O(n)`. Pada linked list sama saja: kamu
    harus berjalan dari kepala — `O(n)`. Untuk sejuta data, itu sejuta pemeriksaan.

    Pertanyaannya: bisakah pencarian selesai dalam satu langkah, tanpa memeriksa yang
    lain?

    Array sudah bisa melakukan itu untuk satu hal: mengambil elemen **ke-i**. Karena
    alamatnya bisa dihitung dari nomornya, `data[5000]` langsung sampai. Yang tidak bisa
    dilakukan array adalah melakukan hal yang sama untuk **nilai**: "di mana elemen yang
    bernilai 42?" tetap butuh menelusuri, karena 42 tidak memberi tahu di nomor berapa
    ia disimpan.

    Hash table menutup celah itu dengan satu gagasan: **ubah dulu kuncinya menjadi
    nomor**, lalu pakai nomor itu seperti indeks array.

    ## Fungsi hash: kunci menjadi nomor

    Sebuah **tabel hash** (*hash table*) menyimpan pasangan **kunci** (*key*) dan
    **nilai** (*value*). Kuncinya adalah penanda yang kamu pakai untuk mengambil kembali
    nilainya — misalnya nama pengguna, nomor halaman, atau kode barang.

    Yang mengubah kunci menjadi nomor adalah **fungsi hash** (*hash function*). Bentuknya
    bisa sesederhana ini:

    ```python
    def kode_hash(kunci):
        total = 0
        for huruf in kunci:
            total += ord(huruf)      # ord("a") = 97, ord("b") = 98, ...
        return total


    def indeks_slot(kunci, jumlah_slot):
        return kode_hash(kunci) % jumlah_slot
    ```

    `%` adalah sisa bagi, dan gunanya di sini satu: memastikan nomornya selalu jatuh di
    antara `0` dan `jumlah_slot - 1`. Berapa pun besar hasil `kode_hash`, `%` memotongnya
    ke dalam rentang yang sah.

    Untuk tabel berisi 4 slot, kunci `"d"` menghasilkan `100 % 4 = 0`, jadi nilainya
    disimpan di slot 0. Kunci `"abc"` menghasilkan `294 % 4 = 2`, jadi ke slot 2.
    Menyimpan dan mengambil sama-sama memakai perhitungan yang sama, sehingga keduanya
    bisa langsung menuju slot yang benar.

    Perhatikan satu hal penting: fungsi hash **tidak** perlu menghasilkan nomor yang
    unik untuk setiap kunci. Ia hanya perlu menghasilkan nomor yang **sama** setiap kali
    kunci yang sama di-hash. Kestabilan itulah yang membuat pencarian bekerja.

    ## Tabrakan: dua kunci, satu slot

    Kalau fungsi hash tidak perlu unik, apa yang terjadi kalau dua kunci menghasilkan
    nomor yang sama? Itulah **tabrakan** (*collision*).

    Contohnya kunci `"abc"` dan `"cba"`. Keduanya berisi huruf yang sama, hanya berbeda
    urutan, sehingga jumlah `ord`-nya sama-sama 294 — dan `294 % 4` sama-sama 2. Kedua
    kunci itu menuju slot yang sama.

    Tabrakan **tidak bisa dihindari sepenuhnya**, dan alasannya bukan karena fungsi
    hash-nya kurang bagus. Jumlah slot selalu terbatas (4, 100, atau sejuta), sedangkan
    jumlah kunci yang mungkin tidak terbatas. Kalau kunci lebih banyak daripada slot,
    ada dua kunci yang pasti berbagi slot — itu kepastian matematis, bukan kebetulan.

    Karena itu pertanyaan yang benar bukan "bagaimana mencegah tabrakan", melainkan
    **"bagaimana menanganinya"**. Ada dua cara yang lazim, dan keduanya dibahas di sini.

    ## Rantai: menumpuk yang bertabrakan

    Cara pertama bernama **rantai** (*chaining*). Idenya: satu slot tidak menyimpan satu
    nilai, melainkan **daftar** nilai.

    ```
    slot 0 → [ ("d", 100) ]
    slot 1 → [ ]
    slot 2 → [ ("abc", 1), ("b", 2) ]     ← dua kunci bertabrakan di sini
    slot 3 → [ ]
    ```

    Menambah sebuah pasangan berarti: hitung slotnya, lalu tambahkan pasangan itu ke
    daftar di slot tersebut. Kalau kuncinya sudah ada di daftar itu, nilainya
    **diperbarui**, bukan ditambahkan lagi.

    ```python
    JUMLAH_SLOT = 4


    class TabelHash:
        def __init__(self):
            self.slot = [[] for _ in range(JUMLAH_SLOT)]
            self.ukuran = 0

        def tambah(self, kunci, nilai):
            rantai = self.slot[indeks_slot(kunci, JUMLAH_SLOT)]
            for posisi in range(len(rantai)):
                if rantai[posisi][0] == kunci:
                    rantai[posisi] = (kunci, nilai)     # perbarui
                    return
            rantai.append((kunci, nilai))               # kunci baru
            self.ukuran += 1
    ```

    Mengambil sebuah nilai berarti: hitung slotnya, lalu periksa daftar di slot itu satu
    per satu sampai kuncinya ketemu. Kalau tidak ada, hasilnya `None`.

    ```python
    def ambil(self, kunci):
        for k, nilai in self.slot[indeks_slot(kunci, JUMLAH_SLOT)]:
            if k == kunci:
                return nilai
        return None
    ```

    Perhatikan bahwa pemeriksaan `k == kunci` tetap perlu walaupun slotnya sudah benar.
    Slot yang benar hanya mempersempit tempat mencari; ia tidak menjamin bahwa yang ada
    di situ adalah kunci yang dicari.

    ## Kenapa rata-ratanya O(1)

    Kalau setiap slot hanya berisi satu pasangan, mengambil satu nilai berarti: satu
    perhitungan hash, satu kali menuju slot, selesai. Tidak peduli tabelnya berisi
    seratus atau sejuta pasangan — jumlah langkahnya tetap. Itu `O(1)`.

    Yang membuatnya menjadi lambat adalah rantai yang panjang. Kalau semua kunci
    bertabrakan ke satu slot, tabelnya berubah menjadi linked list biasa, dan
    pencariannya kembali `O(n)`.

    Seberapa panjang rantai rata-ratanya ditentukan oleh **faktor beban** (*load
    factor*): perbandingan antara banyaknya kunci yang tersimpan dan banyaknya slot.

    ```
    faktor beban = jumlah kunci / jumlah slot
    ```

    Selama faktor bebannya tetap kecil (praktik yang lazim: dijaga di bawah sekitar
    0,7), rantai rata-ratanya pendek dan biayanya tetap `O(1)`. Begitu faktor bebannya
    mendekati 1 atau lebih, rantainya memanjang dan biayanya naik.

    Jadi jawaban jujurnya: **`O(1)` rata-rata, `O(n)` pada kasus terburuk.** Rata-rata
    karena kunci yang baik menyebar merata; terburuk karena selalu ada kemungkinan semua
    kunci menumpuk di satu slot. Yang pertama berlaku untuk pemakaian sehari-hari, yang
    kedua berlaku untuk fungsi hash yang buruk atau penyerang yang sengaja memilih kunci
    yang bertabrakan.

    ## Memperbesar tabel

    Kalau faktor bebannya sudah terlalu tinggi, memperpanjang rantai bukan jawabannya.
    Yang dilakukan adalah **memperbesar tabel**: jumlah slot dinaikkan, biasanya dua
    kali lipat, lalu **seluruh kunci yang sudah ada dihitung ulang** tempatnya.

    Penghitungan ulang itu perlu karena indeks slotnya bergantung pada `% jumlah_slot`.
    Begitu jumlah slotnya berubah dari 4 menjadi 8, `294 % 4 = 2` tidak lagi sama dengan
    `294 % 8 = 6`. Semua pasangan harus dipindahkan ke slot yang baru.

    ```python
    def perbesar(self):
        lama = self.slot
        self.slot = [[] for _ in range(len(lama) * 2)]
        for rantai in lama:
            for kunci, nilai in rantai:
                self.slot[indeks_slot(kunci, len(self.slot))].append((kunci, nilai))
    ```

    Memperbesar tabel memang memakan waktu `O(n)`, tetapi ia jarang terjadi: sesekali
    untuk setiap beberapa penambahan. Sama seperti pertumbuhan array dinamis di Topik 2,
    biaya mahalnya **dibagi** ke banyak operasi lain, sehingga rata-ratanya tetap
    `O(1)`. Yang penting, memperbesar tabel membuat rantai kembali pendek — itu tujuan
    sebenarnya, bukan sekadar menambah ruang.

    ## Alamat terbuka: mencari slot lain

    Cara kedua menangani tabrakan bernama **alamat terbuka** (*open addressing*). Di sini
    tidak ada daftar di dalam slot. Satu slot berisi tepat satu pasangan.

    Kalau slot yang dituju sudah terisi, kunci baru tidak menumpuk di situ. Ia mencari
    **slot kosong berikutnya**, berjalan maju satu per satu sampai menemukan yang
    kosong. Cara ini disebut *linear probing*.

    ```
    Ingin menaruh "b" di slot 2, tetapi slot 2 sudah terisi:
    slot 0 → kosong
    slot 1 → kosong
    slot 2 → ("abc", 1)          ← terisi
    slot 3 → ("b", 2)            ← terpaksa menempati slot berikutnya
    ```

    Perhatikan bahwa tidak ada tanda kurung siku di gambar ini — berbeda dari gambar
    rantai di atas. Pada alamat terbuka, **satu slot berisi satu pasangan saja**, bukan
    daftar. Itu perbedaan yang paling mudah tertukar antara kedua cara ini.

    Konsekuensinya, saat mengambil sebuah kunci, kamu tidak boleh berhenti begitu
    menemukan slot kosong sebelum kuncinya ketemu — kamu harus terus maju, karena kunci
    itu mungkin terlempar lebih jauh lagi.

    Dari situlah muncul satu jebakan yang khas: **menghapus tidak boleh mengosongkan
    slot begitu saja**. Kalau slot yang dihapus menjadi benar-benar kosong, pencarian
    kunci lain yang tadinya terlempar melewatinya akan berhenti di situ dan menyimpulkan
    kuncinya tidak ada — padahal ada. Solusinya adalah menandai slot itu sebagai
    **batu nisan** (*tombstone*): penanda "pernah terisi, sekarang tidak dipakai", yang
    tetap dilewati saat mencari tetapi boleh dipakai ulang saat menambah.

    ## Tabel kompleksitas

    | Operasi | Waktu | Kenapa |
    |---|---|---|
    | Tambah atau perbarui satu kunci (rantai) | O(1) rata-rata | Satu perhitungan hash, lalu rantai rata-ratanya pendek |
    | Ambil nilai satu kunci (rantai) | O(1) rata-rata | Sama: langsung menuju slotnya |
    | Hapus satu kunci (rantai) | O(1) rata-rata | Cari di rantai yang pendek, lalu putus |
    | Tambah atau ambil saat semua kunci bertabrakan | O(n) | Rantainya sepanjang seluruh isi tabel |
    | Tampilkan seluruh kunci | O(n) | Setiap pasangan harus dikunjungi sekali |
    | Tambah atau ambil (alamat terbuka) | O(1) rata-rata | Selama tabelnya belum padat, jarang perlu melompat jauh |
    | Tambah saat slot terisi berderet (alamat terbuka) | O(n) | Deretan slot terisi memaksa lompatan panjang |

    ## Jebakan yang sering terjadi

    **Mengira tabel hash selalu `O(1)`.** Ia `O(1)` **rata-rata**, dan itu bergantung pada
    fungsi hash yang menyebar merata serta faktor beban yang dijaga. Fungsi hash yang
    buruk — misalnya `len(kunci)` — membuat hampir semua kunci berbagi sedikit slot, dan
    tabelnya merosot menjadi linked list.

    **Memakai kunci yang isinya berubah.** Kalau kunci diubah setelah disimpan, hasil
    hash-nya berubah, dan nilainya tidak bisa ditemukan lagi di slot lamanya. Kunci
    harus tetap sama selama pasangannya ada di tabel.

    **Mengira satu slot berarti satu kunci.** Dengan rantai, satu slot boleh berisi
    banyak kunci. Yang menentukan di slot mana sebuah kunci berada hanyalah hasil fungsi
    hash, bukan urutan pemasukan.

    **Membandingkan tanpa memeriksa kuncinya.** Karena beberapa kunci bisa berbagi slot,
    menemukan sesuatu di slot yang benar belum berarti itu kuncinya. Perbandingan
    `k == kunci` tetap wajib.

    **Menghapus dengan mengosongkan slot pada alamat terbuka.** Sudah dibahas di atas:
    itu memutus jalur pencarian kunci lain. Pakai batu nisan.

    **Menganggap urutan penyimpanan terjaga.** Tabel hash tidak menyimpan urutan apa
    pun. Kalau kamu butuh hasil yang berurutan, urutkan sendiri setelahnya — seperti
    yang dilakukan perintah `kunci` pada Soal Kode di Topik ini.

  en: |
    ## Why finding a single value is expensive

    In Topic 2 and Topic 3 you met two ways of storing data, and both share the same
    weakness the moment a search is needed. In an array, finding one value means
    checking elements one by one from the start — `O(n)`. In a linked list it is the
    same: you must walk from the head — `O(n)`. For a million items, that is a million
    checks.

    The question is: can a search finish in one step, without examining the rest?

    An array can already do that for one thing: reading the element **at position i**.
    Because its address can be computed from its number, `data[5000]` goes straight
    there. What an array cannot do is the same thing for a **value**: "where is the
    element whose value is 42?" still requires a walk, because 42 does not say at which
    position it is stored.

    A hash table closes that gap with a single idea: **turn the key into a number
    first**, then use that number like an array index.

    ## Hash function: a key becomes a number

    A **hash table** stores **key**–**value** pairs. The key is the label you use to get
    the value back — a username, a page number, or a product code, for instance.

    What turns a key into a number is the **hash function**. It can be as simple as
    this:

    ```python
    def kode_hash(kunci):
        total = 0
        for huruf in kunci:
            total += ord(huruf)      # ord("a") = 97, ord("b") = 98, ...
        return total


    def indeks_slot(kunci, jumlah_slot):
        return kode_hash(kunci) % jumlah_slot
    ```

    `%` is the remainder, and its job here is single: to make sure the number always
    falls between `0` and `jumlah_slot - 1`. However large `kode_hash` gets, `%` cuts it
    down into the valid range.

    For a table with 4 slots, the key `"d"` gives `100 % 4 = 0`, so its value is stored
    in slot 0. The key `"abc"` gives `294 % 4 = 2`, so it goes to slot 2. Storing and
    reading both use the same computation, so both can head straight for the right slot.

    Notice one important thing: the hash function does **not** need to produce a unique
    number for every key. It only needs to produce the **same** number every time the
    same key is hashed. That stability is what makes lookups work.

    ## Collisions: two keys, one slot

    If the hash function need not be unique, what happens when two keys produce the same
    number? That is a **collision**.

    For example the keys `"abc"` and `"cba"`. They hold the same letters, only in a
    different order, so their `ord` sums are both 294 — and `294 % 4` is 2 for both.
    Both keys head for the same slot.

    Collisions **cannot be avoided entirely**, and not because the hash function is not
    good enough. The number of slots is always limited (4, 100, or a million), while the
    number of possible keys is not. If there are more keys than slots, two keys are
    certain to share a slot — that is a mathematical certainty, not an accident.

    So the right question is not "how do we prevent collisions", but **"how do we handle
    them"**. There are two common ways, and both are covered here.

    ## Chaining: stacking what collides

    The first way is called **chaining**. The idea: one slot does not hold a single
    value, but a **list** of values.

    ```
    slot 0 → [ ("d", 100) ]
    slot 1 → [ ]
    slot 2 → [ ("abc", 1), ("b", 2) ]     ← two keys collide here
    slot 3 → [ ]
    ```

    Adding a pair means: compute its slot, then append the pair to the list in that
    slot. If the key is already in that list, its value is **updated** rather than added
    again.

    ```python
    JUMLAH_SLOT = 4


    class TabelHash:
        def __init__(self):
            self.slot = [[] for _ in range(JUMLAH_SLOT)]
            self.ukuran = 0

        def tambah(self, kunci, nilai):
            rantai = self.slot[indeks_slot(kunci, JUMLAH_SLOT)]
            for posisi in range(len(rantai)):
                if rantai[posisi][0] == kunci:
                    rantai[posisi] = (kunci, nilai)     # update
                    return
            rantai.append((kunci, nilai))               # new key
            self.ukuran += 1
    ```

    Reading a value means: compute its slot, then check the list in that slot one by one
    until the key is found. If it is not there, the result is `None`.

    ```python
    def ambil(self, kunci):
        for k, nilai in self.slot[indeks_slot(kunci, JUMLAH_SLOT)]:
            if k == kunci:
                return nilai
        return None
    ```

    Note that the `k == kunci` check is still needed even though the slot is right. The
    right slot only narrows down where to look; it does not guarantee that what sits
    there is the key you want.

    ## Why the average is O(1)

    If every slot holds a single pair, reading a value means: one hash computation, one
    step to the slot, done. It makes no difference whether the table holds a hundred
    pairs or a million — the number of steps stays the same. That is `O(1)`.

    What makes it slow is a long chain. If every key collides into one slot, the table
    turns into an ordinary linked list, and lookups go back to `O(n)`.

    How long the average chain is depends on the **load factor**: the ratio between the
    number of keys stored and the number of slots.

    ```
    load factor = number of keys / number of slots
    ```

    As long as the load factor stays small (a common practice is to keep it below about
    0.7), the average chain is short and the cost stays `O(1)`. Once the load factor
    approaches 1 or more, the chains grow and the cost rises.

    So the honest answer is: **`O(1)` on average, `O(n)` in the worst case.** Average,
    because good keys spread evenly; worst case, because there is always a chance that
    every key piles into one slot. The first holds for everyday use, the second holds
    for a poor hash function or an attacker who deliberately picks colliding keys.

    ## Enlarging the table

    If the load factor has grown too high, making the chains longer is not the answer.
    What you do is **enlarge the table**: the number of slots goes up, usually doubled,
    and then **every existing key is recomputed** into its new place.

    That recomputation is necessary because the slot index depends on `% jumlah_slot`.
    Once the number of slots changes from 4 to 8, `294 % 4 = 2` is no longer the same as
    `294 % 8 = 6`. Every pair must move to its new slot.

    ```python
    def perbesar(self):
        lama = self.slot
        self.slot = [[] for _ in range(len(lama) * 2)]
        for rantai in lama:
            for kunci, nilai in rantai:
                self.slot[indeks_slot(kunci, len(self.slot))].append((kunci, nilai))
    ```

    Enlarging the table does cost `O(n)` time, but it happens rarely: once every so many
    additions. Just like the growth of a dynamic array in Topic 2, the expensive part is
    **spread** across many other operations, so the average stays `O(1)`. Importantly,
    enlarging the table makes the chains short again — that is the real goal, not merely
    adding room.

    ## Open addressing: looking for another slot

    The second way to handle collisions is called **open addressing**. Here there is no
    list inside a slot. One slot holds exactly one pair.

    If the target slot is taken, the new key does not pile up there. It looks for the
    **next free slot**, stepping forward one at a time until it finds an empty one. This
    is called *linear probing*.

    ```
    "b" wants slot 2, but slot 2 is taken:
    slot 0 → empty
    slot 1 → empty
    slot 2 → ("abc", 1)          ← taken
    slot 3 → ("b", 2)            ← forced into the next slot
    ```

    Notice there are no square brackets in this picture — unlike the chaining picture
    above. Under open addressing, **one slot holds a single pair**, not a list. That is
    the easiest thing to mix up between the two approaches.

    As a consequence, when reading a key you must not stop at the first empty slot
    before the key is found — you have to keep going, because the key may have been
    pushed further along.

    That is where a characteristic trap comes from: **removal must not simply empty a
    slot**. If the removed slot becomes truly empty, a lookup for another key that had
    been pushed past it will stop there and conclude the key is absent — even though it
    is present. The fix is to mark that slot as a **tombstone**: a marker saying "was
    occupied, is now unused", which lookups still step over but additions may reuse.

    ## Complexity table

    | Operation | Time | Why |
    |---|---|---|
    | Add or update one key (chaining) | O(1) on average | One hash computation, then a short average chain |
    | Read the value of one key (chaining) | O(1) on average | Same: head straight for its slot |
    | Remove one key (chaining) | O(1) on average | Search a short chain, then unlink |
    | Add or read when every key collides | O(n) | The chain is as long as the whole table's contents |
    | List every key | O(n) | Every pair must be visited once |
    | Add or read (open addressing) | O(1) on average | While the table is not crowded, long jumps are rare |
    | Add when slots are filled in a run (open addressing) | O(n) | A run of occupied slots forces a long jump |

    ## Traps that catch people

    **Assuming a hash table is always `O(1)`.** It is `O(1)` **on average**, and that
    depends on a hash function that spreads evenly and a load factor that is kept in
    check. A poor hash function — `len(kunci)`, say — makes nearly all keys share a few
    slots, and the table slides back into a linked list.

    **Using a key whose contents change.** If the key is modified after being stored,
    its hash changes, and its value can no longer be found in the old slot. A key must
    stay the same for as long as its pair is in the table.

    **Assuming one slot means one key.** With chaining, a slot may hold many keys. The
    only thing deciding which slot a key sits in is the hash function's result, not the
    order of insertion.

    **Comparing without checking the key.** Since several keys may share a slot, finding
    something in the right slot does not yet mean it is your key. The `k == kunci`
    comparison is still required.

    **Removing by emptying the slot under open addressing.** Covered above: that breaks
    the search path of other keys. Use a tombstone.

    **Expecting the storage order to be kept.** A hash table keeps no order at all. If
    you need ordered output, sort it yourself afterwards — as the `kunci` command in
    this Topic's Code Problem does.


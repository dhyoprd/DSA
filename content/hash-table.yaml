      en: |
        The hash table below uses chaining. The `ambil` function returns the pair
        *(result, number of checks)*. Before the final call, four keys have been inserted
        so that all four occupy the same slot. What value is printed?
    kode: |
      def kode_hash(kunci):
          total = 0
          for huruf in kunci:
              total += ord(huruf)
          return total


      def indeks_slot(kunci, jumlah_slot):
          return kode_hash(kunci) % jumlah_slot


      JUMLAH_SLOT = 4
      slot = [[] for _ in range(JUMLAH_SLOT)]

      for kunci in ["b", "f", "j", "n"]:
          slot[indeks_slot(kunci, JUMLAH_SLOT)].append(kunci)


      def ambil(kunci):
          diperiksa = 0
          for k in slot[indeks_slot(kunci, JUMLAH_SLOT)]:

    solusi_referensi: |
      class Simpul:
          def __init__(self, nilai):
              self.nilai = nilai
              self.kiri = None
              self.kanan = None


      class PohonCari:
          def __init__(self):
              self.akar = None

          def sisip(self, nilai):
              # Turun mengikuti aturan BST sampai menemukan tempat kosong.
              # Nilai yang sama diabaikan: BST tidak menyimpan kembar.
              if self.akar is None:
                  self.akar = Simpul(nilai)
                  return
              sekarang = self.akar
              while True:
                  if nilai == sekarang.nilai:
                      return
                  if nilai < sekarang.nilai:
                      if sekarang.kiri is None:
                          sekarang.kiri = Simpul(nilai)
                          return
                      sekarang = sekarang.kiri
                  else:
                      if sekarang.kanan is None:
                          sekarang.kanan = Simpul(nilai)
                          return
                      sekarang = sekarang.kanan

          def cari(self, nilai):
              sekarang = self.akar
              while sekarang is not None:
                  if nilai == sekarang.nilai:
                      return True
                  if nilai < sekarang.nilai:
                      sekarang = sekarang.kiri
                  else:
                      sekarang = sekarang.kanan
              return False

          def hapus(self, nilai):
              self.akar, dibuang = self._hapus(self.akar, nilai)
              return dibuang

          def _hapus(self, simpul, nilai):
              # Mengembalikan (simpul pengganti, apakah ada yang dibuang).
              if simpul is None:
                  return None, False
              if nilai < simpul.nilai:
                  simpul.kiri, dibuang = self._hapus(simpul.kiri, nilai)
                  return simpul, dibuang
              if nilai > simpul.nilai:
                  simpul.kanan, dibuang = self._hapus(simpul.kanan, nilai)
                  return simpul, dibuang

              # Ketemu. Tiga keadaan, masing-masing butuh penanganan sendiri.
              if simpul.kiri is None and simpul.kanan is None:
                  return None, True
              if simpul.kiri is None:
                  return simpul.kanan, True
              if simpul.kanan is None:
                  return simpul.kiri, True

              # Dua anak: penerusnya yang naik, yaitu simpul paling kiri di
              # subpohon kanan.
              pengganti = simpul.kanan
              while pengganti.kiri is not None:
                  pengganti = pengganti.kiri
              simpul.nilai = pengganti.nilai
              simpul.kanan, _ = self._hapus(simpul.kanan, pengganti.nilai)
              return simpul, True

          def inorder(self):
              hasil = []
              self._inorder(self.akar, hasil)
              return hasil

          def _inorder(self, simpul, hasil):
              if simpul is None:
                  return
              self._inorder(simpul.kiri, hasil)
              hasil.append(simpul.nilai)
              self._inorder(simpul.kanan, hasil)

          def tinggi(self):
              return self._tinggi(self.akar)

          def _tinggi(self, simpul):
              if simpul is None:
                  return 0
              kiri = self._tinggi(simpul.kiri)
              kanan = self._tinggi(simpul.kanan)
              return 1 + (kiri if kiri > kanan else kanan)

          def ukuran(self):
              return self._ukuran(self.akar)

          def _ukuran(self, simpul):
              if simpul is None:
                  return 0
              return 1 + self._ukuran(simpul.kiri) + self._ukuran(simpul.kanan)


      def proses(perintah):
          pohon = PohonCari()
          hasil = []
          for satu in perintah:
              operasi = satu[0]
              if operasi == "sisip":
                  pohon.sisip(satu[1])
                  hasil.append(None)
              elif operasi == "cari":
                  hasil.append(pohon.cari(satu[1]))
              elif operasi == "hapus":
                  hasil.append(pohon.hapus(satu[1]))
              elif operasi == "inorder":
                  hasil.append(pohon.inorder())
              elif operasi == "tinggi":
                  hasil.append(pohon.tinggi())
              elif operasi == "ukuran":
                  hasil.append(pohon.ukuran())
          return hasil

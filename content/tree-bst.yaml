      en: |
        **Approach.** An in-order traversal visits **left, then the node, then right**.
        Because this tree obeys the BST rule — every value in the left subtree is
        smaller, and in the right subtree larger — an in-order traversal must produce an
        ascending order.

        Trace it from the root, `50`. It waits until its entire left subtree has been
        visited. The left subtree holds `30`, whose children are `20` and `40`; both of
        those also come before `30`. So `20` is recorded first, then `30`, then `40`.
        Only after that comes `50`. The right subtree works the same way, yielding `60`,
        `70`, `80`.

        The result: `[20, 30, 40, 50, 60, 70, 80]`.

        **Complexity.** An in-order traversal visits every node exactly once, so it costs
        `O(n)` — seven nodes here. The shape of the tree does not change this cost:
        balanced or skewed, every node still has to be visited. What the shape changes is
        **searching for one value**, not walking the whole tree.

        **Reference code.**

        ```python
        class Simpul:
            def __init__(self, nilai):
                self.nilai = nilai
                self.kiri = None
                self.kanan = None


        def sisip(akar, nilai):
            if akar is None:
                return Simpul(nilai)
            if nilai < akar.nilai:
                akar.kiri = sisip(akar.kiri, nilai)
            elif nilai > akar.nilai:
                akar.kanan = sisip(akar.kanan, nilai)
            return akar


        def inorder(simpul, hasil):
            if simpul is None:
                return
            inorder(simpul.kiri, hasil)
            hasil.append(simpul.nilai)
            inorder(simpul.kanan, hasil)


        akar = None
        for nilai in [50, 30, 70, 20, 40, 60, 80]:
            akar = sisip(akar, nilai)

        hasil = []
        inorder(akar, hasil)
        print(hasil)
        ```

        **Common trap.** The answer `[50, 30, 20, 40, 70, 60, 80]` is the **pre-order**
        result — the node first, then its children. The answer
        `[20, 40, 30, 60, 80, 70, 50]` is the **post-order** result — the children first,
        the node last. All three use almost identical code, with only the order of the
        calls differing, which makes them easy to mix up. The descending answer
        `[80, 70, ...]` would be right if the traversal were reversed (right first), or if
        the BST rule were broken. What to remember: **only in-order yields an ascending
        result on a BST** — that is the sign of it, not a coincidence.

  # --- Kuis 2: kenapa data berurutan merusak BST -------------------------------
  - tipe: kuis
    skenario:
      id: |
        Kamu memasukkan lima ratus nilai ke dalam pohon pencarian biner, satu per satu,
        dalam urutan menaik — `1`, lalu `2`, lalu `3`, sampai `500`. Kode `sisip`-nya
        persis seperti di Materi. Sesudah itu kamu mencari nilai `500`, dan pencariannya
        terasa lambat. Padahal jumlah nilainya sama saja dengan kalau dimasukkan dalam
        urutan acak. Kenapa bisa berbeda?
      en: |
        You insert five hundred values into a binary search tree, one by one, in
        ascending order — `1`, then `2`, then `3`, up to `500`. The `sisip` code is
        exactly as in the Materi. Afterwards you search for the value `500`, and the
        search feels slow. Yet the number of values is the same as if they had been
        inserted in random order. Why the difference?
    opsi:
      - teks:
          id: Karena setiap nilai baru selalu lebih besar, sehingga ia selalu turun ke kanan dan tidak pernah ada yang mengisi subpohon kiri. Pohonnya menjadi miring, tingginya 500, dan pencarian berubah menjadi O(n) seperti linked list
          en: Because every new value is always larger, so it always descends to the right and nothing ever fills the left subtree. The tree becomes skewed, its height is 500, and the search turns into O(n), just like a linked list
        benar: true
      - teks:
          id: Karena memasukkan lima ratus nilai memakan waktu lebih lama daripada mencari satu nilai, sehingga pencariannya ikut melambat
          en: Because inserting five hundred values takes longer than searching for one value, so the search slows down along with it
        benar: false
      - teks:
          id: Karena nilai 500 selalu berada di paling ujung, dan BST memang tidak pernah bisa menemukan nilai yang berada di ujung
          en: Because the value 500 always sits at the very end, and a BST can never find a value that sits at the end
        benar: false
      - teks:
          id: Karena pohonnya kehabisan ruang setelah lima ratus nilai, sehingga pencarian harus menunggu memori tersedia
          en: Because the tree runs out of space after five hundred values, so the search has to wait for memory to become available
        benar: false
    penjelasan:
      id: |
        **Pendekatan.** Ikuti apa yang dilakukan `sisip` untuk setiap nilai. Nilai
        pertama, `1`, menjadi akar. Nilai kedua, `2`, lebih besar daripada `1`, jadi ia
        turun ke kanan dan menjadi anak kanan. Nilai ketiga, `3`, juga lebih besar
        daripada `1`, lalu lebih besar daripada `2`, jadi ia turun dua kali ke kanan.
        Setiap nilai baru selalu lebih besar daripada semua yang sudah ada, sehingga ia
        **selalu** turun ke kanan.

        Akibatnya tidak ada satu pun simpul yang punya anak kiri:

        ```
        1
         \
          2
           \
            3
             \
             ... sampai 500
        ```

        Pohon seperti ini disebut **pohon miring**. Tingginya 500, bukan sekitar 9.
        Mencari `500` berarti menelusuri dari akar sampai daun paling bawah — lima ratus
        simpul diperiksa, sama seperti menelusuri linked list.

        **Kompleksitas.** Pada pohon seimbang, setiap langkah membuang separuh sisanya,
        sehingga pencarian `O(log n)` — untuk lima ratus nilai, sekitar 9 simpul. Pada
        pohon miring, setiap langkah hanya membuang satu simpul, sehingga pencarian
        `O(n)` — lima ratus simpul. Yang menentukan bukan banyaknya nilai, melainkan
        **tinggi pohon**, dan tinggi pohon ditentukan oleh urutan pemasukan.

        **Kode referensi.**

        ```python
        class Simpul:
            def __init__(self, nilai):
                self.nilai = nilai
                self.kiri = None
                self.kanan = None


        def sisip(akar, nilai):
            if akar is None:
                return Simpul(nilai)
            if nilai < akar.nilai:
                akar.kiri = sisip(akar.kiri, nilai)
            elif nilai > akar.nilai:
                akar.kanan = sisip(akar.kanan, nilai)
            return akar


        def tinggi(simpul):
            if simpul is None:
                return 0
            kiri = tinggi(simpul.kiri)
            kanan = tinggi(simpul.kanan)
            return 1 + (kiri if kiri > kanan else kanan)


        akar = None
        for nilai in range(1, 501):
            akar = sisip(akar, nilai)

        print("tinggi pohon miring 500 simpul:", tinggi(akar))
        ```

        Program di atas mencetak `tinggi pohon miring 500 simpul: 500`.

        **Jebakan umum.** Jawaban "memasukkan lebih lama" mencampur biaya **membangun**
        pohon dengan biaya **mencarinya**; keduanya diukur terpisah, dan yang lambat di
        sini adalah pencariannya. Jawaban "BST tidak bisa menemukan nilai di ujung" salah
        — ia bisa menemukannya, hanya saja lambat; hasilnya tetap benar, yang berubah
        hanya biayanya. Jawaban "kehabisan ruang" salah karena lima ratus nilai tetap
        memakan ruang `O(n)` berapa pun bentuk pohonnya. Pelajaran yang sebenarnya:
        **data yang datang sudah terurut adalah kasus terburuk bagi BST**, dan itu bukan
        kemungkinan yang jarang — data dari dunia nyata sering datang berurutan.

        Satu catatan tentang angka 500 di sini: `sisip` yang dipakai bersifat rekursif,
        dan rekursi sedalam itu sudah mendekati batas bawaan Python (1000 tingkat).
        Memasukkan seribu nilai berurutan lewat `sisip` rekursif justru **gagal dengan
        `RecursionError`** sebelum pohonnya selesai dibangun — jadi 500 dipilih supaya
        kodenya benar-benar bisa dijalankan. Itu sendiri pelajaran yang sejalan dengan
        Topik 6.
      en: |
        **Approach.** Follow what `sisip` does for each value. The first value, `1`,
        becomes the root. The second, `2`, is larger than `1`, so it descends right and
        becomes the right child. The third, `3`, is also larger than `1`, then larger than
        `2`, so it descends right twice. Every new value is always larger than everything
        already present, so it **always** descends right.

        As a result, not a single node has a left child:

        ```
        1
         \
          2
           \
            3
             \
             ... up to 500
        ```

        A tree like this is called a **skewed tree**. Its height is 500, not around 9.
        Searching for `500` means walking from the root down to the deepest leaf — five
        hundred nodes checked, exactly like walking a linked list.

        **Complexity.** On a balanced tree, each step discards half of what remains, so
        the search is `O(log n)` — for five hundred values, around 9 nodes. On a skewed
        tree, each step discards only one node, so the search is `O(n)` — five hundred
        nodes. What decides is not how many values there are, but the **height of the
        tree**, and the height is decided by the insertion order.

        **Reference code.**

        ```python
        class Simpul:
            def __init__(self, nilai):
                self.nilai = nilai
                self.kiri = None
                self.kanan = None


        def sisip(akar, nilai):
            if akar is None:
                return Simpul(nilai)
            if nilai < akar.nilai:
                akar.kiri = sisip(akar.kiri, nilai)
            elif nilai > akar.nilai:
                akar.kanan = sisip(akar.kanan, nilai)
            return akar


        def tinggi(simpul):
            if simpul is None:
                return 0
            kiri = tinggi(simpul.kiri)
            kanan = tinggi(simpul.kanan)
            return 1 + (kiri if kiri > kanan else kanan)


        akar = None
        for nilai in range(1, 501):
            akar = sisip(akar, nilai)

        print("tinggi pohon miring 500 simpul:", tinggi(akar))
        ```

        The program above prints `tinggi pohon miring 500 simpul: 500`.

        **Common trap.** The answer "inserting takes longer" mixes the cost of
        **building** the tree with the cost of **searching** it; the two are measured
        separately, and the slow one here is the search. The answer "a BST can never find
        a value at the end" is wrong — it can find it, just slowly; the result is still
        correct, only the cost changes. The answer "runs out of space" is wrong because
        five hundred values still take `O(n)` space whatever the shape. The real lesson:
        **data that already arrives sorted is the worst case for a BST**, and that is not
        a rare possibility — real-world data often arrives in order.

        One note on the number 500 here: the `sisip` used is recursive, and recursion that
        deep already approaches Python's default limit (1000 levels). Inserting a thousand
        ascending values through the recursive `sisip` actually **fails with a
        `RecursionError`** before the tree is finished — so 500 was chosen so the code
        really can run. That is itself a lesson in the spirit of Topic 6.

  # --- Kuis 3: berapa simpul yang diperiksa saat mencari ------------------------
  - tipe: kuis
    skenario:
      id: |
        Sebuah pohon pencarian biner berisi tujuh nilai, dibangun dengan memasukkan
        `[50, 30, 70, 20, 40, 60, 80]` berurutan. Fungsi `cari` menghitung berapa simpul
        yang diperiksa sebelum nilai yang dicari ditemukan. Berapa simpul yang diperiksa
        untuk mencari nilai `40`?
      en: |
        A binary search tree holds seven values, built by inserting
        `[50, 30, 70, 20, 40, 60, 80]` in order. The `cari` function counts how many
        nodes are checked before the sought value is found. How many nodes are checked
        when searching for the value `40`?
    kode: |
      class Simpul:
          def __init__(self, nilai):
              self.nilai = nilai
              self.kiri = None
              self.kanan = None


      def sisip(akar, nilai):
          if akar is None:
              return Simpul(nilai)
          if nilai < akar.nilai:
              akar.kiri = sisip(akar.kiri, nilai)
          elif nilai > akar.nilai:
              akar.kanan = sisip(akar.kanan, nilai)
          return akar


      def cari(akar, target):
          langkah = 0
          sekarang = akar
          while sekarang is not None:
              langkah += 1
              if target == sekarang.nilai:
                  return langkah
              if target < sekarang.nilai:
                  sekarang = sekarang.kiri
              else:
                  sekarang = sekarang.kanan
          return -1


      akar = None
      for nilai in [50, 30, 70, 20, 40, 60, 80]:
          akar = sisip(akar, nilai)

      print(cari(akar, 40))
    opsi:
      - teks:
          id: "3 — simpul 50, 30, dan 40 diperiksa"
          en: "3 — the nodes 50, 30, and 40 are checked"
        benar: true
      - teks:
          id: "1 — karena hanya nilai 40 sendiri yang benar-benar dibandingkan"
          en: "1 — because only the value 40 itself is actually compared"
        benar: false
      - teks:
          id: "7 — karena seluruh simpul diperiksa sebelum hasilnya diketahui"
          en: "7 — because every node is checked before the result is known"
        benar: false
      - teks:
          id: "2 — simpul 30 dan 40, karena 50 tidak mungkin menjadi jawabannya"
          en: "2 — the nodes 30 and 40, because 50 cannot be the answer"
        benar: false
    penjelasan:
      id: |
        **Pendekatan.** Lacak `cari` langkah demi langkah, mulai dari akar `50`:

        - Periksa `50`. `40` tidak sama dengan `50`, dan `40 < 50`, jadi turun ke kiri.
          Satu simpul diperiksa.
        - Periksa `30`. `40` tidak sama dengan `30`, dan `40 > 30`, jadi turun ke kanan.
          Dua simpul diperiksa.
        - Periksa `40`. Sama. Kembalikan `3`.

        Jadi jawabannya `3`. Yang diperiksa adalah `50`, `30`, dan `40`.

        Perhatikan bahwa subpohon kanan `50` — yang berisi `70`, `60`, dan `80` — tidak
        pernah disentuh sama sekali. Ketiganya dibuang dalam satu langkah, karena
        seluruh isi subpohon kanan pasti lebih besar daripada `50`, sedangkan yang dicari
        adalah `40`. Itulah cara BST membuang separuh sisanya setiap langkah.

        **Kompleksitas.** Pencarian pada BST seimbang adalah `O(log n)`, karena setiap
        langkah membuang separuh sisanya. Untuk tujuh simpul, itu sekitar tiga langkah —
        dan di sini memang tiga. Ingat bahwa ini hanya berlaku kalau pohonnya seimbang;
        kalau pohonnya miring, pencariannya menjadi `O(n)` dan bisa memeriksa ketujuh
        simpul. Biaya pencarian dihitung dari **tinggi pohon**, bukan dari banyaknya
        simpul.

        **Kode referensi.**

        ```python
        class Simpul:
            def __init__(self, nilai):
                self.nilai = nilai
                self.kiri = None
                self.kanan = None


        def sisip(akar, nilai):
            if akar is None:
                return Simpul(nilai)
            if nilai < akar.nilai:
                akar.kiri = sisip(akar.kiri, nilai)
            elif nilai > akar.nilai:
                akar.kanan = sisip(akar.kanan, nilai)
            return akar


        def cari(akar, target):
            langkah = 0
            sekarang = akar
            while sekarang is not None:
                langkah += 1
                if target == sekarang.nilai:
                    return langkah
                if target < sekarang.nilai:
                    sekarang = sekarang.kiri
                else:
                    sekarang = sekarang.kanan
            return -1


        akar = None
        for nilai in [50, 30, 70, 20, 40, 60, 80]:
            akar = sisip(akar, nilai)

        print(cari(akar, 40))
        ```

        **Jebakan umum.** Jawaban `1` menghitung hanya **perbandingan yang berhasil**,
        padahal setiap simpul yang dikunjungi diperiksa — termasuk yang ternyata bukan
        jawabannya. Jawaban `7` mengira BST menelusuri semuanya seperti pencarian
        linear; justru keunggulan BST adalah ia tidak perlu melakukannya. Jawaban `2`
        membuang akar dari hitungan, padahal akar diperiksa lebih dulu dan hasilnya
        memang "bukan di sini". Yang paling sering luput: **akar selalu diperiksa**,
        sehingga pencarian pada pohon berisi satu simpul pun memeriksa satu simpul.
      en: |
        **Approach.** Trace `cari` step by step, starting from the root `50`:

        - Check `50`. `40` is not equal to `50`, and `40 < 50`, so descend left. One
          node checked.
        - Check `30`. `40` is not equal to `30`, and `40 > 30`, so descend right. Two
          nodes checked.
        - Check `40`. Equal. Return `3`.

        So the answer is `3`. The nodes checked are `50`, `30`, and `40`.

        Note that the right subtree of `50` — holding `70`, `60`, and `80` — is never
        touched at all. All three are discarded in one step, because everything in the
        right subtree must be larger than `50`, while what is sought is `40`. That is how
        a BST discards half of what remains at each step.

        **Complexity.** Searching a balanced BST is `O(log n)`, because each step
        discards half of what remains. For seven nodes that is around three steps — and
        here it is indeed three. Remember this holds only when the tree is balanced; if
        the tree is skewed, the search becomes `O(n)` and may check all seven nodes. The
        cost of a search is counted from the **height of the tree**, not from how many
        nodes there are.

        **Reference code.**

        ```python
        class Simpul:
            def __init__(self, nilai):
                self.nilai = nilai
                self.kiri = None
                self.kanan = None


        def sisip(akar, nilai):
            if akar is None:
                return Simpul(nilai)
            if nilai < akar.nilai:
                akar.kiri = sisip(akar.kiri, nilai)
            elif nilai > akar.nilai:
                akar.kanan = sisip(akar.kanan, nilai)
            return akar


        def cari(akar, target):
            langkah = 0
            sekarang = akar
            while sekarang is not None:
                langkah += 1
                if target == sekarang.nilai:
                    return langkah
                if target < sekarang.nilai:
                    sekarang = sekarang.kiri
                else:
                    sekarang = sekarang.kanan
            return -1


        akar = None
        for nilai in [50, 30, 70, 20, 40, 60, 80]:
            akar = sisip(akar, nilai)

        print(cari(akar, 40))
        ```

        **Common trap.** The answer `1` counts only the **successful comparison**, when
        every visited node is checked — including those that turn out not to be the
        answer. The answer `7` assumes a BST walks everything like a linear search; a
        BST's advantage is precisely that it does not have to. The answer `2` drops the
        root from the count, when the root is checked first and the result is indeed "not
        here". The most commonly missed point: **the root is always checked**, so a
        search in a tree of one node still checks one node.

  # --- Kuis 4: menghapus simpul beranak dua -------------------------------------
  - tipe: kuis
    skenario:
      id: |
        Sebuah pohon pencarian biner dibangun dengan memasukkan `[50, 30, 70, 20, 40,
        60, 80]` berurutan. Lalu simpul bernilai `30` dihapus. Nilai `30` punya **dua**
        anak, yaitu `20` dan `40`. Bagaimana cara menghapusnya supaya aturan BST tetap
        berlaku?
      en: |
        A binary search tree is built by inserting `[50, 30, 70, 20, 40, 60, 80]` in
        order. Then the node holding `30` is removed. The value `30` has **two** children,
        namely `20` and `40`. How should it be removed so that the BST rule keeps holding?
    opsi:
      - teks:
          id: Nilai pengganti diambil dari penerus 30, yaitu simpul bernilai terkecil yang masih lebih besar — di sini 40. Nilai 40 dipindahkan ke posisi 30, lalu simpul 40 yang lama dibuang
          en: The replacement value comes from the successor of 30, the node holding the smallest value still larger — here 40. The value 40 is moved into the place of 30, then the old node 40 is removed
        benar: true
      - teks:
          id: Simpul 30 dibuang begitu saja, lalu kedua anaknya dibiarkan menggantung dan tidak lagi terhubung ke pohon
          en: The node 30 is simply dropped, and its two children are left hanging and no longer connected to the tree
        benar: false
      - teks:
          id: Anak kiri 30 dinaikkan menggantikannya, dan anak kanannya dipindahkan menjadi anak kiri dari simpul 20
          en: The left child of 30 is promoted to replace it, and its right child is moved to become the left child of the node 20
        benar: false
      - teks:
          id: Seluruh subpohon di bawah 30 dibangun ulang dari nol dengan memasukkan kembali semua nilainya dalam urutan acak
          en: The whole subtree below 30 is rebuilt from scratch by re-inserting all of its values in random order
        benar: false
    penjelasan:
      id: |
        **Pendekatan.** Menghapus simpul beranak dua tidak bisa dilakukan dengan
        menaikkan salah satu anaknya begitu saja. Alasannya: kalau anak kiri (`20`) naik,
        anak kanan (`40`) tidak punya tempat lagi; dan kalau anak kanan (`40`) naik,
        anak kiri (`20`) yang tersisa. Keduanya harus tetap berada di sisi yang benar
        relatif terhadap seluruh pohon.

        Penyelesaiannya memakai **penerus**: simpul bernilai terkecil yang masih lebih
        besar daripada nilai yang dihapus. Penerus `30` selalu berada di subpohon
        kanannya, dan selalu simpul paling kiri di sana. Di sini subpohon kanan `30`
        hanya berisi `40`, jadi penerusnya adalah `40`.

        Langkahnya:

        1. Cari penerus `30`, yaitu `40`.
        2. Salin nilai penerus ke simpul yang dihapus — simpul itu sekarang bernilai
           `40`.
        3. Buang simpul penerus yang lama dari subpohon kanannya.

        Sesudahnya, telusur inorder menghasilkan `[20, 40, 50, 60, 70, 80]` — tetap
        menaik. Itu tandanya aturan BST masih berlaku.

        **Kompleksitas.** Mencari penerus berarti menelusuri dari subpohon kanan ke
        simpul paling kiri di sana, yang biayanya sepanjang **tinggi** pohon — jadi
        `O(log n)` pada pohon seimbang, dan `O(n)` pada pohon miring. Sama seperti
        pencarian dan penyisipan: yang menentukan bentuk pohonnya, bukan kodenya.
        Penghapusan simpul berdaun dan beranak satu justru lebih murah, karena tidak
        perlu mencari penerus sama sekali.

        **Kode referensi.**

        ```python
        class Simpul:
            def __init__(self, nilai):
                self.nilai = nilai
                self.kiri = None
                self.kanan = None


        def sisip(akar, nilai):
            if akar is None:
                return Simpul(nilai)
            if nilai < akar.nilai:
                akar.kiri = sisip(akar.kiri, nilai)
            elif nilai > akar.nilai:
                akar.kanan = sisip(akar.kanan, nilai)
            return akar


        def inorder(simpul, hasil):
            if simpul is None:
                return
            inorder(simpul.kiri, hasil)
            hasil.append(simpul.nilai)
            inorder(simpul.kanan, hasil)


        def hapus(akar, nilai):
            if akar is None:
                return None
            if nilai < akar.nilai:
                akar.kiri = hapus(akar.kiri, nilai)
            elif nilai > akar.nilai:
                akar.kanan = hapus(akar.kanan, nilai)
            else:
                if akar.kiri is None and akar.kanan is None:
                    return None
                if akar.kiri is None:
                    return akar.kanan
                if akar.kanan is None:
                    return akar.kiri
                pengganti = akar.kanan
                while pengganti.kiri is not None:
                    pengganti = pengganti.kiri
                akar.nilai = pengganti.nilai
                akar.kanan = hapus(akar.kanan, pengganti.nilai)
            return akar


        akar = None
        for nilai in [50, 30, 70, 20, 40, 60, 80]:
            akar = sisip(akar, nilai)

        akar = hapus(akar, 30)

        hasil = []
        inorder(akar, hasil)
        print(hasil)
        ```

        **Jebakan umum.** Jawaban "dibuang begitu saja" akan memutus dua subpohon
        sekaligus dari pohonnya; simpul-simpulnya masih ada di memori tetapi tidak bisa
        dijangkau lagi — persis jebakan "kehilangan kepala" dari Topik 3. Jawaban
        "anak kiri dinaikkan" merusak aturan BST: kalau `20` naik menggantikan `30`, maka
        `40` harus ditaruh di bawah `20`, dan `40` ada di sebelah **kiri** `20` padahal
        `40` lebih besar — aturannya langsung dilanggar. Jawaban "membangun ulang dari
        nol" memang menghasilkan pohon yang sah, tetapi biayanya jauh lebih besar
        daripada `O(log n)`, dan urutan pemasukannya mengubah bentuk pohonnya. Cara yang
        benar tetap satu: **pakai penerus**.
      en: |
        **Approach.** Removing a node with two children cannot be done by simply
        promoting one of its children. The reason: if the left child (`20`) moves up, the
        right child (`40`) has nowhere left to go; and if the right child (`40`) moves up,
        the left child (`20`) is the one left over. Both must stay on the correct side
        relative to the whole tree.

        The fix uses the **successor**: the node holding the smallest value still larger
        than the value being removed. The successor of `30` always lives in its right
        subtree, and is always the leftmost node there. Here the right subtree of `30`
        holds only `40`, so the successor is `40`.

        The steps:

        1. Find the successor of `30`, which is `40`.
        2. Copy the successor's value into the node being removed — that node now holds
           `40`.
        3. Remove the old successor node from its right subtree.

        Afterwards, an in-order traversal yields `[20, 40, 50, 60, 70, 80]` — still
        ascending. That is the sign the BST rule still holds.

        **Complexity.** Finding the successor means walking from the right subtree down
        to the leftmost node there, which costs as much as the **height** of the tree —
        so `O(log n)` on a balanced tree, and `O(n)` on a skewed one. Just like searching
        and inserting: the shape of the tree decides, not the code. Removing a leaf or a
        node with one child is actually cheaper, because no successor has to be found at
        all.

        **Reference code.**

        ```python
        class Simpul:
            def __init__(self, nilai):
                self.nilai = nilai
                self.kiri = None
                self.kanan = None


        def sisip(akar, nilai):
            if akar is None:
                return Simpul(nilai)
            if nilai < akar.nilai:
                akar.kiri = sisip(akar.kiri, nilai)
            elif nilai > akar.nilai:
                akar.kanan = sisip(akar.kanan, nilai)
            return akar


        def inorder(simpul, hasil):
            if simpul is None:
                return
            inorder(simpul.kiri, hasil)
            hasil.append(simpul.nilai)
            inorder(simpul.kanan, hasil)


        def hapus(akar, nilai):
            if akar is None:
                return None
            if nilai < akar.nilai:
                akar.kiri = hapus(akar.kiri, nilai)
            elif nilai > akar.nilai:
                akar.kanan = hapus(akar.kanan, nilai)
            else:
                if akar.kiri is None and akar.kanan is None:
                    return None
                if akar.kiri is None:
                    return akar.kanan
                if akar.kanan is None:
                    return akar.kiri
                pengganti = akar.kanan
                while pengganti.kiri is not None:
                    pengganti = pengganti.kiri
                akar.nilai = pengganti.nilai
                akar.kanan = hapus(akar.kanan, pengganti.nilai)
            return akar


        akar = None
        for nilai in [50, 30, 70, 20, 40, 60, 80]:
            akar = sisip(akar, nilai)

        akar = hapus(akar, 30)

        hasil = []
        inorder(akar, hasil)
        print(hasil)
        ```

        **Common trap.** The answer "simply dropped" cuts two subtrees off the tree at
        once; the nodes still exist in memory but can no longer be reached — exactly the
        "losing the head" trap from Topic 3. The answer "promote the left child" breaks
        the BST rule: `40` would end up to the left of `50`, which happens to be correct
        since `40` is smaller than `50` — but `20`, moved below `40`, also ends up in the
        wrong place, since `20` should stay on the left. The answer "rebuild from
        scratch" does produce a valid tree, but at a far higher cost than `O(log n)`, and
        the insertion order changes the shape of the tree. The correct way is still just
        one: **use the successor**.

  # --- Kuis 5: pohon yang terlihat benar tetapi bukan BST -----------------------
  - tipe: kuis
    skenario:
      id: |
        Seorang teman menunjukkan pohon biner yang ia bangun, dan berkata bahwa itu
        adalah pohon pencarian biner. Pada setiap simpul, anak kirinya memang lebih
        kecil dan anak kanannya memang lebih besar. Tetapi pohonnya tetap **bukan**
        BST. Struktur manakah yang membuktikannya?

        ```
                  50
                /    \
              30      70
                \
                 60
        ```
      en: |
        A friend shows you a binary tree he built, and says it is a binary search tree.
        At every node, the left child is indeed smaller and the right child is indeed
        larger. Yet the tree is still **not** a BST. Which structure proves it?

        ```
                  50
                /    \
              30      70
                \
                 60
        ```
    opsi:
      - teks:
          id: Simpul 60 berada di subpohon kiri 50, padahal aturan BST menuntut SELURUH isi subpohon kiri 50 lebih kecil daripada 50 — dan 60 lebih besar
          en: The node 60 sits in the left subtree of 50, when the BST rule demands that the WHOLE left subtree of 50 be smaller than 50 — and 60 is larger
        benar: true
      - teks:
          id: Simpul 60 lebih besar daripada 30, sehingga 60 seharusnya menjadi anak kanan 70, bukan berada di bawah 30
          en: The node 60 is larger than 30, so 60 should be the right child of 70, not sit below 30
        benar: false
      - teks:
          id: Simpul 30 hanya punya satu anak, padahal simpul di tengah pohon wajib punya dua anak
          en: The node 30 has only one child, when a node in the middle of a tree is required to have two
        benar: false
      - teks:
          id: Pohonnya tidak punya daun di sisi kiri, padahal setiap pohon pencarian biner wajib punya daun di kedua sisinya
          en: The tree has no leaf on its left side, when every binary search tree is required to have leaves on both sides
        benar: false
    penjelasan:
      id: |
        **Pendekatan.** Periksa aturan BST dengan cermat: untuk **setiap** simpul,
        **seluruh** isi subpohon kirinya harus lebih kecil, dan **seluruh** isi subpohon
        kanannya harus lebih besar. Kata "seluruh" itulah yang menentukan di sini.

        Lihat simpul `50`. Subpohon kirinya berisi `30` dan `60`. Nilai `60` lebih besar
        daripada `50` — padahal ia berada di subpohon **kiri**. Aturannya dilanggar,
        walaupun setiap anak langsung terlihat benar:

        - `30` memang lebih kecil daripada `50` — benar.
        - `70` memang lebih besar daripada `50` — benar.
        - `60` memang lebih besar daripada `30`, jadi sebagai anak kanan `30` ia benar.

        Setiap pemeriksaan satu tingkat lolos, tetapi pemeriksaan **seluruh subpohon**
        gagal. Inilah bentuk pohon yang paling sering lolos dari pemeriksaan sekilas.

        Cara paling mudah membuktikannya adalah dengan **telusur inorder**. Kalau
        pohonnya BST, hasilnya harus menaik. Pohon di atas menghasilkan `[30, 60, 50,
        70]` — tidak menaik, karena `60` muncul sebelum `50`. Itu bukti yang tidak bisa
        dibantah.

        **Kompleksitas.** Memeriksa satu tingkat saja memakan waktu `O(1)` per simpul,
        tetapi tidak cukup — seperti kasus ini. Pemeriksaan yang benar harus melacak
        rentang nilai yang sah untuk setiap simpul sambil menuruni pohon, dan itu
        `O(n)`, karena setiap simpul diperiksa sekali. Alternatifnya telusur inorder
        `O(n)` lalu periksa hasilnya menaik, yang sama-sama `O(n)` tetapi jauh lebih
        sederhana untuk ditulis.

        **Kode referensi.**

        ```python
        class Simpul:
            def __init__(self, nilai):
                self.nilai = nilai
                self.kiri = None
                self.kanan = None


        def inorder(simpul, hasil):
            if simpul is None:
                return
            inorder(simpul.kiri, hasil)
            hasil.append(simpul.nilai)
            inorder(simpul.kanan, hasil)


        def adalah_bst(akar):
            hasil = []
            inorder(akar, hasil)
            for i in range(1, len(hasil)):
                if hasil[i] <= hasil[i - 1]:
                    return False
            return True


        akar = Simpul(50)
        akar.kiri = Simpul(30)
        akar.kanan = Simpul(70)
        akar.kiri.kanan = Simpul(60)

        hasil = []
        inorder(akar, hasil)
        print("inorder   :", hasil)
        print("adalah BST:", adalah_bst(akar))
        ```

        **Jebakan umum.** Jawaban "60 seharusnya menjadi anak kanan 70" menebak
        perbaikannya, tetapi tidak menyebut **aturan mana** yang dilanggar — dan
        perbaikan itu sendiri belum tentu benar, karena banyak pohon BST yang sah tanpa
        `60` di bawah `70`. Jawaban "simpul di tengah wajib punya dua anak" salah besar:
        BST tidak menuntut itu, dan pohon miring dari Kuis 2 pun sah sebagai BST. Jawaban
        "wajib punya daun di kedua sisi" juga salah — BST tidak menuntut keseimbangan
        apa pun. Yang benar-benar dilanggar hanyalah satu: **seluruh** subpohon kiri
        `50` harus lebih kecil daripada `50`, dan `60` tidak.
      en: |
        **Approach.** Check the BST rule carefully: for **every** node, the **whole**
        left subtree must be smaller, and the **whole** right subtree must be larger. The
        word "whole" is what decides here.

        Look at node `50`. Its left subtree holds `30` and `60`. The value `60` is larger
        than `50` — yet it sits in the **left** subtree. The rule is broken, even though
        every direct child looks right:

        - `30` is indeed smaller than `50` — correct.
        - `70` is indeed larger than `50` — correct.
        - `60` is indeed larger than `30`, so as the right child of `30` it is correct.

        Every one-level check passes, but the **whole-subtree** check fails. This is the
        shape that most often slips past a quick glance.

        The easiest way to prove it is with an **in-order traversal**. If the tree is a
        BST, the result must be ascending. The tree above yields `[30, 60, 50, 70]` — not
        ascending, because `60` appears before `50`. That is an unanswerable proof.

        **Complexity.** Checking only one level takes `O(1)` per node, but that is not
        enough — as this case shows. A correct check must track the valid value range for
        each node as it descends the tree, and that is `O(n)`, because every node is
        checked once. The alternative is an `O(n)` in-order traversal followed by
        checking the result is ascending, which is also `O(n)` but far simpler to write.

        **Reference code.**

        ```python
        class Simpul:
            def __init__(self, nilai):
                self.nilai = nilai
                self.kiri = None
                self.kanan = None


        def inorder(simpul, hasil):
            if simpul is None:
                return
            inorder(simpul.kiri, hasil)
            hasil.append(simpul.nilai)
            inorder(simpul.kanan, hasil)


        def adalah_bst(akar):
            hasil = []
            inorder(akar, hasil)
            for i in range(1, len(hasil)):
                if hasil[i] <= hasil[i - 1]:
                    return False
            return True


        akar = Simpul(50)
        akar.kiri = Simpul(30)
        akar.kanan = Simpul(70)
        akar.kiri.kanan = Simpul(60)

        hasil = []
        inorder(akar, hasil)
        print("inorder   :", hasil)
        print("adalah BST:", adalah_bst(akar))
        ```

        **Common trap.** The answer "60 should be the right child of 70" guesses at the
        fix but never names **which rule** is broken — and that fix is not necessarily
        right either, since many valid BSTs have no `60` under `70`. The answer "a
        middle node is required to have two children" is badly wrong: a BST demands no
        such thing, and the skewed tree from Kuis 2 is a valid BST too. The answer
        "required to have leaves on both sides" is wrong as well — a BST demands no
        balance at all. The only thing actually broken is this: the **whole** left
        subtree of `50` must be smaller than `50`, and `60` is not.

  # --- Soal Kode: BST dari nol --------------------------------------------------
  - tipe: soal-kode
    skenario:
      id: |
        Tulis dari nol sebuah pohon pencarian biner — kelas yang menyimpan nilai dalam
        simpul-simpul bercabang dan menyediakan operasi dasarnya sendiri. Kamu menerima
        daftar perintah, dan harus mengembalikan daftar hasil untuk setiap perintah yang
        menghasilkan nilai.

        Setiap perintah adalah daftar. Perintah `["sisip", x]` menaruh `x` di tempat yang
        benar menurut aturan BST, dan **tidak** menghasilkan nilai. Kalau `x` sudah ada di
        pohon, perintah ini tidak melakukan apa-apa — BST tidak menyimpan kembar.
        Perintah `["cari", x]` mengembalikan `True` kalau `x` ada, `False` kalau tidak.
        Perintah `["hapus", x]` membuang simpul bernilai `x` dan mengembalikan `True`
        kalau ada yang dibuang, `False` kalau tidak ada. Perintah `["inorder"]`
        mengembalikan seluruh isi pohon sebagai daftar biasa, **menaik**. Perintah
        `["tinggi"]` mengembalikan tinggi pohon — banyaknya simpul pada jalur terpanjang
        dari akar sampai daun, dan `0` untuk pohon kosong. Perintah `["ukuran"]`
        mengembalikan banyaknya simpul.

        Untuk perintah yang tidak menghasilkan nilai, catat `None`.

        Jangan memakai `list` sebagai pengganti pohonnya untuk menyimpan data —
        implementasikan sendiri `sisip`, `cari`, `hapus`, `inorder`, `tinggi`, dan
        `ukuran`, supaya kamu merasakan mekanisme penunjuknya. Kamu boleh memakai `list`
        biasa hanya untuk mengumpulkan hasil perintah.

        Perhatikan dua hal yang paling mudah salah. Pertama, `hapus` pada simpul yang
        punya **dua** anak tidak bisa dilakukan dengan menaikkan salah satu anaknya —
        pakai penerusnya. Kedua, pohon kosong (`akar` bernilai `None`) adalah keadaan yang
        sah, dan `cari`, `inorder`, `tinggi`, serta `ukuran` harus tetap benar di sana.
      en: |
        Write from scratch a binary search tree — a class that stores values in branching
        nodes and provides its own basic operations. You receive a list of commands, and
        must return a list of results for each command that produces a value.

        Each command is a list. The command `["sisip", x]` puts `x` in the correct place
        under the BST rule, and produces **no** value. If `x` is already in the tree, the
        command does nothing — a BST does not store duplicates. The command `["cari", x]`
        returns `True` if `x` is present, `False` if not. The command `["hapus", x]`
        removes the node holding `x` and returns `True` if something was removed, `False`
        if not. The command `["inorder"]` returns the whole contents of the tree as a
        plain list, **ascending**. The command `["tinggi"]` returns the height of the
        tree — the number of nodes on the longest path from the root down to a leaf, and
        `0` for an empty tree. The command `["ukuran"]` returns how many nodes there are.

        For commands that produce no value, record `None`.

        Do not use `list` in place of the tree to store the data — implement `sisip`,
        `cari`, `hapus`, `inorder`, `tinggi`, and `ukuran` yourself, so that you feel the
        pointer mechanism. You may use a plain `list` only to collect the command results.

        Note two things that are easiest to get wrong. First, `hapus` on a node with
        **two** children cannot be done by promoting one of its children — use its
        successor. Second, an empty tree (`akar` is `None`) is a valid state, and `cari`,
        `inorder`, `tinggi`, and `ukuran` must all still be correct there.
    fungsi: proses
    test_case:

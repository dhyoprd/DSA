# Istilah yang layak dihafal. `istilah` adalah pasangan Indonesia–English; `definisi`
# menjelaskannya di kedua bahasa. Setiap pasangan di bawah ini berbeda antara kedua
# bahasa, jadi setiap istilah menghasilkan dua kartu: definisinya, dan pasangannya.
#
# **Setiap istilah di sini muncul di Materi kedua bahasa.** Itu kelas cacat yang
# ditemukan di #19 (kartu "rata-rata" hilang karena koma tak berkutip) dan #22 (tiga
# kartu mengajarkan istilah yang tidak pernah diperkenalkan Materi). Pemeriksa mandiri
# membandingkannya.
istilah:
  - istilah: { id: Pohon, en: Tree }
    definisi:
      id: Struktur data berisi simpul-simpul yang bercabang, dengan satu simpul di puncak dan setiap simpul menunjuk ke simpul-simpul di bawahnya. Tidak seperti linked list yang hanya punya satu arah, sebuah simpul pohon bisa punya beberapa anak.
      en: A data structure of branching nodes, with one node at the top and each node pointing to the nodes below it. Unlike a linked list, which has only one direction, a tree node can have several children.
  - istilah: { id: Akar, en: Root }
    definisi:
      id: Simpul paling atas sebuah pohon, dan satu-satunya pintu masuknya. Dari akar inilah setiap pencarian dimulai.
      en: The topmost node of a tree, and its only entrance. Every search starts from the root.
  - istilah: { id: Daun, en: Leaf }
    definisi:
      id: Simpul yang tidak punya anak sama sekali. Kedua penunjuknya bernilai `None`.
      en: A node with no children at all. Both of its pointers are `None`.
  - istilah: { id: Subpohon, en: Subtree }
    definisi:
      id: Sebuah simpul beserta seluruh keturunannya, dipandang sebagai pohon tersendiri. Anak kiri dan anak kanan sebuah simpul masing-masing mengepalai satu subpohon.
      en: A node together with all of its descendants, viewed as a tree in its own right. A node's left and right child each head one subtree.
  - istilah: { id: Tinggi pohon, en: Tree height }
    definisi:
      id: Banyaknya simpul pada jalur terpanjang dari akar sampai daun. Pohon kosong tingginya nol, dan pohon berisi satu simpul tingginya satu.
      en: The number of nodes on the longest path from the root down to a leaf. An empty tree has height zero, and a tree with a single node has height one.
  - istilah: { id: Pohon biner, en: Binary tree }
    definisi:
      id: Pohon yang setiap simpulnya punya paling banyak dua anak — satu kiri dan satu kanan. Tidak ada aturan tentang nilai mana yang boleh di mana.
      en: A tree in which every node has at most two children — one left and one right. There is no rule about which value goes where.
  - istilah: { id: Pohon pencarian biner, en: Binary search tree }
    definisi:
      id: Pohon biner dengan satu aturan tambahan — semua nilai di subpohon kiri lebih kecil daripada simpulnya, dan semua nilai di subpohon kanan lebih besar. Aturan itulah yang membuat pencarian bisa membuang separuh pohon setiap langkah.
      en: A binary tree with one extra rule — every value in the left subtree is smaller than its node, and every value in the right subtree is larger. That rule is what lets a search discard half the tree at each step.
  - istilah: { id: Telusur inorder, en: In-order traversal }
    definisi:
      id: Cara mengunjungi seluruh simpul dengan urutan kiri, lalu simpulnya, lalu kanan. Pada pohon pencarian biner hasilnya selalu menaik — dan itulah cara termudah memeriksa apakah aturan BST benar-benar berlaku.
      en: A way of visiting every node in the order left, then the node itself, then right. On a binary search tree the result is always ascending — and that is the easiest way to check whether the BST rule really holds.
  - istilah: { id: Penerus, en: Successor }
    definisi:
      id: Simpul dengan nilai terkecil yang masih lebih besar daripada sebuah nilai. Saat menghapus simpul beranak dua, penerusnyalah yang naik menggantikannya, supaya aturan BST tetap berlaku.
      en: The node holding the smallest value that is still larger than a given value. When removing a node with two children, its successor takes its place, so that the BST rule keeps holding.

materi:
  id: |
    ## Dari satu arah menjadi bercabang

    Di Topik 3 kamu melihat linked list: deretan simpul yang masing-masing menunjuk ke
    **satu** simpul berikutnya. Sekarang bayangkan sebuah simpul boleh menunjuk ke
    **dua** simpul sekaligus. Bentuk yang lahir dari gagasan itu disebut **pohon**
    (*tree*).

    Namanya sengaja diambil dari pohon yang tumbuh terbalik: puncaknya di atas, dan
    cabangnya melebar ke bawah.

    ```
                50              <- akar
              /    \
            30      70          <- anak kiri dan anak kanan
           /  \    /  \
         20   40  60   80       <- daun
    ```

    Istilah dasarnya, dari atas ke bawah:

    - **Akar** (*root*) — simpul paling atas, dan satu-satunya pintu masuk.
    - **Anak** (*child*) — simpul di bawah sebuah simpul.
    - **Daun** (*leaf*) — simpul yang tidak punya anak sama sekali.
    - **Subpohon** (*subtree*) — sebuah simpul beserta seluruh keturunannya.

    Sebuah simpul pohon biner bentuknya hampir sama dengan simpul linked list. Bedanya
    satu: ia menyimpan **dua** penunjuk, bukan satu.

    ```python
    class Simpul:
        def __init__(self, nilai):
            self.nilai = nilai
            self.kiri = None
            self.kanan = None


    akar = Simpul(50)
    akar.kiri = Simpul(30)
    akar.kanan = Simpul(70)

    print("akar       :", akar.nilai)
    print("anak kiri  :", akar.kiri.nilai)
    print("anak kanan :", akar.kanan.nilai)
    print("daun       :", akar.kiri.nilai, "dan", akar.kanan.nilai)
    ```

    Perhatikan bahwa **tidak ada yang baru** secara mekanisme. Ini persis simpul linked
    list, hanya dengan satu penunjuk tambahan. Yang berubah adalah bentuk keseluruhan
    yang bisa dibangun dari padanya — dan itulah yang membuat pohon berguna.

    ## Aturan yang membuat pencarian cepat

    Pohon biner biasa belum tentu cepat dicari. Kalau nilainya ditaruh sembarangan,
    mencari satu nilai bisa berarti memeriksa seluruh simpul.

    Yang membuatnya cepat adalah satu aturan tambahan. Sebuah pohon biner yang
    mematuhinya disebut **pohon pencarian biner** (*binary search tree*, disingkat BST):

    > Untuk setiap simpul, **semua** nilai di subpohon kirinya lebih kecil, dan
    > **semua** nilai di subpohon kanannya lebih besar.

    Perhatikan kata "semua". Bukan hanya anak kiri yang lebih kecil, melainkan seluruh
    isi subpohon kiri. Aturan ini berlaku untuk setiap simpul, bukan hanya akar.

    Dengan aturan itu, mencari sebuah nilai menjadi mirip pencarian biner dari Topik 8:
    bandingkan dengan simpul yang sedang dipegang, lalu buang separuh pohon yang tidak
    mungkin memuatnya.

    ```python
    class Simpul:
        def __init__(self, nilai):
            self.nilai = nilai
            self.kiri = None
            self.kanan = None


    def sisip(akar, nilai):
        if akar is None:
            return Simpul(nilai)
        if nilai < akar.nilai:
            akar.kiri = sisip(akar.kiri, nilai)
        elif nilai > akar.nilai:
            akar.kanan = sisip(akar.kanan, nilai)
        return akar


    akar = None
    for nilai in [50, 30, 70, 20, 40, 60, 80]:
        akar = sisip(akar, nilai)

    print("akar           :", akar.nilai)
    print("subpohon kiri  :", akar.kiri.nilai)
    print("subpohon kanan :", akar.kanan.nilai)
    ```

    Fungsi `sisip` di atas rekursif, dan polanya penting untuk dikenali. Kalau nilai
    yang dimasukkan lebih kecil, ia turun ke subpohon kiri; kalau lebih besar, ke
    subpohon kanan. Kalau sudah tidak ada simpul di sana, di situlah simpul baru
    ditempatkan. Nilai yang **sama** sengaja diabaikan — BST biasanya tidak menyimpan
    kembar.

    ## Mencari: membuang separuh setiap langkah

    Mencari sebuah nilai memakai aturan yang sama, tetapi tanpa membuat simpul baru.
    Di setiap langkah hanya ada tiga kemungkinan: ketemu, cari ke kiri, atau cari ke
    kanan.

    ```python
    class Simpul:
        def __init__(self, nilai):
            self.nilai = nilai
            self.kiri = None
            self.kanan = None


    def sisip(akar, nilai):
        if akar is None:
            return Simpul(nilai)
        if nilai < akar.nilai:
            akar.kiri = sisip(akar.kiri, nilai)
        elif nilai > akar.nilai:
            akar.kanan = sisip(akar.kanan, nilai)
        return akar


    def cari(akar, target):
        langkah = 0
        sekarang = akar
        while sekarang is not None:
            langkah += 1
            if target == sekarang.nilai:
                return langkah
            if target < sekarang.nilai:
                sekarang = sekarang.kiri
            else:
                sekarang = sekarang.kanan
        return -1


    akar = None
    for nilai in [50, 30, 70, 20, 40, 60, 80]:
        akar = sisip(akar, nilai)

    print("cari 40 ->", cari(akar, 40), "simpul diperiksa")
    print("cari 45 ->", cari(akar, 45), "(tidak ada)")
    ```

    Mencari `40` hanya memeriksa **3 simpul**: `50` (ke kiri), `30` (ke kanan), `40`
    (ketemu). Ketujuh simpulnya tidak pernah disentuh — subpohon kanan akar langsung
    dibuang, karena seluruh isinya pasti lebih besar daripada `50`.

    ## Menghapus: kasus yang paling merepotkan

    Menambah dan mencari tidak pernah merusak aturan BST. Menghapus bisa, dan itulah
    sebabnya ia kasus yang paling perlu dipikirkan. Ada tiga keadaan, dan masing-masing
    butuh penanganan sendiri.

    **Simpul berdaun** — tidak punya anak. Cukup dibuang: penunjuk orang tuanya menjadi
    `None`. Tidak ada yang perlu dipindahkan.

    **Simpul beranak satu** — punya anak kiri saja atau kanan saja. Anaknya langsung
    naik menggantikannya. Aturan BST tetap berlaku, karena seluruh isi subpohon anak itu
    memang sudah berada di sisi yang benar.

    **Simpul beranak dua** — inilah yang merepotkan. Kalau simpulnya sekadar dibuang,
    ada dua subpohon yang kehilangan tempat bergantung. Penyelesaiannya: cari **penerus**
    (*successor*) — simpul bernilai terkecil yang masih lebih besar — lalu nilai
    penerus itu dipindahkan ke simpul yang dihapus. Penerus sebuah simpul selalu berada
    di subpohon kanannya, dan selalu simpul paling kiri di sana.

    ```python
    class Simpul:
        def __init__(self, nilai):
            self.nilai = nilai
            self.kiri = None
            self.kanan = None


    def sisip(akar, nilai):
        if akar is None:
            return Simpul(nilai)
        if nilai < akar.nilai:
            akar.kiri = sisip(akar.kiri, nilai)
        elif nilai > akar.nilai:
            akar.kanan = sisip(akar.kanan, nilai)
        return akar


    def inorder(simpul, hasil):
        if simpul is None:
            return
        inorder(simpul.kiri, hasil)
        hasil.append(simpul.nilai)
        inorder(simpul.kanan, hasil)


    def hapus(akar, nilai):
        if akar is None:
            return None
        if nilai < akar.nilai:
            akar.kiri = hapus(akar.kiri, nilai)
        elif nilai > akar.nilai:
            akar.kanan = hapus(akar.kanan, nilai)
        else:
            if akar.kiri is None and akar.kanan is None:
                return None
            if akar.kiri is None:
                return akar.kanan
            if akar.kanan is None:
                return akar.kiri
            pengganti = akar.kanan
            while pengganti.kiri is not None:
                pengganti = pengganti.kiri
            akar.nilai = pengganti.nilai
            akar.kanan = hapus(akar.kanan, pengganti.nilai)
        return akar


    akar = None
    for nilai in [50, 30, 70, 20, 40, 60, 80]:
        akar = sisip(akar, nilai)

    sebelum = []
    inorder(akar, sebelum)
    print("sebelum hapus 30 :", sebelum)

    akar = hapus(akar, 30)

    sesudah = []
    inorder(akar, sesudah)
    print("sesudah hapus 30 :", sesudah)
    print("penggantinya adalah penerus 30, yaitu", akar.kiri.nilai)
    ```

    Perhatikan urutan hasilnya tetap menaik sesudah penghapusan. Itu bukan kebetulan —
    itu tandanya aturan BST masih berlaku.

    ## Tiga cara menelusuri pohon

    Menelusuri pohon berarti mengunjungi setiap simpul tepat sekali. Berbeda dari linked
    list yang hanya punya satu arah, pohon punya tiga urutan yang lazim, dan namanya
    menunjukkan kapan simpulnya sendiri dikunjungi.

    - **Inorder** — kiri, lalu simpulnya, lalu kanan.
    - **Preorder** — simpulnya dulu, baru kiri, baru kanan.
    - **Postorder** — kiri, kanan, baru simpulnya.

    ```python
    class Simpul:
        def __init__(self, nilai):
            self.nilai = nilai
            self.kiri = None
            self.kanan = None


    def sisip(akar, nilai):
        if akar is None:
            return Simpul(nilai)
        if nilai < akar.nilai:
            akar.kiri = sisip(akar.kiri, nilai)
        elif nilai > akar.nilai:
            akar.kanan = sisip(akar.kanan, nilai)
        return akar


    def inorder(simpul, hasil):
        if simpul is None:
            return
        inorder(simpul.kiri, hasil)
        hasil.append(simpul.nilai)
        inorder(simpul.kanan, hasil)


    def preorder(simpul, hasil):
        if simpul is None:
            return
        hasil.append(simpul.nilai)
        preorder(simpul.kiri, hasil)
        preorder(simpul.kanan, hasil)


    def postorder(simpul, hasil):
        if simpul is None:
            return
        postorder(simpul.kiri, hasil)
        postorder(simpul.kanan, hasil)
        hasil.append(simpul.nilai)


    akar = None
    for nilai in [50, 30, 70, 20, 40, 60, 80]:
        akar = sisip(akar, nilai)

    a, b, c = [], [], []
    inorder(akar, a)
    preorder(akar, b)
    postorder(akar, c)
    print("inorder   :", a)
    print("preorder  :", b)
    print("postorder :", c)
    ```

    Perhatikan hasil **telusur inorder**-nya: `[20, 30, 40, 50, 60, 70, 80]` — menaik.
    Itu bukan kebetulan, melainkan akibat langsung aturan BST. Karena itu inorder adalah
    cara termudah memeriksa apakah sebuah pohon benar-benar BST: kalau hasilnya tidak
    menaik, aturannya dilanggar di suatu tempat.

    ## Bentuk pohon menentukan biayanya

    Inilah pelajaran terpenting Topik ini. Operasi BST yang sama bisa sangat cepat atau
    sangat lambat, **bergantung pada bentuk pohonnya** — bukan pada kodenya.

    Kalau nilainya kebetulan masuk dalam urutan yang menyebar, pohonnya tumbuh
    seimbang: setiap simpul punya anak kiri dan kanan, dan tingginya kira-kira
    `log₂(n)`. Mencari di pohon seperti itu memeriksa sedikit simpul.

    Tetapi perhatikan apa yang terjadi kalau nilainya masuk **berurutan menaik**:

    ```python
    class Simpul:
        def __init__(self, nilai):
            self.nilai = nilai
            self.kiri = None
            self.kanan = None


    def sisip(akar, nilai):
        if akar is None:
            return Simpul(nilai)
        if nilai < akar.nilai:
            akar.kiri = sisip(akar.kiri, nilai)
        elif nilai > akar.nilai:
            akar.kanan = sisip(akar.kanan, nilai)
        return akar


    def tinggi(simpul):
        if simpul is None:
            return 0
        kiri = tinggi(simpul.kiri)
        kanan = tinggi(simpul.kanan)
        return 1 + (kiri if kiri > kanan else kanan)


    seimbang = None
    for nilai in [50, 30, 70, 20, 40, 60, 80]:
        seimbang = sisip(seimbang, nilai)

    miring = None
    for nilai in [10, 20, 30, 40, 50, 60, 70]:
        miring = sisip(miring, nilai)

    print("7 simpul tersusun seimbang -> tinggi", tinggi(seimbang))
    print("7 simpul tersusun menaik   -> tinggi", tinggi(miring))
    ```

    Tujuh simpul yang sama banyaknya menghasilkan **tinggi 3** kalau tersusun seimbang,
    dan **tinggi 7** kalau tersusun menaik. Bentuk yang kedua disebut **pohon miring**
    (*skewed tree*), dan pada bentuk itu BST tidak lebih baik daripada linked list:
    mencari nilai terbesar berarti menelusuri ketujuh simpul satu per satu.

    Inilah sebabnya "BST itu `O(log n)`" adalah pernyataan yang belum lengkap. Yang
    benar: BST itu `O(log n)` **kalau pohonnya seimbang**, dan `O(n)` kalau pohonnya
    miring. Pohon yang selalu menjaga keseimbangannya sendiri punya nama tersendiri
    (pohon AVL, pohon merah-hitam), dan itu di luar cakupan Topik ini — tetapi tahu
    bahwa masalahnya ada, dan bahwa solusinya berupa varian BST, sudah cukup di sini.

    ## Tabel kompleksitas

    | Operasi | Pohon pencarian biner seimbang | Pohon pencarian biner miring |
    |---|---|---|
    | Cari satu nilai | O(log n) | O(n) |
    | Sisip satu nilai | O(log n) | O(n) |
    | Hapus satu nilai | O(log n) | O(n) |
    | Telusuri seluruh simpul | O(n) | O(n) |
    | Ruang | O(n) | O(n) |

    Baris terakhir sama di kedua kolom, dan itu wajar: berapa pun bentuk pohonnya,
    setiap simpul disimpan sekali. Yang berubah hanyalah **berapa simpul yang harus
    diperiksa** untuk menemukan satu nilai. Penelusuran seluruh simpul juga sama-sama
    `O(n)` di kedua bentuk, karena ia memang mengunjungi semuanya.

    ## Jebakan yang sering terjadi

    **Mengira BST selalu `O(log n)`.** Sudah dibahas di atas, dan ini jebakan yang
    paling sering. Data yang masuk berurutan adalah kasus yang paling mudah terpicu —
    dan data dari dunia nyata sering datang berurutan.

    **Memeriksa hanya anak langsung, bukan seluruh subpohon.** Pohon berikut **bukan**
    BST, walaupun setiap anak langsung terlihat benar:

    ```
              50
            /    \
          30      70
            \
             60        <- 60 lebih besar dari 30, tapi ada di subpohon KIRI 50
    ```

    `60` lebih besar daripada `30` (anak kirinya sendiri benar), tetapi `60` ada di
    subpohon kiri `50` — padahal seharusnya seluruh subpohon kiri lebih kecil daripada
    `50`. Aturannya berlaku untuk **seluruh** subpohon, bukan hanya satu tingkat.

    **Menghapus simpul beranak dua dengan menaikkan anak kirinya.** Cara itu merusak
    aturan BST, karena anak kanan simpul yang dihapus jadi tidak punya tempat. Yang
    benar adalah memakai penerus.

    **Lupa kasus pohon kosong.** `akar` bernilai `None` adalah keadaan yang sah, dan
    pencarian pada pohon kosong harus mengembalikan "tidak ada" tanpa melempar error.
    Fungsi yang langsung membaca `akar.nilai` akan gagal di sini.

    **Mengira inorder sama dengan preorder.** Namanya memang mirip, tetapi urutannya
    berbeda, dan hanya inorder yang menghasilkan urutan menaik pada BST. Tertukarnya
    keduanya menghasilkan jawaban yang salah tanpa error apa pun.

    Satu catatan penutup tentang **tinggi pohon**: ia bergantung sepenuhnya pada urutan
    pemasukan, bukan pada banyaknya nilai. Karena itu pohon yang sama isinya bisa punya
    tinggi yang sangat berbeda — dan biaya operasinya ikut berbeda.

  en: |
    ## From one direction to branching

    In Topic 3 you met the linked list: a chain of nodes where each one points to
    **one** next node. Now imagine a node that may point to **two** nodes at once. The
    shape born from that idea is called a **tree**.

    The name is deliberately borrowed from a tree growing upside down: the peak is at
    the top, and the branches spread downward.

    ```
                50              <- root
              /    \
            30      70          <- left child and right child
           /  \    /  \
         20   40  60   80       <- leaves
    ```

    The basic terms, from top to bottom:

    - **Root** — the topmost node, and the only entrance.
    - **Child** — a node below another node.
    - **Leaf** — a node with no children at all.
    - **Subtree** — a node together with all of its descendants.

    A binary tree node looks almost the same as a linked list node. It differs in one
    way: it holds **two** pointers, not one.

    ```python
    class Simpul:
        def __init__(self, nilai):
            self.nilai = nilai
            self.kiri = None
            self.kanan = None


    akar = Simpul(50)
    akar.kiri = Simpul(30)
    akar.kanan = Simpul(70)

    print("akar       :", akar.nilai)
    print("anak kiri  :", akar.kiri.nilai)
    print("anak kanan :", akar.kanan.nilai)
    print("daun       :", akar.kiri.nilai, "dan", akar.kanan.nilai)
    ```

    Notice that there is **nothing new** in the mechanism. This is exactly a linked list
    node, with one extra pointer. What changes is the overall shape you can build from
    it — and that shape is what makes a tree useful.

    ## The rule that makes searching fast

    A plain binary tree is not necessarily fast to search. If values are placed at
    random, finding one can mean checking every node.

    What makes it fast is one extra rule. A binary tree that obeys it is called a
    **binary search tree**, or BST:

    > For every node, **every** value in its left subtree is smaller, and **every**
    > value in its right subtree is larger.

    Pay attention to the word "every". It is not just the left child that is smaller —
    it is the entire left subtree. This rule holds for every node, not only the root.

    With that rule, finding a value becomes much like the binary search from Topic 8:
    compare against the node you are holding, then discard the half of the tree that
    cannot contain it.

    ```python
    class Simpul:
        def __init__(self, nilai):
            self.nilai = nilai
            self.kiri = None
            self.kanan = None


    def sisip(akar, nilai):
        if akar is None:
            return Simpul(nilai)
        if nilai < akar.nilai:
            akar.kiri = sisip(akar.kiri, nilai)
        elif nilai > akar.nilai:
            akar.kanan = sisip(akar.kanan, nilai)
        return akar


    akar = None
    for nilai in [50, 30, 70, 20, 40, 60, 80]:
        akar = sisip(akar, nilai)

    print("akar           :", akar.nilai)
    print("subpohon kiri  :", akar.kiri.nilai)
    print("subpohon kanan :", akar.kanan.nilai)
    ```

    The `sisip` function above is recursive, and the pattern is worth recognising. If
    the incoming value is smaller, it descends into the left subtree; if larger, into
    the right. When there is no node there any more, that is where the new node is
    placed. A value that is **equal** is deliberately ignored — a BST usually does not
    store duplicates.

    ## Searching: discarding half at each step

    Searching for a value uses the same rule, but without creating a new node. At each
    step there are only three possibilities: found, go left, or go right.

    ```python
    class Simpul:
        def __init__(self, nilai):
            self.nilai = nilai
            self.kiri = None
            self.kanan = None


    def sisip(akar, nilai):
        if akar is None:
            return Simpul(nilai)
        if nilai < akar.nilai:
            akar.kiri = sisip(akar.kiri, nilai)
        elif nilai > akar.nilai:
            akar.kanan = sisip(akar.kanan, nilai)
        return akar


    def cari(akar, target):
        langkah = 0
        sekarang = akar
        while sekarang is not None:
            langkah += 1
            if target == sekarang.nilai:
                return langkah
            if target < sekarang.nilai:
                sekarang = sekarang.kiri
            else:
                sekarang = sekarang.kanan
        return -1


    akar = None
    for nilai in [50, 30, 70, 20, 40, 60, 80]:
        akar = sisip(akar, nilai)

    print("cari 40 ->", cari(akar, 40), "simpul diperiksa")
    print("cari 45 ->", cari(akar, 45), "(tidak ada)")
    ```

    Searching for `40` checks only **3 nodes**: `50` (go left), `30` (go right), `40`
    (found). The other seven nodes are never touched — the root's right subtree is
    discarded at once, because everything in it must be larger than `50`.

    ## Removing: the messiest case

    Adding and searching never break the BST rule. Removing can, and that is why it is
    the case that needs the most thought. There are three situations, and each needs its
    own handling.

    **A leaf node** — no children. Just drop it: its parent's pointer becomes `None`.
    Nothing has to be moved.

    **A node with one child** — only a left child or only a right child. That child
    moves straight up to take its place. The BST rule keeps holding, because everything
    in that child's subtree was already on the correct side.

    **A node with two children** — this is the messy one. If the node were simply
    dropped, two subtrees would lose the thing they hang from. The fix: find the
    **successor** — the node holding the smallest value that is still larger — then move
    the successor's value into the node being removed. A node's successor always lives
    in its right subtree, and is always the leftmost node there.

    ```python
    class Simpul:
        def __init__(self, nilai):
            self.nilai = nilai
            self.kiri = None
            self.kanan = None


    def sisip(akar, nilai):
        if akar is None:
            return Simpul(nilai)
        if nilai < akar.nilai:
            akar.kiri = sisip(akar.kiri, nilai)
        elif nilai > akar.nilai:
            akar.kanan = sisip(akar.kanan, nilai)
        return akar


    def inorder(simpul, hasil):
        if simpul is None:
            return
        inorder(simpul.kiri, hasil)
        hasil.append(simpul.nilai)
        inorder(simpul.kanan, hasil)


    def hapus(akar, nilai):
        if akar is None:
            return None
        if nilai < akar.nilai:
            akar.kiri = hapus(akar.kiri, nilai)
        elif nilai > akar.nilai:
            akar.kanan = hapus(akar.kanan, nilai)
        else:
            if akar.kiri is None and akar.kanan is None:
                return None
            if akar.kiri is None:
                return akar.kanan
            if akar.kanan is None:
                return akar.kiri
            pengganti = akar.kanan
            while pengganti.kiri is not None:
                pengganti = pengganti.kiri
            akar.nilai = pengganti.nilai
            akar.kanan = hapus(akar.kanan, pengganti.nilai)
        return akar


    akar = None
    for nilai in [50, 30, 70, 20, 40, 60, 80]:
        akar = sisip(akar, nilai)

    sebelum = []
    inorder(akar, sebelum)
    print("sebelum hapus 30 :", sebelum)

    akar = hapus(akar, 30)

    sesudah = []
    inorder(akar, sesudah)
    print("sesudah hapus 30 :", sesudah)
    print("penggantinya adalah penerus 30, yaitu", akar.kiri.nilai)
    ```

    Notice the result stays ascending after the removal. That is no accident — it is the
    sign that the BST rule still holds.

    ## Three ways to walk a tree

    Walking a tree means visiting every node exactly once. Unlike a linked list, which
    has only one direction, a tree has three common orders, and their names tell you
    when the node itself is visited.

    - **In-order** — left, then the node, then right.
    - **Pre-order** — the node first, then left, then right.
    - **Post-order** — left, right, then the node.

    ```python
    class Simpul:
        def __init__(self, nilai):
            self.nilai = nilai
            self.kiri = None
            self.kanan = None


    def sisip(akar, nilai):
        if akar is None:
            return Simpul(nilai)
        if nilai < akar.nilai:
            akar.kiri = sisip(akar.kiri, nilai)
        elif nilai > akar.nilai:
            akar.kanan = sisip(akar.kanan, nilai)
        return akar


    def inorder(simpul, hasil):
        if simpul is None:
            return
        inorder(simpul.kiri, hasil)
        hasil.append(simpul.nilai)
        inorder(simpul.kanan, hasil)


    def preorder(simpul, hasil):
        if simpul is None:
            return
        hasil.append(simpul.nilai)
        preorder(simpul.kiri, hasil)
        preorder(simpul.kanan, hasil)


    def postorder(simpul, hasil):
        if simpul is None:
            return
        postorder(simpul.kiri, hasil)
        postorder(simpul.kanan, hasil)
        hasil.append(simpul.nilai)


    akar = None
    for nilai in [50, 30, 70, 20, 40, 60, 80]:
        akar = sisip(akar, nilai)

    a, b, c = [], [], []
    inorder(akar, a)
    preorder(akar, b)
    postorder(akar, c)
    print("inorder   :", a)
    print("preorder  :", b)
    print("postorder :", c)
    ```

    Look at the **in-order traversal** result: `[20, 30, 40, 50, 60, 70, 80]` —
    ascending. That is no accident, but a direct consequence of the BST rule. That is
    why in-order is the easiest way to check whether a tree really is a BST: if the
    result is not ascending, the rule is broken somewhere.

    ## The shape of the tree decides the cost

    This is the most important lesson of this Topic. The same BST operations can be very
    fast or very slow, **depending on the shape of the tree** — not on the code.

    If the values happen to arrive in a spread-out order, the tree grows balanced: each
    node has a left and a right child, and its height is roughly `log₂(n)`. Searching
    such a tree checks few nodes.

    But look at what happens if the values arrive **in ascending order**:

    ```python
    class Simpul:
        def __init__(self, nilai):
            self.nilai = nilai
            self.kiri = None
            self.kanan = None


    def sisip(akar, nilai):
        if akar is None:
            return Simpul(nilai)
        if nilai < akar.nilai:
            akar.kiri = sisip(akar.kiri, nilai)
        elif nilai > akar.nilai:
            akar.kanan = sisip(akar.kanan, nilai)
        return akar


    def tinggi(simpul):
        if simpul is None:
            return 0
        kiri = tinggi(simpul.kiri)
        kanan = tinggi(simpul.kanan)
        return 1 + (kiri if kiri > kanan else kanan)


    seimbang = None
    for nilai in [50, 30, 70, 20, 40, 60, 80]:
        seimbang = sisip(seimbang, nilai)

    miring = None
    for nilai in [10, 20, 30, 40, 50, 60, 70]:
        miring = sisip(miring, nilai)

    print("7 simpul tersusun seimbang -> tinggi", tinggi(seimbang))
    print("7 simpul tersusun menaik   -> tinggi", tinggi(miring))
    ```

    The same seven values produce a **height of 3** when arranged balanced, and a
    **height of 7** when arranged ascending. The second shape is called a **skewed
    binary search tree**, and on that shape a BST is no better than a linked list:
    finding the largest value means walking all seven nodes one by one.

    This is why "a BST is `O(log n)`" is an incomplete statement. What is true: a BST is
    `O(log n)` **when the tree is balanced**, and `O(n)` when it is skewed. A tree that
    keeps itself balanced has its own names (AVL tree, red-black tree), and that is
    beyond this Topic — but knowing that the problem exists, and that the fix is a
    variant of the BST, is enough here.

    ## Complexity table

    | Operation | Balanced binary search tree | Skewed binary search tree |
    |---|---|---|
    | Find one value | O(log n) | O(n) |
    | Insert one value | O(log n) | O(n) |
    | Remove one value | O(log n) | O(n) |
    | Walk every node | O(n) | O(n) |
    | Space | O(n) | O(n) |

    The last row is the same in both columns, and that is expected: whatever the shape,
    each node is stored once. What changes is **how many nodes must be checked** to find
    one value. Walking every node is also `O(n)` in both shapes, because it does visit
    all of them.

    ## Traps that catch people

    **Assuming a BST is always `O(log n)`.** Covered above, and it is the most common
    trap. Data arriving in order is the easiest trigger — and real-world data often
    arrives in order.

    **Checking only the direct children, not the whole subtree.** The following tree is
    **not** a BST, even though every direct child looks right:

    ```
              50
            /    \
          30      70
            \
             60        <- 60 is larger than 30, but sits in the LEFT subtree of 50
    ```

    `60` is larger than `30` (its own left child is fine), but `60` sits in the left
    subtree of `50` — when the whole left subtree should be smaller than `50`. The rule
    applies to the **whole** subtree, not just one level.

    **Removing a node with two children by promoting its left child.** That breaks the
    BST rule, because the removed node's right child is left with nothing to hang from.
    The correct move is to use the successor.

    **Forgetting the empty tree.** `akar` being `None` is a valid state, and searching an
    empty tree must report "not found" without raising an error. A function that reads
    `akar.nilai` straight away will fail here.

    **Confusing in-order with pre-order.** The names look alike, but the orders differ,
    and only in-order yields an ascending result on a BST. Swapping the two produces a
    wrong answer with no error at all.

    One closing note on **tree height**: it depends entirely on the insertion order, not
    on how many values there are. That is why the same set of values can have a very
    different height — and a correspondingly different operating cost.


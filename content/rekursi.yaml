      en: Simple recursion
    ruang: O(n)
    operasi:
      - nama: { id: Satu pemanggilan fungsi, en: One function call }
        waktu: O(1)
      - nama: { id: Telusuri n tingkat, en: Walk n levels }
        waktu: O(n)

  - struktur:

# **Nilai di sini wajib sama dengan tabel di bagian "Tabel kompleksitas" di Materi.**
# ADR-0019 mencatat bahwa keduanya memang bisa menyimpang dan tidak ada gerbang yang
# membandingkannya — yang menjaganya adalah disiplin saat menyunting, dan skrip
# pemeriksa mandiri Topik ini.

# Topik 6 — Rekursi.
#
# Topik keenam di Jalur, `prasyarat: [3, 4]` (Linked List, Stack & Queue). Materi di
# sini memakai dua hal dari Topik sebelumnya: gagasan "simpul yang menunjuk ke simpul
# lain" dari Linked List (#18), dan gagasan "tumpukan yang menyimpan jejak" dari
# Stack & Queue (#4). Rekursi memakai keduanya sekaligus — pemanggilan fungsi yang
# bersarang menumpuk seperti Stack, dan itulah yang membuat keduanya jadi prasyarat.
#
# **ADA penyimpangan yang dicatat.** `docs/design-tree.md` menetapkan Soal Kode
# berbentuk "implementasi struktur data dari nol". Rekursi **bukan** struktur data,
# jadi bentuk itu tidak bisa dipakai apa adanya di sini — persis situasi Big-O (#16),
# yang menyimpang lewat ADR-0023. Soal Kode Topik ini menjadi **menulis dua fungsi
# rekursif dari nol dan mengembalikan jumlah pemanggilannya**, supaya kedalaman
# rekursi dan pertumbuhan pemanggilan terasa sebagai angka yang bisa diperiksa test
# case. Field `kompleksitas` juga diisi **algoritma yang dianalisis**, bukan struktur
# data — sama seperti #16. Kedua penyimpangan itu diputuskan pemilik dan dicatat di
# `docs/adr/0025-bentuk-soal-kode-rekursi.md`.
#
# **Pembahasan hanya untuk kelima Kuis.** Soal Kode di sini tidak punya Pembahasan,
# karena skema di issue #1 — dan `frontend/src/lib/konten/tipe.ts` — tidak punya field
# `penjelasan` pada `SoalKode`. Pemilik sudah memutuskan (2026-10-06) bahwa cukup 5
# Pembahasan per Topik, sama seperti #10, #16, #17, #18, dan #19.
#
# Semua Soal dan Pembahasan di sini ditulis original, sesuai ADR-0005. Tidak ada teks
# LeetCode yang disalin maupun diterjemahkan.
#
# **Setiap angka di berkas ini sudah dijalankan, bukan dibaca.** Yang diperiksa dengan
# menjalankan Python: jumlah pemanggilan `fib(5)` = 15 (dan diagram pohonnya digambar
# lengkap 15 simpul); jumlah pemanggilan `fib(30)` naif = 2.692.537 sedangkan versi
# memoisasi = 59; urutan cetak sebelum dan sesudah rekursi; `RecursionError` pada
# `n = 2000` sedangkan `n = 900` masih aman; dan kelima test case Soal Kode. Angka
# batasnya sengaja 900/2000, bukan 999/1000: titik gagal yang persis bergantung pada
# kedalaman pemanggilnya, dan klaim "999 aman" yang mula-mula ditulis di sini **salah**
# — lihat ADR-0025. Jebakan 78 dari handoff #18 memperingatkan
# bahwa gerbang yang ada tidak menangkap kelas cacat isi — rumus yang salah, pengecoh
# yang ternyata juga benar, dan kartu yang mengajarkan di luar Materi. Karena itu berkas
# ini ditulis
# berdampingan dengan skrip pemeriksa mandiri, dan **setiap pengecoh sudah dipastikan
# benar-benar salah** (bukan sekadar terlihat salah).
#
# `nomor`, `slug`, `judul`, dan `prasyarat` harus sama dengan content/jalur.yaml —
# validator menolak build kalau berbeda.

nomor: 6
slug: rekursi
judul:
  id: Rekursi
  en: Recursion
prasyarat: [3, 4]

# Sumber terstruktur untuk ekspor CSV/Anki (ticket #14). Karena rekursi bukan struktur
# data, isinya **algoritma yang dianalisis** — sama seperti Big-O (#16) dan sesuai
# ADR-0023. Nama field tetap `struktur`; yang berbeda isinya. Mengganti nama field itu
# akan menyentuh `tipe.ts`, validator, penyusun kartu, dan uji-ujinya demi satu Topik —
# dan aturan repo ini adalah abstraksi diubah saat ada kebutuhan kedua yang nyata.
#
# `waktu` dan `ruang` memakai notasi O(...) apa adanya — notasi itu sama di kedua
# bahasa, jadi menerjemahkannya hanya menghasilkan dua salinan yang bisa menyimpang.
#
# **Nilai yang memuat koma WAJIB dikutip.** Dalam pemetaan alir YAML (`{ ... }`), koma
# memisahkan entri — jadi `{ id: A, B, en: ... }` menghasilkan `id: "A"` plus kunci
# liar `B: null`, dan kata itu hilang dari kartu tanpa error apa pun. Gerbang konten
# tidak menangkapnya (jebakan 80). Kutipan di bawah bukan hiasan.

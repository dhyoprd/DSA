# Topik 2 — Array & String.
#
# Topik kedua di Jalur, `prasyarat: [1]` (Big-O). Materi di sini memakai notasi O(...)
# yang diajarkan Topik 1, jadi keduanya berurutan dengan sengaja.
#
# **Tidak ada penyimpangan yang perlu dicatat.** `docs/design-tree.md` menetapkan Soal
# Kode berbentuk "implementasi struktur data dari nol". Array **adalah** struktur data,
# jadi bentuk itu bisa dipakai apa adanya di sini — berbeda dari Big-O (#16), yang bukan
# struktur data dan karena itu butuh ADR-0023. Berkas ini tidak menuntut ADR baru.
#
# **Pembahasan hanya untuk kelima Kuis.** Soal Kode di sini tidak punya Pembahasan,
# karena skema di issue #1 — dan `frontend/src/lib/konten/tipe.ts` — tidak punya field
# `penjelasan` pada `SoalKode`. Menambahkannya berarti perubahan skema. Pemilik sudah
# memutuskan (2026-10-06) bahwa cukup 5 Pembahasan, sama seperti #16 dan #10 yang juga
# diterima tanpa Pembahasan Soal Kode.
#
# Semua Soal dan Pembahasan di sini ditulis original, sesuai ADR-0005. Tidak ada teks
# LeetCode yang disalin maupun diterjemahkan.
#
# `nomor`, `slug`, `judul`, dan `prasyarat` harus sama dengan content/jalur.yaml —

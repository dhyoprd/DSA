# Kode berbentuk "implementasi struktur data dari nol". Linked List **adalah** struktur
# data, jadi bentuk itu bisa dipakai apa adanya di sini — sama seperti Array & String
# (#17), dan berbeda dari Big-O (#16), yang bukan struktur data dan karena itu butuh
# ADR-0023. Berkas ini tidak menuntut ADR baru.
